name: Build Blender iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 210

    steps:
      # ============================================================
      # 0. 安装依赖
      # ============================================================
      - name: Install dependencies
        run: |
          brew install git-lfs cmake fmt
          git lfs install
          if [ ! -f /opt/homebrew/lib/libfmt.a ]; then
            echo "❌ fmt not installed correctly!"
            exit 1
          fi
          echo "✅ fmt installed at /opt/homebrew/lib/libfmt.a"
          FMT_CMAKE_DIR=$(find /opt/homebrew -name "fmt-config.cmake" 2>/dev/null | head -1 | xargs dirname)
          if [ -z "$FMT_CMAKE_DIR" ]; then
            echo "❌ fmt CMake config not found!"
            exit 1
          fi
          echo "FMT_CMAKE_DIR=$FMT_CMAKE_DIR" >> $GITHUB_ENV
          echo "✅ fmt CMake config at $FMT_CMAKE_DIR"

      # ============================================================
      # 1. 克隆 Blender 源码（跳过 LFS）
      # ============================================================
      - name: Clone Blender from official source (skip LFS)
        run: |
          GIT_LFS_SKIP_SMUDGE=1 git clone https://projects.blender.org/blender/blender.git -b ios --depth 1
          cd blender

      - name: Fix submodule URLs
        run: |
          cd blender
          sed -i '' 's/github\.com\/blender/projects.blender.org\/blender/g' .gitmodules
          git submodule sync --recursive

      # ============================================================
      # 1.5 缓存 iOS 库
      # ============================================================
      - name: Cache iOS libraries
        id: cache-ios
        uses: actions/cache@v4
        with:
          path: blender/lib/ios_arm64
          key: ios-libs-${{ hashFiles('blender/.gitmodules') }}
          restore-keys: |
            ios-libs-

      # ============================================================
      # 2. 克隆 iOS 预编译库（仅拉取 OpenEXR）
      # ============================================================
      - name: Clone iOS precompiled libraries (cache miss)
        if: steps.cache-ios.outputs.cache-hit != 'true'
        run: |
          cd blender
          rm -rf lib/ios_arm64
          git clone https://projects.blender.org/blender/lib-ios_arm64.git lib/ios_arm64
          cd lib/ios_arm64
          # 只拉取 OpenEXR
          git lfs pull --include="openexr/**"
          cd ../..
          echo "✅ iOS libraries cloned and OpenEXR LFS pulled"

      # ============================================================
      # 2.5 下载 OpenImageIO 动态库（从你的 GitHub Release）
      # ============================================================
      - name: Download OpenImageIO from custom release
        run: |
          cd blender/lib/ios_arm64/openimageio/lib/
          curl -L -o openimageio-libs.zip https://github.com/Austinzhao039/blender/releases/download/main/openimageio-libs.zip
          unzip -o openimageio-libs.zip
          rm openimageio-libs.zip
          ls -lh libOpenImageIO*.dylib
          if [ ! -f libOpenImageIO.dylib ] || [ $(stat -f%z libOpenImageIO.dylib) -lt 1000000 ]; then
            echo "❌ libOpenImageIO.dylib missing or too small!"
            exit 1
          fi
          echo "✅ OpenImageIO dynamic libraries ready"

      # ============================================================
      # 3. 验证 OpenEXR
      # ============================================================
      - name: Verify OpenEXR files
        run: |
          cd blender/lib/ios_arm64
          if [ ! -f "openexr/lib/libOpenEXR.dylib" ] && [ ! -f "openexr/lib/libOpenEXR.a" ]; then
            echo "⚠️  OpenEXR missing, pulling..."
            git lfs pull --include="openexr/**"
          fi
          if [ ! -f "openexr/lib/libOpenEXR.dylib" ] && [ ! -f "openexr/lib/libOpenEXR.a" ]; then
            echo "❌ OpenEXR library still missing!"
            exit 1
          fi
          echo "✅ OpenEXR is ready"

      # ============================================================
      # 4. (已跳过) 不再运行 make_update.py，避免触发 LFS 速率限制
      # ============================================================

      # ============================================================
      # 5. 下载 Python 3.13 动态库
      # ============================================================
      - name: Download Python 3.13 dynamic library from BeeWare
        run: |
          cd blender
          mkdir -p lib/ios_arm64/python/lib
          mkdir -p lib/ios_arm64/python/include

          curl -L -o python-ios.tar.gz \
            https://github.com/beeware/Python-Apple-support/releases/download/3.13-b14/Python-3.13-iOS-support.b14.tar.gz

          mkdir -p python_temp
          tar -xzf python-ios.tar.gz -C python_temp/

          XCFRAMEWORK_BASE="python_temp/Python.xcframework/ios-arm64"
          
          if [ -d "$XCFRAMEWORK_BASE" ]; then
            if [ -f "$XCFRAMEWORK_BASE/lib/libpython3.13.dylib" ]; then
              cp "$XCFRAMEWORK_BASE/lib/libpython3.13.dylib" lib/ios_arm64/python/lib/
              echo "✅ Copied libpython3.13.dylib"
            else
              echo "❌ libpython3.13.dylib not found!"
              exit 1
            fi
            
            if [ -d "$XCFRAMEWORK_BASE/include/python3.13" ]; then
              cp -r "$XCFRAMEWORK_BASE/include/python3.13/"* lib/ios_arm64/python/include/
              echo "✅ Copied headers"
            else
              echo "❌ Headers not found!"
              exit 1
            fi
          else
            echo "❌ XCFramework not found!"
            exit 1
          fi

          rm -rf python_temp python-ios.tar.gz

          if [ -f "lib/ios_arm64/python/lib/libpython3.13.dylib" ]; then
            echo "✅ Python 3.13 dynamic library installed!"
          else
            echo "❌ Python 3.13 dynamic library not found!"
            exit 1
          fi
          if [ -f "lib/ios_arm64/python/include/Python.h" ]; then
            echo "✅ Python headers installed!"
          else
            echo "❌ Python headers not found!"
            exit 1
          fi

      # ============================================================
      # 6. 动态查找库路径
      # ============================================================
      - name: Locate library paths dynamically
        id: locate_libs
        run: |
          cd blender
          LIB_BASE="$PWD/lib/ios_arm64"
          
          # ---- Python ----
          PYTHON_LIB="$LIB_BASE/python/lib/libpython3.13.dylib"
          if [ -f "$PYTHON_LIB" ]; then
            PYTHON_LIB_DIR=$(dirname "$PYTHON_LIB")
            echo "PYTHON_LIB_DIR=$PYTHON_LIB_DIR" >> $GITHUB_ENV
            echo "✅ Python library: $PYTHON_LIB"
          else
            echo "❌ Python library not found!"
            exit 1
          fi
          PYTHON_INC="$LIB_BASE/python/include/Python.h"
          if [ -f "$PYTHON_INC" ]; then
            PYTHON_INC_DIR=$(dirname "$PYTHON_INC")
            echo "PYTHON_INC_DIR=$PYTHON_INC_DIR" >> $GITHUB_ENV
            echo "✅ Python headers: $PYTHON_INC"
          else
            echo "❌ Python headers not found!"
            exit 1
          fi
          
          # ---- OpenEXR ----
          OPENEXR_LIB=$(find "$LIB_BASE/openexr/lib" -name "libOpenEXR.dylib" -type f | head -1)
          if [ -n "$OPENEXR_LIB" ]; then
            OPENEXR_LIB_DIR=$(dirname "$OPENEXR_LIB")
            echo "OPENEXR_LIB_DIR=$OPENEXR_LIB_DIR" >> $GITHUB_ENV
            echo "OPENEXR_LIB_FILE=$OPENEXR_LIB" >> $GITHUB_ENV
            echo "✅ OpenEXR library: $OPENEXR_LIB"
          else
            OPENEXR_LIB=$(find "$LIB_BASE/openexr/lib" -name "libOpenEXR.a" -type f | head -1)
            if [ -n "$OPENEXR_LIB" ]; then
              OPENEXR_LIB_DIR=$(dirname "$OPENEXR_LIB")
              echo "OPENEXR_LIB_DIR=$OPENEXR_LIB_DIR" >> $GITHUB_ENV
              echo "OPENEXR_LIB_FILE=$OPENEXR_LIB" >> $GITHUB_ENV
              echo "✅ OpenEXR library (static): $OPENEXR_LIB"
            else
              echo "❌ OpenEXR library not found!"
              exit 1
            fi
          fi
          OPENEXR_INC="$LIB_BASE/openexr/include/OpenEXR/OpenEXRConfig.h"
          if [ -f "$OPENEXR_INC" ]; then
            OPENEXR_INC_DIR=$(dirname "$OPENEXR_INC")
            echo "OPENEXR_INC_DIR=$OPENEXR_INC_DIR" >> $GITHUB_ENV
            echo "✅ OpenEXR headers: $OPENEXR_INC"
          else
            echo "❌ OpenEXR headers not found!"
            exit 1
          fi
          
          # ---- OpenImageIO ----
          OIIO_LIB="$LIB_BASE/openimageio/lib/libOpenImageIO.dylib"
          if [ -f "$OIIO_LIB" ]; then
            OIIO_LIB_DIR=$(dirname "$OIIO_LIB")
            echo "OIIO_LIB_DIR=$OIIO_LIB_DIR" >> $GITHUB_ENV
            echo "OIIO_LIB_FILE=$OIIO_LIB" >> $GITHUB_ENV
            echo "✅ OpenImageIO library: $OIIO_LIB"
          else
            echo "❌ OpenImageIO library not found!"
            exit 1
          fi
          OIIO_INC="$LIB_BASE/openimageio/include/OpenImageIO"
          if [ -d "$OIIO_INC" ]; then
            OIIO_INC_DIR=$(dirname "$OIIO_INC")
            echo "OIIO_INC_DIR=$OIIO_INC_DIR" >> $GITHUB_ENV
            echo "✅ OpenImageIO headers: $OIIO_INC"
          else
            echo "❌ OpenImageIO headers not found!"
            exit 1
          fi

      # ============================================================
      # 7. 创建 OpenEXR 的 CMake 假配置文件
      # ============================================================
      - name: Create missing CMake config files
        run: |
          cd blender
          LIB_BASE="$PWD/lib/ios_arm64"
          
          OPENEXR_DIR="$LIB_BASE/openexr"
          printf '%s\n' \
            "# Fake OpenEXRConfig.cmake" \
            "set(OpenEXR_FOUND TRUE)" \
            "set(OPENEXR_FOUND TRUE)" \
            "set(OPENEXR_INCLUDE_DIR \"${OPENEXR_INC_DIR}\")" \
            "set(OPENEXR_LIBRARY \"${OPENEXR_LIB_FILE}\")" \
            "set(OPENEXR_LIBRARIES \"${OPENEXR_LIB_FILE}\")" \
            "set(OPENEXR_VERSION_STRING \"3.1.0\")" \
            "set(OpenEXR_VERSION \"3.1.0\")" \
            > "$OPENEXR_DIR/OpenEXRConfig.cmake"
          cp "$OPENEXR_DIR/OpenEXRConfig.cmake" "$OPENEXR_DIR/openexr-config.cmake"
          echo "✅ Created OpenEXRConfig.cmake"

      # ============================================================
      # 8. 设置 Xcode 环境
      # ============================================================
      - name: Setup Xcode
        run: |
          XCODE_APP=$(ls /Applications/ | grep -E '^Xcode.*\.app$' | sort -V | tail -1)
          if [ -z "$XCODE_APP" ]; then
            echo "No Xcode found!"
            exit 1
          fi
          echo "Using Xcode: $XCODE_APP"
          sudo xcode-select -s "/Applications/$XCODE_APP"
          xcodebuild -version

      # ============================================================
      # 9. 生成 Xcode 项目
      # ============================================================
      - name: Generate Xcode project
        run: |
          cd blender
          rm -rf build_ios
          cmake -G Xcode -S . -B build_ios \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO \
            -DWITH_GTESTS=OFF \
            -DWITH_TESTS=OFF \
            -DWITH_DOCS=OFF \
            -DWITH_RUBBERBAND=OFF \
            -DWITH_OPENIMAGEIO=ON \
            -DPYTHON_LIBRARY="${PYTHON_LIB_DIR}/libpython3.13.dylib" \
            -DPYTHON_INCLUDE_DIR="${PYTHON_INC_DIR}" \
            -DOPENEXR_ROOT_DIR="$PWD/lib/ios_arm64/openexr" \
            -DOpenEXR_DIR="$PWD/lib/ios_arm64/openexr" \
            -Dfmt_DIR="${FMT_CMAKE_DIR}" \
            -DOPENIMAGEIO_ROOT_DIR="$PWD/lib/ios_arm64/openimageio" \
            -DOPENIMAGEIO_INCLUDE_DIR="${OIIO_INC_DIR}" \
            -DOPENIMAGEIO_LIBRARY="${OIIO_LIB_FILE}"

      # ============================================================
      # 10. 编译 Blender.app
      # ============================================================
      - name: Build Blender.app for iOS
        run: |
          cd blender/build_ios
          xcodebuild \
            -project Blender.xcodeproj \
            -target install \
            -sdk iphoneos \
            -configuration Release \
            -parallelizeTargets \
            -jobs 4 \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO

      # ============================================================
      # 11. 打包成未签名 IPA
      # ============================================================
      - name: Package unsigned IPA
        run: |
          cd blender/build_ios
          APP=$(find . -name "Blender.app" -type d | head -1)
          if [ -z "$APP" ]; then
            echo "ERROR: Blender.app not found!"
            find . -name "*.app" -type d
            exit 1
          fi
          echo "Found app at: $APP"
          du -sh "$APP"
          mkdir -p IPA/Payload
          cp -r "$APP" IPA/Payload/
          cd IPA && zip -r ../Blender.ipa Payload/ && cd ..
          ls -lh Blender.ipa

      # ============================================================
      # 12. 上传 IPA
      # ============================================================
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: blender-ipad-unsigned
          path: blender/build_ios/Blender.ipa
          retention-days: 30

      # ============================================================
      # 13. 失败时上传日志
      # ============================================================
      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            blender/build_ios/**/*.log
            blender/build_ios/**/*.txt
            blender/build_ios/CMakeCache.txt
            blender/build_ios/CMakeFiles/CMakeError.log
          retention-days: 7
