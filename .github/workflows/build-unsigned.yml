name: Build Blender iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 210

    steps:
      - name: Install dependencies
        run: |
          brew install git-lfs cmake pyenv
          git lfs install

      # ============================================================
      # 使用 pyenv 安装 Python 3.13（用于交叉编译辅助）
      # ============================================================
      - name: Setup Python 3.13 via pyenv
        run: |
          # 安装 Python 3.13.0
          pyenv install 3.13.0
          pyenv global 3.13.0
          # 设置环境变量
          echo "PYENV_ROOT=$HOME/.pyenv" >> $GITHUB_ENV
          echo "$HOME/.pyenv/shims:$HOME/.pyenv/bin" >> $GITHUB_PATH
          # 验证
          python3 --version

      - name: Clone Blender from official source
        run: |
          git clone https://projects.blender.org/blender/blender.git -b ios --depth 1
          cd blender
          git lfs pull

      - name: Fix submodule URLs
        run: |
          cd blender
          sed -i '' 's/github\.com\/blender/projects.blender.org\/blender/g' .gitmodules
          git submodule sync --recursive

      - name: Run make_update.py
        run: |
          cd blender
          python3 ./build_files/utils/make_update.py

      # ============================================================
      # 核心修复：如果 Python 缺失，自己编译一个
      # ============================================================
      - name: Build Python 3.13 for iOS (if missing)
        run: |
          cd blender
          if [ -f "lib/ios_arm64/python/lib/libpython3.13.a" ]; then
            echo "✅ Python already present, skipping build"
            exit 0
          fi
          
          echo "⚠️ Python 3.13 not found, building from source..."
          
          # 创建 Python 目录结构
          mkdir -p lib/ios_arm64/python/lib
          mkdir -p lib/ios_arm64/python/include
          
          # 下载 Python 源码
          cd /tmp
          curl -O https://www.python.org/ftp/python/3.13.0/Python-3.13.0.tar.xz
          tar -xf Python-3.13.0.tar.xz
          cd Python-3.13.0
          
          # 交叉编译 Python 为 iOS 静态库
          export SDKROOT=$(xcrun --sdk iphoneos --show-sdk-path)
          export CFLAGS="-arch arm64 -isysroot $SDKROOT -miphoneos-version-min=14.0"
          export CXXFLAGS="$CFLAGS"
          export LDFLAGS="-arch arm64 -isysroot $SDKROOT -miphoneos-version-min=14.0"
          
          # 使用 pyenv 安装的 Python 3.13 作为 build python
          BUILD_PYTHON="$HOME/.pyenv/shims/python3"
          
          # 配置并编译
          ./configure \
            --host=arm64-apple-ios \
            --build=$(./config.guess) \
            --prefix=/tmp/python-ios \
            --disable-framework \
            --disable-shared \
            --with-build-python=$BUILD_PYTHON \
            ac_cv_file__dev_ptmx=no \
            ac_cv_file__dev_ptc=no
          
          make -j4
          make install
          
          # 将编译好的库和头文件复制到 Blender 的 lib 目录
          cd $GITHUB_WORKSPACE/blender
          cp -r /tmp/python-ios/lib/* lib/ios_arm64/python/lib/
          cp -r /tmp/python-ios/include/* lib/ios_arm64/python/include/
          
          echo "✅ Python 3.13 compiled and installed!"

      - name: Verify Python library
        run: |
          cd blender
          if [ -f "lib/ios_arm64/python/lib/libpython3.13.a" ]; then
            echo "✅ Python 3.13 found!"
            ls -la lib/ios_arm64/python/lib/libpython3.13.a
          else
            echo "❌ Python 3.13 still missing!"
            exit 1
          fi

      # ============================================================
      # 后续标准编译步骤
      # ============================================================
      - name: Setup Xcode
        run: |
          XCODE_APP=$(ls /Applications/ | grep -E '^Xcode.*\.app$' | sort -V | tail -1)
          if [ -z "$XCODE_APP" ]; then
            echo "No Xcode found!"
            exit 1
          fi
          echo "Using Xcode: $XCODE_APP"
          sudo xcode-select -s "/Applications/$XCODE_APP"
          xcodebuild -version

      - name: Generate Xcode project
        run: |
          cd blender
          rm -rf build_ios
          cmake -G Xcode -S . -B build_ios \
            -DWITH_GTESTS=OFF \
            -DWITH_TESTS=OFF \
            -DWITH_DOCS=OFF

      - name: Build Blender.app for iOS
        run: |
          cd blender/build_ios
          xcodebuild \
            -project Blender.xcodeproj \
            -target install \
            -sdk iphoneos \
            -configuration Release \
            -parallelizeTargets \
            -jobs 4 \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO

      - name: Package unsigned IPA
        run: |
          cd blender/build_ios
          APP=$(find . -name "Blender.app" -type d | head -1)
          if [ -z "$APP" ]; then
            echo "ERROR: Blender.app not found!"
            find . -name "*.app" -type d
            exit 1
          fi
          echo "Found app at: $APP"
          du -sh "$APP"
          mkdir -p IPA/Payload
          cp -r "$APP" IPA/Payload/
          cd IPA && zip -r ../Blender.ipa Payload/ && cd ..
          ls -lh Blender.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: blender-ipad-unsigned
          path: blender/build_ios/Blender.ipa
          retention-days: 30

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            blender/build_ios/**/*.log
            blender/build_ios/**/*.txt
          retention-days: 7