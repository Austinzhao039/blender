name: Build Blender iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 210

    steps:
      # 1. 安装依赖
      - name: Install dependencies
        run: |
          brew install git-lfs cmake eigen fmt openimageio zstd
          git lfs install

      # 2. 直接从官方源克隆（而非 GitHub 镜像）
      - name: Clone Blender from official source
        run: |
          git clone https://projects.blender.org/blender/blender.git -b ios --depth 1
          cd blender
          # 拉取主仓库的 LFS 文件（这些文件在官方源中是完整的）
          git lfs pull

      # 3. 修正子模块 URL 并初始化所有子模块
      - name: Initialize submodules from official source
        run: |
          cd blender
          # 将子模块的 URL 从 github.com 重定向到 projects.blender.org
          sed -i 's/github\.com\/blender/projects.blender.org\/blender/g' .gitmodules
          git submodule sync --recursive
          git submodule update --init --recursive --force
          # 拉取每个子模块的 LFS 文件
          git submodule foreach git lfs pull

      # 4. 补全缺失的 iOS 库（fmt, eigen 等）
      - name: Bootstrap missing libraries
        run: |
          cd blender
          if [ ! -f lib/ios_arm64/fmt/include/fmt/core.h ]; then
            if [ -f ./build_files/utils/bootstrap_ios_fmt.sh ]; then
              bash ./build_files/utils/bootstrap_ios_fmt.sh
            else
              echo "WARNING: fmt bootstrap script not found"
            fi
          fi
          if [ ! -f lib/ios_arm64/eigen/share/eigen3/cmake/Eigen3Config.cmake ]; then
            if [ -f ./build_files/utils/bootstrap_ios_eigen.sh ]; then
              bash ./build_files/utils/bootstrap_ios_eigen.sh
            else
              echo "WARNING: eigen bootstrap script not found"
            fi
          fi

      # 5. 验证库文件是否存在
      - name: Verify libraries
        run: |
          cd blender
          echo "=== macOS libraries ==="
          ls -la lib/macos_arm64/ || echo "macOS libs missing!"
          echo "=== iOS libraries ==="
          ls -la lib/ios_arm64/ || echo "iOS libs missing!"
          echo "=== Python directory ==="
          ls -la lib/ios_arm64/python/ || echo "Python missing!"

      # 6. 自动选择最高版本 Xcode
      - name: Setup Xcode
        run: |
          XCODE_APP=$(ls /Applications/ | grep -E '^Xcode.*\.app$' | sort -V | tail -1)
          if [ -z "$XCODE_APP" ]; then
            echo "No Xcode found!"
            exit 1
          fi
          echo "Selected Xcode: $XCODE_APP"
          sudo xcode-select -s "/Applications/$XCODE_APP"
          xcodebuild -version

      # 7. 生成 Xcode 项目
      - name: Generate Xcode project
        run: |
          cd blender
          rm -rf build_ios
          cmake -G Xcode -S . -B build_ios \
            -DWITH_GTESTS=OFF \
            -DWITH_TESTS=OFF \
            -DWITH_DOCS=OFF

      # 8. 编译 Blender.app
      - name: Build Blender.app for iOS
        run: |
          cd blender/build_ios
          xcodebuild \
            -project Blender.xcodeproj \
            -target install \
            -sdk iphoneos \
            -configuration Release \
            -parallelizeTargets \
            -jobs 4 \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO

      # 9. 打包成未签名 IPA
      - name: Package unsigned IPA
        run: |
          cd blender/build_ios
          APP=$(find . -name "Blender.app" -type d | head -1)
          if [ -z "$APP" ]; then
            echo "ERROR: Blender.app not found!"
            find . -name "*.app" -type d
            exit 1
          fi
          echo "Found app at: $APP"
          du -sh "$APP"
          # 移除不必要的 Python 配置
          rm -rf "$APP/Assets/5.0/python/lib/python3.13/config-3.13-darwin" 2>/dev/null || true
          mkdir -p IPA/Payload
          cp -r "$APP" IPA/Payload/
          cd IPA
          zip -r ../Blender.ipa Payload/
          cd ..
          ls -lh Blender.ipa

      # 10. 上传 IPA
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: blender-ipad-unsigned
          path: blender/build_ios/Blender.ipa
          retention-days: 30

      # 11. 失败时上传日志
      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            blender/build_ios/**/*.log
            blender/build_ios/**/*.txt
          retention-days: 7