name: Build Blender for iOS (Unsigned)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 330

    steps:
      - name: Install Dependencies
        run: |
          brew install git cmake git-lfs
          git lfs install

      - name: Clone Blender from official source
        run: |
          git clone https://projects.blender.org/blender/blender.git
          cd blender
          git checkout ios

      - name: Pull LFS files (main repo)
        run: |
          cd blender
          git lfs fetch origin
          git lfs pull

      - name: Pull Libraries & Submodules
        run: |
          cd blender
          git submodule update --init --recursive
          ./build_files/utils/make_update.py --use-ios-libraries
          make update

      - name: Force pull LFS in ios_arm64
        run: |
          cd blender/lib/ios_arm64
          git lfs fetch --all
          git lfs pull

      - name: List ios_arm64 contents (debug)
        run: |
          echo "=== Contents of lib/ios_arm64 ==="
          ls -la blender/lib/ios_arm64/
          echo "=== Python directory ==="
          ls -la blender/lib/ios_arm64/python/ || echo "Python directory NOT found!"

      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: |
            blender/lib
            build_ios
          key: ${{ runner.os }}-blender-ios-${{ hashFiles('blender/build_files/utils/make_update.py') }}-v3
          restore-keys: |
            ${{ runner.os }}-blender-ios-

      # 移除了 Install iOS Simulator Runtime (因为已预装，且该命令在CI中会失败)

      - name: List available SDKs (optional, ignore errors)
        run: xcodebuild -showsdks || true

      - name: Generate Xcode project and disable signing
        run: |
          cmake -G "Xcode" -S blender -B build_ios
          sed -i '' 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g' build_ios/Blender.xcodeproj/project.pbxproj
          sed -i '' 's/CODE_SIGN_IDENTITY = "Apple Development";/CODE_SIGN_IDENTITY = "";/g' build_ios/Blender.xcodeproj/project.pbxproj
          sed -i '' 's/DEVELOPMENT_TEAM = .*;/DEVELOPMENT_TEAM = "";/g' build_ios/Blender.xcodeproj/project.pbxproj

      - name: Build with xcodebuild
        run: |
          cd build_ios
          xcodebuild -project Blender.xcodeproj \
                     -scheme blender \
                     -destination 'generic/platform=iOS' \
                     -configuration Release \
                     build \
                     CODE_SIGNING_ALLOWED=NO

      - name: Package as IPA
        run: |
          cd build_ios
          mkdir -p Payload
          cp -r Build/Products/Release-iphoneos/Blender.app Payload/
          zip -r Blender-iOS-unsigned.ipa Payload/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Blender-iOS-Unsigned
          path: build_ios/Blender-iOS-unsigned.ipa
          retention-days: 7