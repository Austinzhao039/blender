name: Build Blender iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 210

    steps:
      - name: Install dependencies
        run: |
          brew install git-lfs cmake
          git lfs install

      - name: Clone Blender from official source
        run: |
          git clone https://projects.blender.org/blender/blender.git -b ios --depth 1
          cd blender
          git lfs pull

      - name: Fix submodule URLs
        run: |
          cd blender
          sed -i '' 's/github\.com\/blender/projects.blender.org\/blender/g' .gitmodules
          git submodule sync --recursive

      # 优化后的 make_update.py 执行
      - name: Run make_update.py with retry
        run: |
          cd blender
          # 配置 Git LFS 重试
          git config --global lfs.transfer.maxretries 5
          git config --global lfs.transfer.retryinterval 5
          
          # 先初始化子模块（跳过 LFS）
          export GIT_LFS_SKIP_SMUDGE=1
          ./build_files/utils/make_update.py --no-lfs-fallback
          
          # 手动拉取 iOS 库的 LFS
          git lfs pull --include="lib/ios_arm64/**"

      # 备用方案：如果 make_update.py 拉取不完整，手动克隆
      - name: Manual clone of iOS libraries (fallback)
        run: |
          cd blender
          if [ ! -d "lib/ios_arm64/python" ]; then
            echo "Python not found, manually cloning lib-ios_arm64..."
            rm -rf lib/ios_arm64
            git clone https://projects.blender.org/blender/lib-ios_arm64.git lib/ios_arm64
            cd lib/ios_arm64
            git lfs pull
            cd ../..
          fi

      - name: Verify libraries
        run: |
          cd blender
          if [ -d "lib/ios_arm64/python" ]; then
            echo "✅ iOS Python found!"
          else
            echo "❌ iOS Python still missing!"
            exit 1
          fi

      - name: Generate Xcode project
        run: |
          cd blender
          rm -rf build_ios
          cmake -G Xcode -S . -B build_ios \
            -DWITH_GTESTS=OFF \
            -DWITH_TESTS=OFF \
            -DWITH_DOCS=OFF

      - name: Build Blender.app for iOS
        run: |
          cd blender/build_ios
          xcodebuild \
            -project Blender.xcodeproj \
            -target install \
            -sdk iphoneos \
            -configuration Release \
            -parallelizeTargets \
            -jobs 4 \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO

      - name: Package unsigned IPA
        run: |
          cd blender/build_ios
          APP=$(find . -name "Blender.app" -type d | head -1)
          if [ -z "$APP" ]; then
            echo "ERROR: Blender.app not found!"
            find . -name "*.app" -type d
            exit 1
          fi
          echo "Found app at: $APP"
          du -sh "$APP"
          mkdir -p IPA/Payload
          cp -r "$APP" IPA/Payload/
          cd IPA && zip -r ../Blender.ipa Payload/ && cd ..
          ls -lh Blender.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: blender-ipad-unsigned
          path: blender/build_ios/Blender.ipa
          retention-days: 30

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            blender/build_ios/**/*.log
            blender/build_ios/**/*.txt
          retention-days: 7
