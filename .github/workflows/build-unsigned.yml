name: Build Blender iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 210

    steps:
      - name: Install dependencies
        run: |
          brew install git-lfs cmake eigen fmt openimageio zstd
          git lfs install

      # 从官方源克隆
      - name: Clone Blender from official source
        run: |
          git clone https://projects.blender.org/blender/blender.git -b ios --depth 1
          cd blender
          git lfs pull

      # 修正子模块 URL
      - name: Fix submodule URLs
        run: |
          cd blender
          sed -i '' 's/github\.com\/blender/projects.blender.org\/blender/g' .gitmodules
          git submodule sync --recursive

      # 拉取所有子模块
      - name: Initialize submodules
        run: |
          cd blender
          git submodule update --init --recursive --force

      # ========== 核心修正：强制拉取 lib/ios_arm64 的 LFS ==========
      - name: Force pull iOS libraries
        run: |
          cd blender
          # 确保目录存在
          if [ ! -d "lib/ios_arm64" ]; then
            echo "⚠️ lib/ios_arm64 not found, initializing..."
            git submodule update --init lib/ios_arm64
          fi
          cd lib/ios_arm64
          # 直接从官方源拉取所有 LFS 对象
          git lfs fetch --all https://projects.blender.org/blender/lib-ios_arm64.git
          git lfs checkout
          cd ../..
          echo "✅ iOS libraries pulled successfully"
          ls -la lib/ios_arm64/ | head -20

      # 同样处理 macOS 库（CMake 需要）
      - name: Force pull macOS libraries
        run: |
          cd blender
          if [ ! -d "lib/macos_arm64" ]; then
            git submodule update --init lib/macos_arm64
          fi
          cd lib/macos_arm64
          git lfs fetch --all https://projects.blender.org/blender/lib-macos_arm64.git
          git lfs checkout
          cd ../..
          echo "✅ macOS libraries pulled successfully"
          ls -la lib/macos_arm64/ | head -20

      # 特别检查 Python 目录
      - name: Verify Python library
        run: |
          cd blender
          if [ -d "lib/ios_arm64/python" ]; then
            echo "✅ Python found:"
            ls -la lib/ios_arm64/python/
          else
            echo "❌ Python missing! Checking LFS files..."
            cd lib/ios_arm64
            git lfs ls-files | grep python
            cd ../..
            exit 1
          fi

      # 自动选择最高版本 Xcode
      - name: Setup Xcode
        run: |
          XCODE_APP=$(ls /Applications/ | grep -E '^Xcode.*\.app$' | sort -V | tail -1)
          if [ -z "$XCODE_APP" ]; then
            echo "No Xcode found!"
            exit 1
          fi
          echo "Selected Xcode: $XCODE_APP"
          sudo xcode-select -s "/Applications/$XCODE_APP"
          xcodebuild -version

      # 生成 Xcode 项目
      - name: Generate Xcode project
        run: |
          cd blender
          rm -rf build_ios
          cmake -G Xcode -S . -B build_ios \
            -DWITH_GTESTS=OFF \
            -DWITH_TESTS=OFF \
            -DWITH_DOCS=OFF

      # 编译
      - name: Build Blender.app for iOS
        run: |
          cd blender/build_ios
          xcodebuild \
            -project Blender.xcodeproj \
            -target install \
            -sdk iphoneos \
            -configuration Release \
            -parallelizeTargets \
            -jobs 4 \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO

      # 打包
      - name: Package unsigned IPA
        run: |
          cd blender/build_ios
          APP=$(find . -name "Blender.app" -type d | head -1)
          if [ -z "$APP" ]; then
            echo "ERROR: Blender.app not found!"
            find . -name "*.app" -type d
            exit 1
          fi
          echo "Found app at: $APP"
          du -sh "$APP"
          rm -rf "$APP/Assets/5.0/python/lib/python3.13/config-3.13-darwin" 2>/dev/null || true
          mkdir -p IPA/Payload
          cp -r "$APP" IPA/Payload/
          cd IPA
          zip -r ../Blender.ipa Payload/
          cd ..
          ls -lh Blender.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: blender-ipad-unsigned
          path: blender/build_ios/Blender.ipa
          retention-days: 30

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            blender/build_ios/**/*.log
            blender/build_ios/**/*.txt
          retention-days: 7