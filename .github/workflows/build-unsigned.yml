name: Build Blender iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 210

    steps:
      - name: Install dependencies
        run: |
          brew install git-lfs cmake
          git lfs install

      # ============================================================
      # 1. 克隆 Blender 源码
      # ============================================================
      - name: Clone Blender from official source
        run: |
          git clone https://projects.blender.org/blender/blender.git -b ios --depth 1
          cd blender
          git lfs pull

      - name: Fix submodule URLs
        run: |
          cd blender
          sed -i '' 's/github\.com\/blender/projects.blender.org\/blender/g' .gitmodules
          git submodule sync --recursive

      - name: Run make_update.py (base libs)
        run: |
          cd blender
          python3 ./build_files/utils/make_update.py

      # ============================================================
      # 2. 下载并提取 Python 3.13（自动适配目录结构）
      # ============================================================
      - name: Download and extract Python 3.13 for iOS
        run: |
          cd blender
          
          # 下载预编译包
          echo "Downloading Python 3.13 prebuilt package from BeeWare..."
          curl -L -o python-ios.tar.gz \
            https://github.com/beeware/Python-Apple-support/releases/download/3.13-b14/Python-3.13-iOS-support.b14.tar.gz
          
          # 查看压缩包内容（调试）
          echo "Contents of the tarball (top level):"
          tar -tzf python-ios.tar.gz | head -20
          
          # 创建一个临时目录用于解压
          mkdir -p python_temp
          tar -xzf python-ios.tar.gz -C python_temp/
          
          # 查找实际的 libpython3.13.a 文件
          echo "Searching for libpython3.13.a..."
          find python_temp -name "libpython3.13.a" -type f
          
          # 查找实际的 python 头文件
          echo "Searching for Python.h..."
          find python_temp -name "Python.h" -type f
          
          # 根据找到的结构复制文件
          # 首先尝试最常见的结构：解压后直接有 include/ 和 lib/ 目录
          if [ -d "python_temp/include" ] && [ -d "python_temp/lib" ]; then
            echo "✅ Found include/ and lib/ at top level"
            cp -r python_temp/include/* lib/ios_arm64/python/include/ 2>/dev/null || true
            cp -r python_temp/lib/* lib/ios_arm64/python/lib/ 2>/dev/null || true
          fi
          
          # 如果上面没找到，尝试查找实际的库文件位置
          if [ ! -f "lib/ios_arm64/python/lib/libpython3.13.a" ]; then
            echo "Trying alternative structure..."
            # 查找实际的 libpython3.13.a 文件位置
            LIB_PATH=$(find python_temp -name "libpython3.13.a" -type f | head -1)
            if [ -n "$LIB_PATH" ]; then
              echo "Found libpython3.13.a at: $LIB_PATH"
              # 获取所在目录的父目录
              LIB_DIR=$(dirname "$LIB_PATH")
              # 将包含库的目录内容复制到目标
              mkdir -p lib/ios_arm64/python/lib/
              cp "$LIB_PATH" lib/ios_arm64/python/lib/
            fi
            
            # 查找 Python.h 文件位置
            HEADER_PATH=$(find python_temp -name "Python.h" -type f | head -1)
            if [ -n "$HEADER_PATH" ]; then
              echo "Found Python.h at: $HEADER_PATH"
              # 获取 include 目录的父目录
              HEADER_DIR=$(dirname "$HEADER_PATH")
              mkdir -p lib/ios_arm64/python/include/
              cp -r "$HEADER_DIR"/* lib/ios_arm64/python/include/ 2>/dev/null || true
            fi
          fi
          
          # 清理临时文件
          rm -rf python_temp python-ios.tar.gz
          
          # 最终验证
          echo "Final verification:"
          if [ -f "lib/ios_arm64/python/lib/libpython3.13.a" ]; then
            echo "✅ Python 3.13 library successfully installed!"
            ls -la lib/ios_arm64/python/lib/libpython3.13.a
          else
            echo "❌ Python 3.13 library not found!"
            echo "Directory structure after extraction:"
            find lib/ios_arm64/python/ -type f | head -20
            exit 1
          fi

      # ============================================================
      # 3. 验证所有关键库
      # ============================================================
      - name: Verify libraries
        run: |
          cd blender
          echo "=== Checking macOS libraries ==="
          ls -la lib/macos_arm64/ | head -10 || echo "macOS libs missing!"
          echo "=== Checking iOS libraries ==="
          ls -la lib/ios_arm64/ | head -10 || echo "iOS libs missing!"
          echo "=== Checking Python ==="
          if [ -f "lib/ios_arm64/python/lib/libpython3.13.a" ]; then
            echo "✅ Python 3.13 found!"
            file lib/ios_arm64/python/lib/libpython3.13.a
          else
            echo "❌ Python 3.13 still missing!"
            exit 1
          fi

      # ============================================================
      # 4. 设置 Xcode 并编译
      # ============================================================
      - name: Setup Xcode
        run: |
          XCODE_APP=$(ls /Applications/ | grep -E '^Xcode.*\.app$' | sort -V | tail -1)
          if [ -z "$XCODE_APP" ]; then
            echo "No Xcode found!"
            exit 1
          fi
          echo "Using Xcode: $XCODE_APP"
          sudo xcode-select -s "/Applications/$XCODE_APP"
          xcodebuild -version

      - name: Generate Xcode project
        run: |
          cd blender
          rm -rf build_ios
          cmake -G Xcode -S . -B build_ios \
            -DWITH_GTESTS=OFF \
            -DWITH_TESTS=OFF \
            -DWITH_DOCS=OFF

      - name: Build Blender.app for iOS
        run: |
          cd blender/build_ios
          xcodebuild \
            -project Blender.xcodeproj \
            -target install \
            -sdk iphoneos \
            -configuration Release \
            -parallelizeTargets \
            -jobs 4 \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO

      # ============================================================
      # 5. 打包并上传 IPA
      # ============================================================
      - name: Package unsigned IPA
        run: |
          cd blender/build_ios
          APP=$(find . -name "Blender.app" -type d | head -1)
          if [ -z "$APP" ]; then
            echo "ERROR: Blender.app not found!"
            find . -name "*.app" -type d
            exit 1
          fi
          echo "Found app at: $APP"
          du -sh "$APP"
          mkdir -p IPA/Payload
          cp -r "$APP" IPA/Payload/
          cd IPA && zip -r ../Blender.ipa Payload/ && cd ..
          ls -lh Blender.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: blender-ipad-unsigned
          path: blender/build_ios/Blender.ipa
          retention-days: 30

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            blender/build_ios/**/*.log
            blender/build_ios/**/*.txt
          retention-days: 7
