name: Build Blender for iOS (Unsigned)

on:
  workflow_dispatch: # 允许手动触发

jobs:
  build:
    runs-on: macos-15 # 使用 macOS 15 运行器
    timeout-minutes: 360 # 设置超时时间为6小时

    steps:
      # 1. 安装依赖
      - name: Install Dependencies
        run: |
          brew install git git-lfs cmake
          git lfs install && git lfs update

      # 2. 克隆代码 (只拉取 ios 分支)
      - name: Clone Blender iOS Branch
        run: |
          git clone https://projects.blender.org/blender/blender.git -b ios --depth 1
          cd blender

      # 3. 拉取库和子模块
      - name: Pull Libraries & Submodules
        run: |
          cd blender
          ./build_files/utils/make_update.py --use-ios-libraries
          make update
          git lfs pull origin ios

      # 4. 生成 Xcode 项目文件
      - name: Generate Xcode Project
        run: |
          cmake -G "Xcode" -S blender -B build_ios

      # 5. ⭐ 关键步骤：手动执行 Cross-Tools 脚本
      - name: Run Cross-Tools Script Manually
        run: |
          cd blender
          # 此脚本内容从 Xcode 项目中的 blender_cross_tools_compile target 获取
          # 你需要从本地 Xcode 打开项目后，复制该脚本的实际内容到这里
          echo "请将 blender_cross_tools_compile 的 Run Script 内容粘贴到这里"

      # 6. 编译 (禁用签名)
      - name: Build with xcodebuild
        run: |
          cd build_ios
          xcodebuild -project Blender.xcodeproj \
                     -scheme blender \
                     -destination 'generic/platform=iOS' \
                     -configuration Release \
                     build \
                     CODE_SIGNING_ALLOWED=NO

      # 7. 打包成 .ipa 文件
      - name: Package as IPA
        run: |
          cd build_ios
          mkdir -p Payload
          cp -r Build/Products/Release-iphoneos/Blender.app Payload/
          zip -r Blender-iOS-unsigned.ipa Payload/

      # 8. 上传编译产物
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Blender-iOS-Unsigned
          path: build_ios/Blender-iOS-unsigned.ipa
          retention-days: 7