name: Build Blender for iOS (Unsigned)

on:
  workflow_dispatch:  # 手动触发

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 360

    steps:
      # 1. 安装依赖
      - name: Install dependencies
        run: |
          brew install git git-lfs cmake
          git lfs install

      # 2. 克隆代码（使用官方源，只拉取 ios 分支）
      - name: Checkout Blender iOS branch
        uses: actions/checkout@v4
        with:
          repository: blender/blender
          ref: ios
          fetch-depth: 1
          lfs: true

      # 3. 拉取所有依赖库和子模块（正确用法：不带额外参数）
      - name: Pull libraries and submodules
        run: |
          ./build_files/utils/make_update.py
          make update
          # 确保所有子模块的 LFS 文件被拉取
          git submodule foreach git lfs pull

      # 4. 生成 Xcode 项目文件
      - name: Generate Xcode project
        run: |
          mkdir -p build_ios
          cmake -G "Xcode" -S . -B build_ios

      # 5. ⭐ 关键步骤：手动执行 Cross-Tools 脚本
      # 你必须从本地 Xcode 项目中复制该脚本的内容，替换下面的命令
      - name: Run Cross-Tools script manually
        run: |
          # 请将 blender_cross_tools_compile 的 Run Script 内容粘贴到下面
          # 示例（实际内容需从本地获取）：
          # ../build_ios/build_darwin_tools/bin/datatoc ...
          echo "请替换此行为实际的 Cross-Tools 脚本内容"

      # 6. 禁用代码签名（修改项目文件）
      - name: Disable code signing
        run: |
          cd build_ios
          sed -i '' 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g' Blender.xcodeproj/project.pbxproj
          sed -i '' 's/CODE_SIGN_IDENTITY = "Apple Development";/CODE_SIGN_IDENTITY = "";/g' Blender.xcodeproj/project.pbxproj
          sed -i '' 's/DEVELOPMENT_TEAM = .*;/DEVELOPMENT_TEAM = "";/g' Blender.xcodeproj/project.pbxproj

      # 7. 使用 xcodebuild 编译（强制禁用签名）
      - name: Build with xcodebuild
        run: |
          cd build_ios
          xcodebuild -project Blender.xcodeproj \
                     -scheme blender \
                     -destination 'generic/platform=iOS' \
                     -configuration Release \
                     build \
                     CODE_SIGNING_ALLOWED=NO

      # 8. 打包为 IPA
      - name: Package as IPA
        run: |
          cd build_ios
          mkdir -p Payload
          cp -r Build/Products/Release-iphoneos/Blender.app Payload/
          zip -r Blender-iOS-unsigned.ipa Payload/

      # 9. 上传编译产物
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Blender-iOS-Unsigned
          path: build_ios/Blender-iOS-unsigned.ipa
          retention-days: 7