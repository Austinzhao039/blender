name: Build Blender iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 210

    steps:
      # 依赖安装和克隆等步骤保持不变（略，可参考之前版本）
      # 以下只列出修改的关键部分

      - name: Generate Xcode project
        id: cmake_config
        run: |
          cd blender
          rm -rf build_ios
          cmake -G Xcode -S . -B build_ios \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO \
            -DWITH_GTESTS=OFF \
            -DWITH_TESTS=OFF \
            -DWITH_DOCS=OFF \
            -DWITH_RUBBERBAND=OFF \
            -DWITH_OPENIMAGEIO=ON \
            -DPYTHON_LIBRARY="${PYTHON_LIB_DIR}/libpython3.13.dylib" \
            -DPYTHON_INCLUDE_DIR="${PYTHON_INC_DIR}" \
            -DOPENEXR_ROOT_DIR="$PWD/lib/ios_arm64/openexr" \
            -DOpenEXR_DIR="$PWD/lib/ios_arm64/openexr" \
            -Dfmt_DIR="${FMT_CMAKE_DIR}" \
            -DOPENIMAGEIO_ROOT_DIR="$PWD/lib/ios_arm64/openimageio" \
            -DOPENIMAGEIO_INCLUDE_DIR="${OIIO_INC_DIR}" \
            -DOPENIMAGEIO_LIBRARY="${OIIO_LIB_FILE}" \
            -DOpenImageIO_DIR="$PWD/lib/ios_arm64/openimageio" \
            -DEigen3_DIR="$EIGEN3_DIR" \
            -DCeres_DIR="$CERES_DIR" \
            -DBoost_DIR="$Boost_DIR" \
            -DTBB_DIR="$TBB_DIR" \
            -DCMAKE_CXX_FLAGS="-isystem /usr/include/eigen3" \
            2>&1 | tee cmake_output.txt

      - name: Upload CMake output (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cmake-output
          path: |
            blender/cmake_output.txt
            blender/build_ios/CMakeFiles/CMakeError.log
            blender/build_ios/CMakeFiles/CMakeOutput.log
          retention-days: 7

      - name: Build Blender.app for iOS
        if: steps.cmake_config.outcome == 'success'
        run: |
          cd blender/build_ios
          xcodebuild \
            -project Blender.xcodeproj \
            -target install \
            -sdk iphoneos \
            -configuration Release \
            -parallelizeTargets \
            -jobs 4 \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO

      # 后续打包和上传步骤保持不变
