name: Build Blender iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 210

    steps:
      - name: Install dependencies
        run: |
          brew install git-lfs cmake
          git lfs install

      - name: Clone Blender from official source
        run: |
          git clone https://projects.blender.org/blender/blender.git -b ios --depth 1
          cd blender
          git lfs pull

      - name: Fix submodule URLs
        run: |
          cd blender
          sed -i '' 's/github\.com\/blender/projects.blender.org\/blender/g' .gitmodules
          git submodule sync --recursive

      # ============================================================
      # 第 1 阶段：运行 make_update.py（标准方法）
      # ============================================================
      - name: Method 1 - Run make_update.py
        run: |
          cd blender
          python3 ./build_files/utils/make_update.py

      # ============================================================
      # 第 2 阶段：如果 Python 仍缺失，尝试四种方法
      # ============================================================
      - name: Method 2-4 - Try alternative ways to get Python
        run: |
          cd blender
          
          # 检查 Python 是否已经存在
          if [ -f "lib/ios_arm64/python/lib/libpython3.13.a" ]; then
            echo "✅ Python 3.13 already present, skipping..."
            exit 0
          fi
          
          echo "⚠️ Python 3.13 not found, trying alternative methods..."
          
          # ----- 方法 2：用 --use-ios-python 参数重试 -----
          echo "📦 Method 2: make_update.py --use-ios-python"
          python3 ./build_files/utils/make_update.py --use-ios-python 2>/dev/null || true
          
          if [ -f "lib/ios_arm64/python/lib/libpython3.13.a" ]; then
            echo "✅ Method 2 succeeded!"
            exit 0
          fi
          
          # ----- 方法 3：手动拉取 LFS（只拉 Python） -----
          echo "📦 Method 3: git lfs pull --include=\"python/**\""
          cd lib/ios_arm64
          git lfs pull --include="python/**" 2>/dev/null || true
          cd ../..
          
          if [ -f "lib/ios_arm64/python/lib/libpython3.13.a" ]; then
            echo "✅ Method 3 succeeded!"
            exit 0
          fi
          
          # ----- 方法 4：强制从官方源拉取所有 LFS -----
          echo "📦 Method 4: git lfs fetch --all + checkout"
          cd lib/ios_arm64
          git lfs fetch --all https://projects.blender.org/blender/lib-ios_arm64.git 2>/dev/null || true
          git lfs checkout 2>/dev/null || true
          cd ../..
          
          if [ -f "lib/ios_arm64/python/lib/libpython3.13.a" ]; then
            echo "✅ Method 4 succeeded!"
            exit 0
          fi
          
          # ----- 所有方法都失败 -----
          echo "❌ All methods failed to get Python 3.13!"
          exit 1

      # ============================================================
      # 最终验证
      # ============================================================
      - name: Verify Python library
        run: |
          cd blender
          if [ -f "lib/ios_arm64/python/lib/libpython3.13.a" ]; then
            echo "✅ Python 3.13 found!"
          else
            echo "❌ Python 3.13 still missing!"
            exit 1
          fi

      # ============================================================
      # 后续标准编译步骤
      # ============================================================
      - name: Setup Xcode
        run: |
          XCODE_APP=$(ls /Applications/ | grep -E '^Xcode.*\.app$' | sort -V | tail -1)
          if [ -z "$XCODE_APP" ]; then
            echo "No Xcode found!"
            exit 1
          fi
          echo "Using Xcode: $XCODE_APP"
          sudo xcode-select -s "/Applications/$XCODE_APP"
          xcodebuild -version

      - name: Generate Xcode project
        run: |
          cd blender
          rm -rf build_ios
          cmake -G Xcode -S . -B build_ios \
            -DWITH_GTESTS=OFF \
            -DWITH_TESTS=OFF \
            -DWITH_DOCS=OFF

      - name: Build Blender.app for iOS
        run: |
          cd blender/build_ios
          xcodebuild \
            -project Blender.xcodeproj \
            -target install \
            -sdk iphoneos \
            -configuration Release \
            -parallelizeTargets \
            -jobs 4 \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO

      - name: Package unsigned IPA
        run: |
          cd blender/build_ios
          APP=$(find . -name "Blender.app" -type d | head -1)
          if [ -z "$APP" ]; then
            echo "ERROR: Blender.app not found!"
            find . -name "*.app" -type d
            exit 1
          fi
          echo "Found app at: $APP"
          du -sh "$APP"
          mkdir -p IPA/Payload
          cp -r "$APP" IPA/Payload/
          cd IPA && zip -r ../Blender.ipa Payload/ && cd ..
          ls -lh Blender.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: blender-ipad-unsigned
          path: blender/build_ios/Blender.ipa
          retention-days: 30

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            blender/build_ios/**/*.log
            blender/build_ios/**/*.txt
          retention-days: 7