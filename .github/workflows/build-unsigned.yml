name: Build Blender for iOS (Unsigned)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 330

    steps:
      # 1. 安装依赖 (Git, CMake, Git LFS)
      - name: Install Dependencies
        run: |
          brew install git cmake git-lfs
          git lfs install

      # 2. 从 Blender 官方源克隆代码
      - name: Clone Blender from official source
        run: |
          git clone https://projects.blender.org/blender/blender.git
          cd blender
          git checkout ios

      # 3. 拉取 LFS 文件
      - name: Pull LFS files
        run: |
          cd blender
          git lfs fetch origin
          git lfs pull

      # 4. 拉取子模块和依赖库
      - name: Pull Libraries & Submodules
        run: |
          cd blender
          ./build_files/utils/make_update.py --use-ios-libraries
          make update

      # 5. 配置缓存
      - name: Cache dependencies
        uses: actions/cache@v3
        with:
          path: |
            blender/lib
            build_ios
          key: ${{ runner.os }}-blender-ios-${{ hashFiles('blender/build_files/utils/make_update.py') }}
          restore-keys: |
            ${{ runner.os }}-blender-ios-

      # ⭐ 6. 新增：安装 iOS 18.0 SDK
      - name: Install iOS Simulator Runtime
        run: |
          sudo xcodebuild -downloadPlatform iOS

      # ⭐ 7. 新增：列出可用的 SDK 以供核对
      - name: List available SDKs
        run: xcodebuild -showsdks

      # 8. 生成 Xcode 项目并禁用签名
      - name: Generate Xcode project and disable signing
        run: |
          cmake -G "Xcode" -S blender -B build_ios
          sed -i '' 's/CODE_SIGN_STYLE = Automatic;/CODE_SIGN_STYLE = Manual;/g' build_ios/Blender.xcodeproj/project.pbxproj
          sed -i '' 's/CODE_SIGN_IDENTITY = "Apple Development";/CODE_SIGN_IDENTITY = "";/g' build_ios/Blender.xcodeproj/project.pbxproj
          sed -i '' 's/DEVELOPMENT_TEAM = .*;/DEVELOPMENT_TEAM = "";/g' build_ios/Blender.xcodeproj/project.pbxproj

      # 9. 编译 (强制禁止签名)
      - name: Build with xcodebuild
        run: |
          cd build_ios
          xcodebuild -project Blender.xcodeproj \
                     -scheme blender \
                     -destination 'generic/platform=iOS' \
                     -configuration Release \
                     build \
                     CODE_SIGNING_ALLOWED=NO

      # 10. 打包成 .ipa
      - name: Package as IPA
        run: |
          cd build_ios
          mkdir -p Payload
          cp -r Build/Products/Release-iphoneos/Blender.app Payload/
          zip -r Blender-iOS-unsigned.ipa Payload/

      # 11. 上传产物
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Blender-iOS-Unsigned
          path: build_ios/Blender-iOS-unsigned.ipa
          retention-days: 7
