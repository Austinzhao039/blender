name: Build Blender for iOS

on:
  workflow_dispatch:  # 手动触发

jobs:
  build:
    runs-on: macos-latest  # 必须使用 macOS 环境[reference:3]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew install git-lfs cmake
          git lfs install

      # ⭐ 核心步骤：运行 make_update.py 拉取所有依赖
      - name: Run make_update.py
        run: |
          ./build_files/utils/make_update.py --use-ios-libraries