name: Build Blender iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 210

    steps:
      - name: Install dependencies
        run: |
          brew install git-lfs cmake
          git lfs install

      # ============================================================
      # 1. 克隆 Blender 源码
      # ============================================================
      - name: Clone Blender from official source
        run: |
          git clone https://projects.blender.org/blender/blender.git -b ios --depth 1
          cd blender
          git lfs pull

      - name: Fix submodule URLs
        run: |
          cd blender
          sed -i '' 's/github\.com\/blender/projects.blender.org\/blender/g' .gitmodules
          git submodule sync --recursive

      # ============================================================
      # 2. 直接克隆完整的 iOS 预编译库
      # ============================================================
      - name: Clone iOS precompiled libraries (complete)
        run: |
          cd blender
          rm -rf lib/ios_arm64
          git clone https://projects.blender.org/blender/lib-ios_arm64.git lib/ios_arm64
          cd lib/ios_arm64
          git lfs pull
          cd ../..
          echo "✅ iOS libraries cloned successfully"

      # ============================================================
      # 3. 克隆 macOS 预编译库
      # ============================================================
      - name: Clone macOS precompiled libraries
        run: |
          cd blender
          rm -rf lib/macos_arm64
          git clone https://projects.blender.org/blender/lib-macos_arm64.git lib/macos_arm64
          cd lib/macos_arm64
          git lfs pull
          cd ../..

      # ============================================================
      # 4. 下载 Python 3.13 动态库
      # ============================================================
      - name: Download Python 3.13 dynamic library from BeeWare
        run: |
          cd blender
          mkdir -p lib/ios_arm64/python/lib
          mkdir -p lib/ios_arm64/python/include

          curl -L -o python-ios.tar.gz \
            https://github.com/beeware/Python-Apple-support/releases/download/3.13-b14/Python-3.13-iOS-support.b14.tar.gz

          mkdir -p python_temp
          tar -xzf python-ios.tar.gz -C python_temp/

          XCFRAMEWORK_BASE="python_temp/Python.xcframework/ios-arm64"
          
          if [ -d "$XCFRAMEWORK_BASE" ]; then
            if [ -f "$XCFRAMEWORK_BASE/lib/libpython3.13.dylib" ]; then
              cp "$XCFRAMEWORK_BASE/lib/libpython3.13.dylib" lib/ios_arm64/python/lib/
              echo "✅ Copied libpython3.13.dylib"
            else
              echo "❌ libpython3.13.dylib not found!"
              exit 1
            fi
            
            if [ -d "$XCFRAMEWORK_BASE/include/python3.13" ]; then
              cp -r "$XCFRAMEWORK_BASE/include/python3.13/"* lib/ios_arm64/python/include/
              echo "✅ Copied headers"
            else
              echo "❌ Headers not found!"
              exit 1
            fi
          else
            echo "❌ XCFramework not found!"
            exit 1
          fi

          rm -rf python_temp python-ios.tar.gz

          if [ -f "lib/ios_arm64/python/lib/libpython3.13.dylib" ]; then
            echo "✅ Python 3.13 dynamic library installed!"
          else
            echo "❌ Python 3.13 dynamic library not found!"
            exit 1
          fi
          if [ -f "lib/ios_arm64/python/include/Python.h" ]; then
            echo "✅ Python headers installed!"
          else
            echo "❌ Python headers not found!"
            exit 1
          fi

      # ============================================================
      # 5. 创建缺失的 CMake 配置文件（OpenEXR, fmt, OpenImageIO）
      # ============================================================
      - name: Create missing CMake config files
        run: |
          cd blender
          
          # ----- 5a. OpenEXR -----
          OPENEXR_DIR="$PWD/lib/ios_arm64/openexr"
          mkdir -p "$OPENEXR_DIR"
          OPENEXR_INC=$(find "$OPENEXR_DIR" -name "OpenEXRConfig.h" -type f | head -1)
          if [ -n "$OPENEXR_INC" ]; then
            OPENEXR_INC_DIR=$(dirname "$OPENEXR_INC")
          else
            OPENEXR_INC_DIR="$OPENEXR_DIR/include"
          fi
          OPENEXR_LIB=$(find "$OPENEXR_DIR" -name "libOpenEXR.a" -type f | head -1)
          if [ -n "$OPENEXR_LIB" ]; then
            OPENEXR_LIB_DIR=$(dirname "$OPENEXR_LIB")
          else
            OPENEXR_LIB_DIR="$OPENEXR_DIR/lib"
          fi
          cat > "$OPENEXR_DIR/OpenEXRConfig.cmake" << 'EOF'
# Fake OpenEXRConfig.cmake for cross-compilation
set(OpenEXR_FOUND TRUE)
set(OPENEXR_FOUND TRUE)
set(OPENEXR_INCLUDE_DIR "${OPENEXR_INC_DIR}")
set(OPENEXR_LIBRARY "${OPENEXR_LIB_DIR}/libOpenEXR.a")
set(OPENEXR_LIBRARIES "${OPENEXR_LIB_DIR}/libOpenEXR.a")
set(OPENEXR_VERSION_STRING "3.1.0")
set(OpenEXR_VERSION "3.1.0")
EOF
          sed -i '' "s|\${OPENEXR_INC_DIR}|${OPENEXR_INC_DIR}|g" "$OPENEXR_DIR/OpenEXRConfig.cmake"
          sed -i '' "s|\${OPENEXR_LIB_DIR}|${OPENEXR_LIB_DIR}|g" "$OPENEXR_DIR/OpenEXRConfig.cmake"
          cp "$OPENEXR_DIR/OpenEXRConfig.cmake" "$OPENEXR_DIR/openexr-config.cmake"
          echo "✅ Created OpenEXRConfig.cmake"
          
          # ----- 5b. fmt -----
          FMT_DIR="$PWD/lib/ios_arm64/fmt"
          mkdir -p "$FMT_DIR"
          FMT_INC=$(find "$FMT_DIR" -name "fmt" -type d | head -1)
          if [ -n "$FMT_INC" ]; then
            FMT_INC_DIR=$(dirname "$FMT_INC")
          else
            FMT_INC_DIR="$FMT_DIR/include"
          fi
          FMT_LIB=$(find "$FMT_DIR" -name "libfmt.a" -type f | head -1)
          if [ -n "$FMT_LIB" ]; then
            FMT_LIB_DIR=$(dirname "$FMT_LIB")
          else
            FMT_LIB_DIR="$FMT_DIR/lib"
          fi
          cat > "$FMT_DIR/fmt-config.cmake" << 'EOF'
# Fake fmt-config.cmake for cross-compilation
set(fmt_FOUND TRUE)
set(FMT_FOUND TRUE)
set(FMT_INCLUDE_DIR "${FMT_INC_DIR}")
set(FMT_LIBRARY "${FMT_LIB_DIR}/libfmt.a")
set(FMT_LIBRARIES "${FMT_LIB_DIR}/libfmt.a")
EOF
          sed -i '' "s|\${FMT_INC_DIR}|${FMT_INC_DIR}|g" "$FMT_DIR/fmt-config.cmake"
          sed -i '' "s|\${FMT_LIB_DIR}|${FMT_LIB_DIR}|g" "$FMT_DIR/fmt-config.cmake"
          cp "$FMT_DIR/fmt-config.cmake" "$FMT_DIR/fmtConfig.cmake"
          echo "✅ Created fmt-config.cmake"
          
          # ----- 5c. OpenImageIO -----
          OIIO_DIR="$PWD/lib/ios_arm64/openimageio"
          mkdir -p "$OIIO_DIR"
          # 查找头文件目录（通常为 include/OpenImageIO）
          OIIO_INC=$(find "$OIIO_DIR" -name "OpenImageIO" -type d | head -1)
          if [ -n "$OIIO_INC" ]; then
            OIIO_INC_DIR=$(dirname "$OIIO_INC")
          else
            OIIO_INC_DIR="$OIIO_DIR/include"
          fi
          # 查找库文件
          OIIO_LIB=$(find "$OIIO_DIR" -name "libOpenImageIO.a" -type f | head -1)
          if [ -n "$OIIO_LIB" ]; then
            OIIO_LIB_DIR=$(dirname "$OIIO_LIB")
          else
            OIIO_LIB_DIR="$OIIO_DIR/lib"
          fi
          cat > "$OIIO_DIR/OpenImageIOConfig.cmake" << 'EOF'
# Fake OpenImageIOConfig.cmake for cross-compilation
set(OpenImageIO_FOUND TRUE)
set(OPENIMAGEIO_FOUND TRUE)
set(OPENIMAGEIO_INCLUDE_DIR "${OIIO_INC_DIR}")
set(OPENIMAGEIO_LIBRARY "${OIIO_LIB_DIR}/libOpenImageIO.a")
set(OPENIMAGEIO_LIBRARIES "${OIIO_LIB_DIR}/libOpenImageIO.a")
EOF
          sed -i '' "s|\${OIIO_INC_DIR}|${OIIO_INC_DIR}|g" "$OIIO_DIR/OpenImageIOConfig.cmake"
          sed -i '' "s|\${OIIO_LIB_DIR}|${OIIO_LIB_DIR}|g" "$OIIO_DIR/OpenImageIOConfig.cmake"
          cp "$OIIO_DIR/OpenImageIOConfig.cmake" "$OIIO_DIR/openimageio-config.cmake"
          echo "✅ Created OpenImageIOConfig.cmake"

      # ============================================================
      # 6. 设置 Xcode 环境
      # ============================================================
      - name: Setup Xcode
        run: |
          XCODE_APP=$(ls /Applications/ | grep -E '^Xcode.*\.app$' | sort -V | tail -1)
          if [ -z "$XCODE_APP" ]; then
            echo "No Xcode found!"
            exit 1
          fi
          echo "Using Xcode: $XCODE_APP"
          sudo xcode-select -s "/Applications/$XCODE_APP"
          xcodebuild -version

      # ============================================================
      # 7. 生成 Xcode 项目
      # ============================================================
      - name: Generate Xcode project
        run: |
          cd blender
          rm -rf build_ios
          cmake -G Xcode -S . -B build_ios \
            -DWITH_GTESTS=OFF \
            -DWITH_TESTS=OFF \
            -DWITH_DOCS=OFF \
            -DPYTHON_LIBRARY="$PWD/lib/ios_arm64/python/lib/libpython3.13.dylib" \
            -DPYTHON_INCLUDE_DIR="$PWD/lib/ios_arm64/python/include" \
            -DOPENEXR_ROOT_DIR="$PWD/lib/ios_arm64/openexr" \
            -DOpenEXR_DIR="$PWD/lib/ios_arm64/openexr" \
            -Dfmt_DIR="$PWD/lib/ios_arm64/fmt" \
            -DOpenImageIO_DIR="$PWD/lib/ios_arm64/openimageio"

      # ============================================================
      # 8. 编译 Blender.app
      # ============================================================
      - name: Build Blender.app for iOS
        run: |
          cd blender/build_ios
          xcodebuild \
            -project Blender.xcodeproj \
            -target install \
            -sdk iphoneos \
            -configuration Release \
            -parallelizeTargets \
            -jobs 4 \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO

      # ============================================================
      # 9. 打包成未签名 IPA
      # ============================================================
      - name: Package unsigned IPA
        run: |
          cd blender/build_ios
          APP=$(find . -name "Blender.app" -type d | head -1)
          if [ -z "$APP" ]; then
            echo "ERROR: Blender.app not found!"
            find . -name "*.app" -type d
            exit 1
          fi
          echo "Found app at: $APP"
          du -sh "$APP"
          mkdir -p IPA/Payload
          cp -r "$APP" IPA/Payload/
          cd IPA && zip -r ../Blender.ipa Payload/ && cd ..
          ls -lh Blender.ipa

      # ============================================================
      # 10. 上传 IPA
      # ============================================================
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: blender-ipad-unsigned
          path: blender/build_ios/Blender.ipa
          retention-days: 30

      # ============================================================
      # 11. 失败时上传日志
      # ============================================================
      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            blender/build_ios/**/*.log
            blender/build_ios/**/*.txt
            blender/build_ios/CMakeCache.txt
            blender/build_ios/CMakeFiles/CMakeError.log
          retention-days: 7
