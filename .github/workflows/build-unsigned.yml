name: Build Blender iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 210

    steps:
      - name: Install dependencies
        run: |
          # fmt 不再依赖 homebrew 版本：12.2.0 的 pragma 宏在 iOS SDK 的 clang 下
          # 展开失败（ranges.h:26 unknown type name 'diagnostic'）。
          # 改用 lib-macos_arm64 配套的 12.1.0 头文件，见后面的 fmt 步骤。
          brew install git-lfs cmake zstd
          git lfs install
          if [ ! -f /opt/homebrew/lib/libzstd.dylib ]; then
            echo "ERROR: zstd not installed correctly!"
            exit 1
          fi
          echo "zstd installed at /opt/homebrew/lib/libzstd.dylib"

      - name: Clone Blender from official source (skip LFS)
        run: |
          rm -rf blender
          GIT_LFS_SKIP_SMUDGE=1 git clone https://projects.blender.org/blender/blender.git -b ios --depth 1
          cd blender

      - name: Fix submodule URLs
        run: |
          cd blender
          sed -i '' 's/github\.com\/blender/projects.blender.org\/blender/g' .gitmodules
          git submodule sync --recursive

      - name: Verify blender directory exists
        run: |
          if [ ! -d "blender" ]; then
            echo "ERROR: blender directory missing!"
            exit 1
          fi
          echo "blender directory exists"

      - name: Download startup.blend from Release (main2)
        run: |
          cd blender
          mkdir -p release/datafiles
          curl -L -o startup.zip https://github.com/Austinzhao039/blender/releases/download/main2/startup.zip
          unzip -o startup.zip
          rm startup.zip
          if [ -f "startup.blend" ]; then
            mv startup.blend release/datafiles/
          fi
          if [ -d "datafiles" ] && [ -f "datafiles/startup.blend" ]; then
            mv datafiles/* release/datafiles/ 2>/dev/null || true
            rmdir datafiles 2>/dev/null || true
          fi
          if [ ! -f "release/datafiles/startup.blend" ]; then
            git lfs pull --include="release/datafiles/startup.blend"
          fi
          if [ ! -f "release/datafiles/startup.blend" ]; then
            echo "ERROR: startup.blend still missing!"
            exit 1
          fi
          echo "startup.blend ready"

      - name: Setup host Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Provide host (macOS) Python for code generation
        run: |
          cd blender
          mkdir -p lib/macos_arm64/python/bin
          curl -fsSL -o macos-python.zip \
            https://github.com/Austinzhao039/blender/releases/download/mainly/macos-python.zip || true
          unzip -oq macos-python.zip || true
          rm -f macos-python.zip
          HP=lib/macos_arm64/python/bin/python3.13
          [ -f "$HP" ] || : > "$HP"
          chmod +x "$HP" 2>/dev/null || true

          # 这个预编译 python 在 xcodebuild 的 script phase 里可能 exec 不起来
          # （报 "cannot execute binary file"）。先自检，不行就换成 runner 上真 python 的包装脚本。
          if ! "$HP" -V > /tmp/hp.out 2>&1; then
            echo "WARN: bundled host python unusable: $(cat /tmp/hp.out)"
            REAL=$(command -v python3.13 || command -v python3)
            echo "falling back to $REAL ($("$REAL" -V 2>&1))"
            rm -f "$HP"
            printf '#!/bin/sh\nexec "%s" "$@"\n' "$REAL" > "$HP"
            chmod +x "$HP"
          fi
          echo "host python: $($HP -V 2>&1)"
          file "$HP" || true

      - name: Record source revision
        id: src
        run: |
          SHA=$(git -C blender rev-parse --short=12 HEAD)
          echo "Blender (ios branch) HEAD = $SHA"
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      # 增量编译缓存：build_ios 里是 CMake 生成的 Xcode 工程 + 全部 .o/.a。
      # object 落在 blender/build_ios/build/<target>.build/Release-iphoneos/Objects-normal/arm64，
      # 且 runner 工作目录固定为 /Users/runner/work/blender/blender，
      # 所以恢复后 Xcode 的增量判定依然有效，只重编真正变化的文件。
      # key 锚定 ios 分支提交 sha（不是 workflow 内容）：只要 Blender 源码没变，
      # 改 CI 脚本不会再触发全量重编。
      - name: Restore incremental build cache
        id: cache-build
        uses: actions/cache/restore@v4
        with:
          path: blender/build_ios
          key: ios-build-v1-${{ steps.src.outputs.sha }}-${{ github.run_id }}
          restore-keys: |
            ios-build-v1-${{ steps.src.outputs.sha }}-

      # 命中缓存时，build_ios 里的 .o 来自上一次运行，而源码是刚 clone 的
      # （mtime = 现在）→ Xcode 会认为所有源文件都改过，直接全量重编，缓存白存。
      # key 已经锚定源码 sha，内容必然一致，所以把源码 mtime 压到固定旧时间点，
      # 让增量判定回到"文件未变"。build_ios / lib / .git 不动。
      #
      # 注意：不能用 steps.cache-build.outputs.cache-hit 判断。
      # 那个输出只在 key 精确命中时为 true，而我们的 key 带了 run_id（为了保证
      # 每轮都能写入新的一份），restore-keys 前缀命中的情况它仍然是 false。
      # 所以直接看产物是否真的存在。
      - name: Normalize source mtimes for incremental build
        run: |
          if [ -d blender/build_ios/build ]; then
            N=$(find blender/build_ios/build -name "*.o" -type f 2>/dev/null | head -1)
            echo "restored objects found, e.g. ${N:-<none>}"
            find blender \( -path blender/build_ios -o -path blender/lib -o -path blender/.git \) -prune -o -type f -print0 \
              | xargs -0 touch -t 202001010000 2>/dev/null || true
            echo "source mtimes normalized to 2020-01-01 (cached objects are newer)"
          else
            echo "no cached objects - this run will build everything"
          fi

      - name: Cache iOS libraries
        id: cache-ios
        uses: actions/cache@v4
        with:
          path: blender/lib/ios_arm64
          key: ios-libs-${{ hashFiles('blender/.gitmodules') }}
          restore-keys: |
            ios-libs-

      - name: Clone iOS precompiled libraries (cache miss)
        if: steps.cache-ios.outputs.cache-hit != 'true'
        run: |
          cd blender
          rm -rf lib/ios_arm64
          git clone https://projects.blender.org/blender/lib-ios_arm64.git lib/ios_arm64
          cd lib/ios_arm64
          git lfs pull --include="openexr/**"
          cd ../..
          echo "iOS libraries cloned and OpenEXR LFS pulled"

      - name: Remove iOS zstd and verify
        run: |
          cd blender/lib/ios_arm64
          if [ -d "zstd" ]; then
            rm -rf zstd
            echo "Removed iOS zstd directory"
          else
            echo "iOS zstd not present, skipping"
          fi
          if [ -d "zstd" ]; then
            echo "ERROR: Failed to remove zstd!"
            exit 1
          fi
          echo "zstd removal verified"

      - name: Install Eigen 3.4 headers for iOS (missing from lib-ios_arm64)
        run: |
          # lib-ios_arm64 里没有 eigen/，而 platform_apple.cmake 用
          #   file(GLOB LIB_SUBDIRS ${LIBDIR}/*) + set(CMAKE_PREFIX_PATH ...)
          #   find_package(Eigen3 REQUIRED CONFIG)
          # 因此只需要把标准安装布局的 Eigen 放到 lib/ios_arm64/eigen 即可。
          cd blender
          EIGEN_PREFIX="$PWD/lib/ios_arm64/eigen"
          if [ -f "$EIGEN_PREFIX/include/eigen3/Eigen/Dense" ] && \
             [ -f "$EIGEN_PREFIX/share/eigen3/cmake/Eigen3Config.cmake" ]; then
            echo "Eigen already installed at $EIGEN_PREFIX"
          else
            rm -rf "$EIGEN_PREFIX" /tmp/eigen-src /tmp/eigen-build
            curl -fsSL -o /tmp/eigen.tgz "https://gitlab.com/libeigen/eigen/-/archive/3.4.0/eigen-3.4.0.tar.gz"
            mkdir -p /tmp/eigen-src
            tar xzf /tmp/eigen.tgz -C /tmp/eigen-src --strip-components=1
            cmake -S /tmp/eigen-src -B /tmp/eigen-build \
              -DCMAKE_INSTALL_PREFIX="$EIGEN_PREFIX" \
              -DBUILD_TESTING=OFF -DEIGEN_BUILD_DOC=OFF -DBUILD_SHARED_LIBS=OFF
            cmake --install /tmp/eigen-build
          fi
          test -f "$EIGEN_PREFIX/include/eigen3/Eigen/Dense"
          test -f "$EIGEN_PREFIX/share/eigen3/cmake/Eigen3Config.cmake"
          echo "Eigen version:"
          grep -m1 -E "define EIGEN_(WORLD|MAJOR|MINOR)_VERSION" "$EIGEN_PREFIX/include/eigen3/Eigen/src/Core/util/Macros.h" | head -1
          ls "$EIGEN_PREFIX"

      - name: Imath legacy-header compatibility for Alembic
        run: |
          # ios_arm64 里的 Alembic 头文件是按 Imath 2.x 的扁平布局写的
          #   alembic/include/Alembic/Util/Foundation.h:45:  #include <half.h>
          # 而同一个 lib 里的 imath 是 3.x 布局（只有 include/Imath/ 子目录）。
          #
          # 上一版试过在 imath/include 里建扁平软链，但没用：真正缺的不是文件，
          # 而是 imath 目录压根不在编译器的头搜索路径里（FindAlembic.cmake 只
          # 返回 alembic/include）。这一版改为在 CMake 侧加路径，见 patch 步骤。
          # 这里只做前置校验，确认头文件确实存在、后续 patch 有东西可指。
          cd blender
          for p in lib/ios_arm64/imath/include/Imath/half.h \
                   lib/ios_arm64/alembic/include/Alembic/Util/Foundation.h; do
            if [ -f "$p" ]; then echo "OK   $p"; else echo "MISS $p"; fi
          done
          if [ ! -f lib/ios_arm64/imath/include/Imath/half.h ]; then
            echo "::error::Imath headers missing - cannot satisfy Alembic"
            exit 1
          fi

      # lib-ios_arm64 里没有 fmt 目录（lib-macos_arm64 有），原脚本退回用
      # homebrew 装的 fmt 12.2.0，而它的 pragma 宏在 iOS SDK 的 clang 下展开失败：
      #   ./fmt/ranges.h:26:18: error: unknown type name 'diagnostic'
      #       FMT_PRAGMA_CLANG(diagnostic error "-Wreturn-stack-address")
      # Blender 5.1.2 配套的是 fmt 12.1.0，这里装官方那份头文件。
      # 预编译库里没有 iOS 版 libfmt.a，所以走 header-only（FMT_HEADER_ONLY）。
      - name: Provide fmt 12.1 headers for iOS
        run: |
          cd blender
          FMT_DIR="$PWD/lib/ios_arm64/fmt"
          mkdir -p "$FMT_DIR/include/fmt" "$FMT_DIR/lib/cmake/fmt"
          BASE="https://projects.blender.org/api/v1/repos/blender/lib-macos_arm64/raw/fmt/include/fmt"
          for h in args.h base.h chrono.h color.h compile.h core.h \
                   format-inl.h format.h os.h ostream.h printf.h ranges.h std.h xchar.h; do
            curl -fsSL --retry 3 -o "$FMT_DIR/include/fmt/$h" "$BASE/$h?ref=main" \
              || { echo "::error::failed to fetch fmt/$h"; exit 1; }
          done
          n=$(ls "$FMT_DIR/include/fmt" | wc -l | tr -d ' ')
          echo "fetched $n fmt headers"
          if [ "$n" -lt 14 ]; then echo "::error::incomplete fmt headers"; exit 1; fi
          # 防止半截文件（curl -f 只挡 HTTP 错误，挡不住传输截断）。
          # 只查本来就该很大的两个头；core.h 在 fmt 12 里只是 187 字节的转发头。
          for f in base.h format.h; do
            sz=$(wc -c < "$FMT_DIR/include/fmt/$f" | tr -d ' ')
            echo "  $f = $sz bytes"
            if [ "$sz" -lt 50000 ]; then
              echo "::error::$f looks truncated ($sz bytes)"
              exit 1
            fi
          done
          V=$(grep -m1 "define FMT_VERSION" "$FMT_DIR/include/fmt/base.h" | grep -oE "[0-9]+" || true)
          echo "FMT_VERSION=$V"
          # base.h 必须真的定义 FMT_PRAGMA_CLANG / FMT_EXPORT，否则说明文件是坏的
          for sym in FMT_PRAGMA_CLANG FMT_EXPORT FMT_BEGIN_NAMESPACE; do
            if grep -q "define $sym" "$FMT_DIR/include/fmt/base.h"; then
              echo "OK   base.h defines $sym"
            else
              echo "::error::base.h does not define $sym - header is broken"
              exit 1
            fi
          done

          # 关键：编译单元里不能出现第二份 fmt。
          # 前面那个 "把所有 ${LIBDIR}/*/include 加进搜索路径" 的补丁可能把某个
          # 自带 fmt 的依赖也带进来了。老版本 fmt 的 format.h 会先占住
          # FMT_FORMAT_H_ 这个 include guard，于是我们的 12.1 format.h 被整段跳过，
          # base.h 也就不会被包含 —— 表现就是 ranges.h 里 FMT_PRAGMA_CLANG /
          # FMT_EXPORT 全部"未定义"，正是 run#253 的现象。
          echo "=== unify OIIO's vendored fmt with ours ==="
          # 这才是 fmt 报错的真正原因（连查四轮才定位到）：
          #   lib-macos_arm64 里 OIIO 自带 fmt 12.1，与 Blender 用的 12.1 完全同版本，
          #   两个 format.h 的 include guard 都是 FMT_FORMAT_H_ —— 第二次 include
          #   直接跳过，天然共用一份，所以 macOS 版从来不出问题。
          #   但 lib-ios_arm64 里的 OIIO 是旧版，自带 fmt 9.1!
          #   于是 OIIO 的 format.h 先把 FMT_FORMAT_H_ 占了，Blender 的
          #   fmt/ranges.h 再 include format.h 时整段被跳过，base.h 根本没机会执行，
          #   FMT_EXPORT / FMT_PRAGMA_CLANG / fmt::is_tuple_like 全部"未定义"。
          #
          # 处理：把 OIIO 的 fmt 引用改指向共用的一份 12.1，并移走它自带的 9.1 副本。
          OIIO_FMT_H="lib/ios_arm64/openimageio/include/OpenImageIO/detail/fmt.h"
          if [ -f "$OIIO_FMT_H" ]; then
            perl -pi -e 's{#include <OpenImageIO/detail/fmt/(format|ostream|printf|core|chrono|std)\.h>}{#include <fmt/$1.h>}g' "$OIIO_FMT_H"
            echo "OIIO detail/fmt.h now points at the shared fmt 12.1"
            grep -n "include <fmt/" "$OIIO_FMT_H" | head -5
          fi
          if [ -d lib/ios_arm64/openimageio/include/OpenImageIO/detail/fmt ]; then
            mv lib/ios_arm64/openimageio/include/OpenImageIO/detail/fmt \
               lib/ios_arm64/openimageio/include/OpenImageIO/detail/fmt.disabled
            echo "moved OIIO's vendored fmt 9.1 aside"
          fi
          # 确认 OIIO 头里没有残留引用
          LEFT=$(grep -rl "OpenImageIO/detail/fmt/" lib/ios_arm64/openimageio/include \
                   --include="*.h" 2>/dev/null || true)
          if [ -n "$LEFT" ]; then
            echo "::warning::still referencing OIIO vendored fmt:"
            echo "$LEFT"
          fi
          if [ ! -f lib/ios_arm64/fmt/include/fmt/format.h ]; then
            echo "::error::shared fmt missing"
            exit 1
          fi
          # 仅报告，不做处理：OpenImageIO/detail/fmt 是 OIIO 内部实现，属正常
          DUP=$(find lib/ios_arm64 -name "format.h" -path "*/fmt/*" \
                  -not -path "lib/ios_arm64/fmt/include/fmt/*" \
                  -not -path "lib/ios_arm64/openimageio/*" 2>/dev/null || true)
          if [ -n "$DUP" ]; then
            echo "::warning::other fmt headers still present:"
            echo "$DUP"
          fi

          # homebrew 里也不能有（/opt/homebrew/include 会被 zstd 的
          # INTERFACE_INCLUDE_DIRECTORIES 带进编译命令）
          for p in /opt/homebrew/include/fmt /opt/homebrew/Cellar/fmt; do
            if [ -e "$p" ]; then
              mv "$p" "${p}.disabled" 2>/dev/null \
                && echo "disabled homebrew fmt: $p" \
                || echo "WARN: could not disable $p"
            fi
          done
          if [ -e /opt/homebrew/include/fmt ]; then
            echo "::error::homebrew fmt headers still visible - version mixing will break the build"
            exit 1
          fi

          cat > "$FMT_DIR/lib/cmake/fmt/fmt-config.cmake" <<'CFGEOF'
          set(fmt_FOUND TRUE)
          set(FMT_FOUND TRUE)
          set(fmt_VERSION "12.1.0")
          set(FMT_VERSION "12.1.0")
          if(NOT TARGET fmt::fmt)
            add_library(fmt::fmt INTERFACE IMPORTED)
            set_target_properties(fmt::fmt PROPERTIES
              INTERFACE_INCLUDE_DIRECTORIES "${CMAKE_CURRENT_LIST_DIR}/../../../include"
              INTERFACE_COMPILE_DEFINITIONS "FMT_HEADER_ONLY=1")
          endif()
          if(NOT TARGET fmt::fmt-header-only)
            add_library(fmt::fmt-header-only INTERFACE IMPORTED)
            set_target_properties(fmt::fmt-header-only PROPERTIES
              INTERFACE_INCLUDE_DIRECTORIES "${CMAKE_CURRENT_LIST_DIR}/../../../include"
              INTERFACE_COMPILE_DEFINITIONS "FMT_HEADER_ONLY=1")
          endif()
          CFGEOF
          echo "fmt config written:"
          ls -l "$FMT_DIR/lib/cmake/fmt"

      - name: Ensure Ceres headers are present
        run: |
          cd blender
          CERES_DIR="lib/ios_arm64/ceres"
          if [ -f "$CERES_DIR/include/ceres/internal/export.h" ] && [ -f "$CERES_DIR/include/ceres/internal/config.h" ]; then
            echo "Ceres headers already present"
          else
            echo "Ceres headers missing, attempting LFS pull..."
            cd lib/ios_arm64
            git lfs pull --include="ceres/**" || true
            if [ ! -f "ceres/include/ceres/internal/export.h" ] || [ ! -f "ceres/include/ceres/internal/config.h" ]; then
              git lfs pull --include="**/ceres/**" || true
            fi
            if [ ! -f "ceres/include/ceres/internal/export.h" ] || [ ! -f "ceres/include/ceres/internal/config.h" ]; then
              git lfs pull || true
            fi
            cd ../..
            if [ -f "$CERES_DIR/include/ceres/internal/export.h" ] && [ -f "$CERES_DIR/include/ceres/internal/config.h" ]; then
              echo "Ceres headers pulled via LFS"
            else
              echo "LFS failed, downloading from Ceres official and creating missing files..."
              CERES_VERSION="2.1.0"
              curl -L -o /tmp/ceres-solver.tar.gz \
                https://github.com/ceres-solver/ceres-solver/archive/refs/tags/${CERES_VERSION}.tar.gz
              tar -xzf /tmp/ceres-solver.tar.gz -C /tmp
              mkdir -p "$CERES_DIR/include"
              cp -r /tmp/ceres-solver-${CERES_VERSION}/include/* "$CERES_DIR/include/"
              
              if [ ! -f "$CERES_DIR/include/ceres/internal/export.h" ]; then
                mkdir -p "$CERES_DIR/include/ceres/internal"
                printf '%s\n' \
                  '// Ceres export macros - dummy for iOS build' \
                  '#ifndef CERES_EXPORT_H_' \
                  '#define CERES_EXPORT_H_' \
                  '' \
                  '#define CERES_EXPORT' \
                  '#define CERES_EXPORT_TEMPLATE' \
                  '#define CERES_NO_EXPORT' \
                  '#define CERES_DEPRECATED' \
                  '' \
                  '#endif  // CERES_EXPORT_H_' \
                  > "$CERES_DIR/include/ceres/internal/export.h"
                echo "Created dummy export.h"
              fi
              
              if [ ! -f "$CERES_DIR/include/ceres/internal/config.h" ]; then
                mkdir -p "$CERES_DIR/include/ceres/internal"
                printf '%s\n' \
                  '// Manual config.h for iOS cross-compilation' \
                  '#ifndef CERES_INTERNAL_CONFIG_H_' \
                  '#define CERES_INTERNAL_CONFIG_H_' \
                  '' \
                  '#define CERES_HAVE_SSE3 0' \
                  '#define CERES_HAVE_SSE4_1 0' \
                  '#define CERES_HAVE_SSE4_2 0' \
                  '#define CERES_HAVE_AVX 0' \
                  '#define CERES_HAVE_AVX2 0' \
                  '#define CERES_HAVE_AVX512 0' \
                  '#define CERES_HAVE_EIGEN 1' \
                  '#define CERES_HAVE_EIGEN_SPARSE 1' \
                  '#define CERES_HAVE_OPENMP 0' \
                  '#define CERES_HAVE_TBB 0' \
                  '#define CERES_HAVE_CXX11 1' \
                  '#define CERES_HAVE_THREADS 1' \
                  '#define CERES_USE_EIGEN_SPARSE 1' \
                  '' \
                  '#endif  // CERES_INTERNAL_CONFIG_H_' \
                  > "$CERES_DIR/include/ceres/internal/config.h"
                echo "Created dummy config.h"
              fi
              
              rm -rf /tmp/ceres-solver.tar.gz /tmp/ceres-solver-${CERES_VERSION}
            fi
          fi
          if [ ! -f "$CERES_DIR/include/ceres/internal/export.h" ]; then
            echo "ERROR: ceres/internal/export.h still not found!"
            exit 1
          fi
          if [ ! -f "$CERES_DIR/include/ceres/internal/config.h" ]; then
            echo "ERROR: ceres/internal/config.h still not found!"
            exit 1
          fi
          echo "Ceres headers verified"

      - name: Download OpenImageIO from Release (main)
        run: |
          cd blender/lib/ios_arm64/openimageio/lib/
          curl -L -o openimageio-libs.zip https://github.com/Austinzhao039/blender/releases/download/main/openimageio-libs.zip
          unzip -o openimageio-libs.zip
          rm openimageio-libs.zip
          ls -lh libOpenImageIO*.dylib
          if [ ! -f libOpenImageIO.dylib ] || [ $(stat -f%z libOpenImageIO.dylib) -lt 1000000 ]; then
            echo "ERROR: libOpenImageIO.dylib missing or too small!"
            exit 1
          fi
          echo "OpenImageIO dynamic libraries ready"

      - name: Download Eigen headers to quadriflow source
        run: |
          cd blender
          echo "Downloading Eigen 3.4.0 from official repository..."
          curl -L -o eigen.tar.gz https://gitlab.com/libeigen/eigen/-/archive/3.4.0/eigen-3.4.0.tar.gz
          tar -xzf eigen.tar.gz
          mkdir -p extern/quadriflow/src/Eigen
          cp -r eigen-3.4.0/Eigen/* extern/quadriflow/src/Eigen/
          rm -rf eigen-3.4.0 eigen.tar.gz
          if [ -f "extern/quadriflow/src/Eigen/Core" ]; then
            echo "Eigen headers copied to extern/quadriflow/src/Eigen/"
          else
            echo "ERROR: Eigen headers copy failed!"
            exit 1
          fi
          EIGEN_INCLUDE_PATH="$PWD/extern/quadriflow/src"
          echo "EIGEN_INCLUDE_PATH=$EIGEN_INCLUDE_PATH" >> $GITHUB_ENV
          echo "EIGEN_INCLUDE_PATH set to $EIGEN_INCLUDE_PATH"

      - name: Fix list(INSERT) error in source/creator/CMakeLists.txt
        run: |
          cd blender
          echo "Before fix:"
          grep -n "list(INSERT" source/creator/CMakeLists.txt || echo "No matches found"
          sed -i '' '/list(INSERT/d' source/creator/CMakeLists.txt
          echo "After fix:"
          grep -n "list(INSERT" source/creator/CMakeLists.txt || echo "All list(INSERT lines removed"

      - name: Create fake CMake config files
        run: |
          cd blender
          LIB_BASE="$PWD/lib/ios_arm64"
          # 优先用步骤 10 装好的真正 Eigen 3.4（完整头文件，含 SVD 模块），
          # 只有它缺失时才退回 quadriflow 自带的那份裁剪头文件。
          REAL_EIGEN="$LIB_BASE/eigen/include/eigen3"
          if [ -f "$REAL_EIGEN/Eigen/Dense" ]; then
            EIGEN_INCLUDE_PATH="$REAL_EIGEN"
            echo "Using real Eigen from $REAL_EIGEN"
          else
            echo "WARNING: real Eigen missing at $REAL_EIGEN, falling back to $EIGEN_INCLUDE_PATH"
          fi
          EIGEN_CMAKE_DIR="$LIB_BASE/eigen3-config"
          mkdir -p "$EIGEN_CMAKE_DIR"
          cat > "$EIGEN_CMAKE_DIR/Eigen3Config.cmake" <<EOF
          set(Eigen3_FOUND TRUE)
          set(EIGEN3_FOUND TRUE)
          set(EIGEN3_INCLUDE_DIR "${EIGEN_INCLUDE_PATH}")
          set(EIGEN3_INCLUDE_DIRS "${EIGEN_INCLUDE_PATH}")
          set(Eigen3_INCLUDE_DIR "${EIGEN_INCLUDE_PATH}")
          set(Eigen3_INCLUDE_DIRS "${EIGEN_INCLUDE_PATH}")
          set(EIGEN3_VERSION_STRING "3.4.0")
          set(Eigen3_VERSION "3.4.0")
          if(NOT TARGET Eigen3::Eigen)
            add_library(Eigen3::Eigen INTERFACE IMPORTED)
            set_target_properties(Eigen3::Eigen PROPERTIES
              INTERFACE_INCLUDE_DIRECTORIES "${EIGEN_INCLUDE_PATH}"
            )
          endif()
          EOF
          echo "Eigen3_DIR=$EIGEN_CMAKE_DIR" >> $GITHUB_ENV

          OIIO_DIR="$LIB_BASE/openimageio"
          mkdir -p "$OIIO_DIR"
          cat > "$OIIO_DIR/OpenImageIOConfig.cmake" <<EOF
          set(OpenImageIO_FOUND TRUE)
          set(OPENIMAGEIO_FOUND TRUE)
          set(OPENIMAGEIO_INCLUDE_DIR "${OIIO_DIR}/include")
          set(OPENIMAGEIO_LIBRARY "${OIIO_DIR}/lib/libOpenImageIO.dylib")
          set(OPENIMAGEIO_LIBRARIES ${OPENIMAGEIO_LIBRARY})
          set(OPENIMAGEIO_VERSION_STRING "2.5.0")
          set(OpenImageIO_VERSION "2.5.0")
          if(NOT TARGET OpenImageIO::OpenImageIO)
            add_library(OpenImageIO::OpenImageIO UNKNOWN IMPORTED)
            set_target_properties(OpenImageIO::OpenImageIO PROPERTIES
              INTERFACE_INCLUDE_DIRECTORIES "${OPENIMAGEIO_INCLUDE_DIR}"
              IMPORTED_LOCATION "${OPENIMAGEIO_LIBRARY}"
            )
          endif()
          if(NOT TARGET OpenImageIO::oiiotool)
            add_executable(OpenImageIO::oiiotool IMPORTED)
            set_target_properties(OpenImageIO::oiiotool PROPERTIES
              IMPORTED_LOCATION "/usr/bin/false"
            )
          endif()
          EOF
          cp "$OIIO_DIR/OpenImageIOConfig.cmake" "$OIIO_DIR/openimageio-config.cmake"

          OPENEXR_DIR="$LIB_BASE/openexr"
          OPENEXR_INC="$OPENEXR_DIR/include/OpenEXR"
          OPENEXR_LIB_FILE="$OPENEXR_DIR/lib/libOpenEXR.dylib"
          cat > "$OPENEXR_DIR/OpenEXRConfig.cmake" <<EOF
          set(OpenEXR_FOUND TRUE)
          set(OPENEXR_FOUND TRUE)
          set(OPENEXR_INCLUDE_DIR "${OPENEXR_INC}")
          set(OPENEXR_LIBRARY "${OPENEXR_LIB_FILE}")
          set(OPENEXR_LIBRARIES "${OPENEXR_LIB_FILE}")
          set(OPENEXR_VERSION_STRING "3.1.0")
          set(OpenEXR_VERSION "3.1.0")
          if(NOT TARGET OpenEXR::OpenEXR)
            add_library(OpenEXR::OpenEXR UNKNOWN IMPORTED)
            set_target_properties(OpenEXR::OpenEXR PROPERTIES
              INTERFACE_INCLUDE_DIRECTORIES "${OPENEXR_INCLUDE_DIR}"
              IMPORTED_LOCATION "${OPENEXR_LIBRARY}"
            )
          endif()
          EOF
          cp "$OPENEXR_DIR/OpenEXRConfig.cmake" "$OPENEXR_DIR/openexr-config.cmake"

          CERES_INC="$LIB_BASE/ceres/include"
          if [ -d "$CERES_INC" ] && [ -f "$CERES_INC/ceres/ceres.h" ]; then
            echo "Ceres headers found at $CERES_INC"
          else
            echo "ERROR: Ceres headers not found at $CERES_INC"
            exit 1
          fi
          CERES_LIB=$(find "$LIB_BASE" -name "libceres.a" 2>/dev/null | head -1)
          [ -z "$CERES_LIB" ] && CERES_LIB="$LIB_BASE/ceres/lib/libceres.a"
          CERES_CMAKE_DIR="$LIB_BASE/ceres-config"
          mkdir -p "$CERES_CMAKE_DIR"
          cat > "$CERES_CMAKE_DIR/CeresConfig.cmake" <<EOF
          set(Ceres_FOUND TRUE)
          set(CERES_FOUND TRUE)
          set(CERES_INCLUDE_DIR "${CERES_INC}")
          set(CERES_INCLUDE_DIRS "${CERES_INC}")
          set(Ceres_INCLUDE_DIR "${CERES_INC}")
          set(Ceres_INCLUDE_DIRS "${CERES_INC}")
          set(CERES_LIBRARY "${CERES_LIB}")
          set(CERES_LIBRARIES "${CERES_LIB}")
          set(Ceres_LIBRARY "${CERES_LIB}")
          set(Ceres_LIBRARIES "${CERES_LIB}")
          set(CERES_VERSION_STRING "2.0.0")
          set(Ceres_VERSION "2.0.0")
          if(NOT TARGET Ceres::Ceres)
            add_library(Ceres::Ceres UNKNOWN IMPORTED)
            set_target_properties(Ceres::Ceres PROPERTIES
              INTERFACE_INCLUDE_DIRECTORIES "${CERES_INCLUDE_DIR}"
              IMPORTED_LOCATION "${CERES_LIBRARY}"
            )
          endif()
          EOF
          echo "CERES_DIR=$CERES_CMAKE_DIR" >> $GITHUB_ENV
          echo "Ceres config created with include: $CERES_INC"

          BOOST_INC=$(find "$LIB_BASE" -path "*/boost/version.hpp" -printf "%h\n" 2>/dev/null | head -1)
          [ -z "$BOOST_INC" ] && BOOST_INC="$LIB_BASE/boost/include"
          BOOST_CMAKE_DIR="$LIB_BASE/boost-config"
          mkdir -p "$BOOST_CMAKE_DIR"
          cat > "$BOOST_CMAKE_DIR/BoostConfig.cmake" <<EOF
          set(Boost_FOUND TRUE)
          set(Boost_INCLUDE_DIR "${BOOST_INC}")
          set(Boost_INCLUDE_DIRS "${BOOST_INC}")
          set(Boost_VERSION_STRING "1.80.0")
          set(Boost_VERSION "1.80.0")
          set(Boost_LIBRARY_DIRS "")
          set(Boost_LIBRARIES "")
          EOF
          cp "$BOOST_CMAKE_DIR/BoostConfig.cmake" "$BOOST_CMAKE_DIR/boost-config.cmake"

          TBB_INC=$(find "$LIB_BASE" -path "*/tbb/tbb.h" -printf "%h\n" 2>/dev/null | head -1)
          [ -z "$TBB_INC" ] && TBB_INC="$LIB_BASE/tbb/include"
          TBB_LIB=$(find "$LIB_BASE" -name "libtbb.dylib" 2>/dev/null | head -1)
          [ -z "$TBB_LIB" ] && TBB_LIB="$LIB_BASE/tbb/lib/libtbb.dylib"
          TBBMALLOC_LIB=$(find "$LIB_BASE" -name "libtbbmalloc.dylib" 2>/dev/null | head -1)
          [ -z "$TBBMALLOC_LIB" ] && TBBMALLOC_LIB="$LIB_BASE/tbb/lib/libtbbmalloc.dylib"
          TBBMALLOC_PROXY_LIB=$(find "$LIB_BASE" -name "libtbbmalloc_proxy.dylib" 2>/dev/null | head -1)
          [ -z "$TBBMALLOC_PROXY_LIB" ] && TBBMALLOC_PROXY_LIB="$LIB_BASE/tbb/lib/libtbbmalloc_proxy.dylib"
          TBB_CMAKE_DIR="$LIB_BASE/tbb-config"
          mkdir -p "$TBB_CMAKE_DIR"
          cat > "$TBB_CMAKE_DIR/TBBConfig.cmake" <<EOF
          set(TBB_FOUND TRUE)
          set(TBB_INCLUDE_DIR "${TBB_INC}")
          set(TBB_INCLUDE_DIRS "${TBB_INC}")
          set(TBB_LIBRARY "${TBB_LIB}")
          set(TBB_LIBRARIES "${TBB_LIB}")
          set(TBB_VERSION_STRING "2021.8.0")
          set(TBB_VERSION "2021.8.0")
          if(NOT TARGET TBB::tbb)
            add_library(TBB::tbb UNKNOWN IMPORTED)
            set_target_properties(TBB::tbb PROPERTIES
              INTERFACE_INCLUDE_DIRECTORIES "${TBB_INCLUDE_DIR}"
              IMPORTED_LOCATION "${TBB_LIBRARY}"
            )
          endif()
          if(NOT TARGET TBB::tbbmalloc)
            add_library(TBB::tbbmalloc UNKNOWN IMPORTED)
            set_target_properties(TBB::tbbmalloc PROPERTIES
              INTERFACE_INCLUDE_DIRECTORIES "${TBB_INCLUDE_DIR}"
              IMPORTED_LOCATION "${TBBMALLOC_LIB}"
            )
          endif()
          if(NOT TARGET TBB::tbbmalloc_proxy)
            add_library(TBB::tbbmalloc_proxy UNKNOWN IMPORTED)
            set_target_properties(TBB::tbbmalloc_proxy PROPERTIES
              INTERFACE_INCLUDE_DIRECTORIES "${TBB_INCLUDE_DIR}"
              IMPORTED_LOCATION "${TBBMALLOC_PROXY_LIB}"
            )
          endif()
          EOF

          echo "Boost_DIR=$BOOST_CMAKE_DIR" >> $GITHUB_ENV
          echo "TBB_DIR=$TBB_CMAKE_DIR" >> $GITHUB_ENV
          echo "All fake config files created."

      - name: Verify OpenEXR files
        run: |
          cd blender/lib/ios_arm64
          if [ ! -f "openexr/lib/libOpenEXR.dylib" ] && [ ! -f "openexr/lib/libOpenEXR.a" ]; then
            git lfs pull --include="openexr/**"
          fi
          if [ ! -f "openexr/lib/libOpenEXR.dylib" ] && [ ! -f "openexr/lib/libOpenEXR.a" ]; then
            echo "ERROR: OpenEXR library still missing!"
            exit 1
          fi
          echo "OpenEXR is ready"

      - name: Download iOS Python 3.13 dynamic library from BeeWare
        run: |
          cd blender
          mkdir -p lib/ios_arm64/python/lib
          mkdir -p lib/ios_arm64/python/include
          curl -L -o python-ios.tar.gz \
            https://github.com/beeware/Python-Apple-support/releases/download/3.13-b14/Python-3.13-iOS-support.b14.tar.gz
          mkdir -p python_temp
          tar -xzf python-ios.tar.gz -C python_temp/
          XCFRAMEWORK_BASE="python_temp/Python.xcframework/ios-arm64"
          if [ -d "$XCFRAMEWORK_BASE" ]; then
            if [ -f "$XCFRAMEWORK_BASE/lib/libpython3.13.dylib" ]; then
              cp "$XCFRAMEWORK_BASE/lib/libpython3.13.dylib" lib/ios_arm64/python/lib/
            else
              echo "ERROR: libpython3.13.dylib not found!"
              exit 1
            fi
            if [ -d "$XCFRAMEWORK_BASE/include/python3.13" ]; then
              cp -r "$XCFRAMEWORK_BASE/include/python3.13" lib/ios_arm64/python/include/
            else
              echo "ERROR: Headers directory not found!"
              exit 1
            fi
          else
            echo "ERROR: XCFramework not found!"
            exit 1
          fi
          rm -rf python_temp python-ios.tar.gz
          if [ ! -f "lib/ios_arm64/python/lib/libpython3.13.dylib" ]; then
            echo "ERROR: iOS Python dynamic library not found!"
            exit 1
          fi
          if [ ! -f "lib/ios_arm64/python/include/python3.13/Python.h" ]; then
            echo "ERROR: iOS Python headers not found!"
            exit 1
          fi
          echo "iOS Python installed"

      - name: Locate library paths dynamically
        id: locate_libs
        run: |
          cd blender
          LIB_BASE="$PWD/lib/ios_arm64"
          PYTHON_LIB="$LIB_BASE/python/lib/libpython3.13.dylib"
          if [ -f "$PYTHON_LIB" ]; then
            PYTHON_LIB_DIR=$(dirname "$PYTHON_LIB")
            echo "PYTHON_LIB_DIR=$PYTHON_LIB_DIR" >> $GITHUB_ENV
            echo "Python library: $PYTHON_LIB"
          else
            echo "ERROR: Python library not found!"
            exit 1
          fi
          PYTHON_INC="$LIB_BASE/python/include/python3.13/Python.h"
          if [ -f "$PYTHON_INC" ]; then
            PYTHON_INC_DIR=$(dirname "$PYTHON_INC")
            echo "PYTHON_INC_DIR=$PYTHON_INC_DIR" >> $GITHUB_ENV
            echo "Python headers: $PYTHON_INC"
          else
            echo "ERROR: Python headers not found!"
            exit 1
          fi
          OPENEXR_LIB=$(find "$LIB_BASE/openexr/lib" -name "libOpenEXR.dylib" -type f | head -1)
          if [ -n "$OPENEXR_LIB" ]; then
            OPENEXR_LIB_DIR=$(dirname "$OPENEXR_LIB")
            echo "OPENEXR_LIB_DIR=$OPENEXR_LIB_DIR" >> $GITHUB_ENV
            echo "OPENEXR_LIB_FILE=$OPENEXR_LIB" >> $GITHUB_ENV
            echo "OpenEXR library: $OPENEXR_LIB"
          else
            OPENEXR_LIB=$(find "$LIB_BASE/openexr/lib" -name "libOpenEXR.a" -type f | head -1)
            if [ -n "$OPENEXR_LIB" ]; then
              OPENEXR_LIB_DIR=$(dirname "$OPENEXR_LIB")
              echo "OPENEXR_LIB_DIR=$OPENEXR_LIB_DIR" >> $GITHUB_ENV
              echo "OPENEXR_LIB_FILE=$OPENEXR_LIB" >> $GITHUB_ENV
              echo "OpenEXR library (static): $OPENEXR_LIB"
            else
              echo "ERROR: OpenEXR library not found!"
              exit 1
            fi
          fi
          OPENEXR_INC="$LIB_BASE/openexr/include/OpenEXR/OpenEXRConfig.h"
          if [ -f "$OPENEXR_INC" ]; then
            OPENEXR_INC_DIR=$(dirname "$OPENEXR_INC")
            echo "OPENEXR_INC_DIR=$OPENEXR_INC_DIR" >> $GITHUB_ENV
            echo "OpenEXR headers: $OPENEXR_INC"
          else
            echo "ERROR: OpenEXR headers not found!"
            exit 1
          fi
          OIIO_LIB="$LIB_BASE/openimageio/lib/libOpenImageIO.dylib"
          if [ -f "$OIIO_LIB" ]; then
            OIIO_LIB_DIR=$(dirname "$OIIO_LIB")
            echo "OIIO_LIB_DIR=$OIIO_LIB_DIR" >> $GITHUB_ENV
            echo "OIIO_LIB_FILE=$OIIO_LIB" >> $GITHUB_ENV
            echo "OpenImageIO library: $OIIO_LIB"
          else
            echo "ERROR: OpenImageIO library not found!"
            exit 1
          fi
          OIIO_INC="$LIB_BASE/openimageio/include/OpenImageIO"
          if [ -d "$OIIO_INC" ]; then
            OIIO_INC_DIR=$(dirname "$OIIO_INC")
            echo "OIIO_INC_DIR=$OIIO_INC_DIR" >> $GITHUB_ENV
            echo "OpenImageIO headers: $OIIO_INC"
          else
            echo "ERROR: OpenImageIO headers not found!"
            exit 1
          fi

      - name: Setup Xcode
        run: |
          XCODE_APP=$(ls /Applications/ | grep -E '^Xcode.*\.app$' | sort -V | tail -1)
          if [ -z "$XCODE_APP" ]; then
            echo "No Xcode found!"
            exit 1
          fi
          echo "Using Xcode: $XCODE_APP"
          sudo xcode-select -s "/Applications/$XCODE_APP"
          xcodebuild -version

      - name: Patch CMakeLists and platform_apple (jacobiSvd audit only, no source rewriting)
        run: |
          cd blender
          PY_LIB="$PYTHON_LIB_DIR"
          PY_INC="$PYTHON_INC_DIR"
          IOS_LIB="$PWD/lib/ios_arm64"

          # 1. Patch CMakeLists.txt
          cat > /tmp/patch_cmakelists << EOF
          # --- FORCED PATCH FOR iOS BUILD ---
          set(ENV{HOME} "/Users/runner")
          set(LIBDIR "${IOS_LIB}" CACHE PATH "" FORCE)
          set(PYTHON_VERSION 3.13 CACHE STRING "" FORCE)
          set(PYTHON_LIBRARY "${PY_LIB}/libpython3.13.dylib" CACHE FILEPATH "" FORCE)
          set(PYTHON_INCLUDE_DIR "${PY_INC}" CACHE PATH "" FORCE)
          set(PYTHON_INCLUDE_CONFIG_DIR "${PY_INC}" CACHE PATH "" FORCE)
          set(PYTHON_LIBPATH "${PY_LIB}" CACHE PATH "" FORCE)
          set(PYTHONLIBS_FOUND TRUE CACHE BOOL "" FORCE)
          set(PythonLibsUnix_FOUND TRUE CACHE BOOL "" FORCE)
          set(WITH_OPENAL OFF CACHE BOOL "" FORCE)
          set(WITH_JACK OFF CACHE BOOL "" FORCE)
          set(Epoxy_FOUND TRUE CACHE BOOL "" FORCE)
          set(EPOXY_FOUND TRUE CACHE BOOL "" FORCE)
          set(CERES_FOUND TRUE CACHE BOOL "" FORCE)
          set(CERES_INCLUDE_DIR "${IOS_LIB}/ceres/include" CACHE PATH "" FORCE)
          set(CERES_INCLUDE_DIRS "${IOS_LIB}/ceres/include" CACHE PATH "" FORCE)
          set(CERES_LIBRARY "${IOS_LIB}/ceres/lib/libceres.a" CACHE FILEPATH "" FORCE)
          set(CERES_LIBRARIES "${IOS_LIB}/ceres/lib/libceres.a" CACHE FILEPATH "" FORCE)
          set(ZSTD_LIBRARY "/opt/homebrew/lib/libzstd.dylib" CACHE FILEPATH "" FORCE)
          set(ZSTD_LIBRARIES "/opt/homebrew/lib/libzstd.dylib" CACHE FILEPATH "" FORCE)
          set(ZSTD_INCLUDE_DIR "/opt/homebrew/include" CACHE PATH "" FORCE)
          set(ZSTD_FOUND TRUE CACHE BOOL "" FORCE)
          if(NOT TARGET ZSTD::ZSTD)
            add_library(ZSTD::ZSTD UNKNOWN IMPORTED)
            set_target_properties(ZSTD::ZSTD PROPERTIES
              IMPORTED_LOCATION "/opt/homebrew/lib/libzstd.dylib"
              INTERFACE_INCLUDE_DIRECTORIES "/opt/homebrew/include"
            )
          endif()
          # --- END PATCH ---
          EOF
          sed -i '' "1 r /tmp/patch_cmakelists" CMakeLists.txt

          # 2. Disable Epoxy find_package
          sed -i '' 's/^[[:space:]]*find_package(Epoxy REQUIRED)/# find_package(Epoxy REQUIRED) # disabled by patch/g' build_files/cmake/platform/platform_apple.cmake

          # 2.5 Alembic 需要 Imath 的旧式扁平头（#include <half.h>）
          #     lib/ios_arm64 里 alembic 是按 Imath 2.x 的头写的，而 imath 是 3.x
          #     布局（include/Imath/）。仅仅把文件软链过去不够用——imath 目录
          #     根本不在头搜索路径里（FindAlembic 只返回 alembic/include）。
          #     half.h 内部还用相对 include（"ImathExport.h"），所以 Imath/ 目录
          #     本身也必须在路径里。
          cat >> build_files/cmake/platform/platform_apple.cmake <<'CMEOF'

          # --- iOS patch: bundled 依赖头路径 ---
          # lib/ios_arm64 里各依赖（openimageio / openexr / pugixml / opencolorio / ...）
          # 都是预编译包。Blender 靠 find_package(...) 拿 INTERFACE_INCLUDE_DIRECTORIES，
          # 但这套 iOS 的伪造 config 只补了部分变量，很多 target 拿不到头路径，
          # 要编译到 source/blender/imbuf/intern/oiio 这种深层才会报 file not found。
          # 统一把各依赖的 include 目录加进头搜索路径（AFTER，不抢系统头）。
          file(GLOB _ios_dep_inc_dirs "${LIBDIR}/*/include")
          # 这些库头多、与 Blender/系统头容易撞，而且它们的使用方都走各自的
          # find_package INTERFACE，不需要全局注入（llvm 会带进来一堆冲突定义，
          # osl/materialx/usd 里也可能夹带自己的第三方头）。
          set(_ios_skip_deps python zlib llvm osl materialx usd sse2neon shaderc vulkan udev)
          foreach(_d ${_ios_dep_inc_dirs})
            get_filename_component(_dep "${_d}" DIRECTORY)
            get_filename_component(_depname "${_dep}" NAME)
            list(FIND _ios_skip_deps "${_depname}" _ios_skip_idx)
            if(_ios_skip_idx GREATER -1)
              continue()
            endif()
            if(IS_DIRECTORY "${_d}")
              include_directories(AFTER "${_d}")
            endif()
          endforeach()
          message(STATUS "iOS patch: ${LIBDIR}/*/include injected (skipping python/zlib/llvm/osl/materialx/usd)")

          # OpenEXR 的 openexr_config.h 里写的是 #include <IlmThreadConfig.h>，
          # 而 IlmThreadConfig.h 在 openexr/include/OpenEXR/ 下（不是 include 根），
          # 所以 OpenEXR 子目录本身也要在路径里。
          foreach(_sub openexr/include/OpenEXR)
            if(IS_DIRECTORY "${LIBDIR}/${_sub}")
              include_directories(AFTER "${LIBDIR}/${_sub}")
              message(STATUS "iOS patch: extra include ${LIBDIR}/${_sub}")
            endif()
          endforeach()

          # Alembic 的头按 Imath 2.x 写（#include <half.h>），而 imath 是 3.x 布局；
          # 且 half.h 内部用相对 include（"ImathExport.h"），所以 Imath/ 目录本身也要在路径里。
          if(EXISTS "${LIBDIR}/imath/include/Imath/half.h")
            include_directories(BEFORE "${LIBDIR}/imath/include/Imath")
            message(STATUS "iOS patch: Imath legacy headers <- ${LIBDIR}/imath/include/Imath")
          else()
            message(WARNING "iOS patch: ${LIBDIR}/imath/include/Imath/half.h not found")
          endif()

          # fmt：iOS 下只能 header-only（预编译库没有 iOS 版 libfmt.a）。
          # 用 BEFORE 顶到最前面，避免命中 /opt/homebrew/include 里的 fmt 12.2.0
          # （那个版本的 pragma 宏在 iOS SDK 的 clang 下会展开失败）。
          if(EXISTS "${LIBDIR}/fmt/include/fmt/format.h")
            include_directories(BEFORE "${LIBDIR}/fmt/include")
            add_definitions(-DFMT_HEADER_ONLY=1)
            message(STATUS "iOS patch: fmt header-only <- ${LIBDIR}/fmt/include")
          else()
            message(WARNING "iOS patch: ${LIBDIR}/fmt/include/fmt/format.h not found")
          endif()
          CMEOF

          # 2.6 精准兜底：凡是用 Alembic 的 target 直接带上 Imath 头路径
          python3 - <<'PYEOF'
          from pathlib import Path
          p = Path("build_files/cmake/Modules/FindAlembic.cmake")
          s = p.read_text()
          old = "set(ALEMBIC_INCLUDE_DIRS ${ALEMBIC_INCLUDE_DIR})"
          new = (
              "set(ALEMBIC_INCLUDE_DIRS ${ALEMBIC_INCLUDE_DIR})\n"
              '  if(EXISTS "${ALEMBIC_INCLUDE_DIR}/../../imath/include/Imath/half.h")\n'
              "    list(APPEND ALEMBIC_INCLUDE_DIRS\n"
              '      "${ALEMBIC_INCLUDE_DIR}/../../imath/include"\n'
              '      "${ALEMBIC_INCLUDE_DIR}/../../imath/include/Imath")\n'
              "  endif()"
          )
          if old not in s:
              raise SystemExit("FindAlembic.cmake: ALEMBIC_INCLUDE_DIRS assignment not found")
          p.write_text(s.replace(old, new, 1))
          print("FindAlembic.cmake patched (Imath include appended)")
          PYEOF

          # 3. Force Ceres include in libmv
          cat > /tmp/libmv_patch.txt << 'EOF'
          # Added by iOS patch: force Ceres include path
          include_directories(BEFORE SYSTEM "${CERES_INCLUDE_DIR}")
          EOF
          { cat /tmp/libmv_patch.txt; cat intern/libmv/CMakeLists.txt; } > intern/libmv/CMakeLists.txt.tmp && mv intern/libmv/CMakeLists.txt.tmp intern/libmv/CMakeLists.txt

          # 4. jacobiSvd：ios_arm64 用的 Eigen 3.4 只提供运行时选项版本
          #      MatrixBase::jacobiSvd(unsigned int computationOptions)
          #    没有模板版本，所以源码里的 `.jacobiSvd<Opts>()` 必须改写成
          #      `.jacobiSvd(Opts)`
          #    关键是【一次性】同时吃掉 <...> 和后面的 ()：分两步做会留下
          #      `.jacobiSvd(Opts)()`
          #    clang 会报 "JacobiSVD does not provide a call operator"
          #    （历次运行就是这么倒在第 25 步的）。
          echo "=== Normalizing jacobiSvd (Eigen 3.4 runtime-options form) ==="
          JACOBI='s/\.jacobiSvd<([^>]*)>\s*\(\)/.jacobiSvd($1)/g'

          perl -pi -e "$JACOBI" \
            intern/libmv/libmv/multiview/euclidean_resection.cc \
            intern/libmv/libmv/tracking/track_region.cc \
            intern/dualcon/intern/octree.cpp
          find intern source/blender -type f \( -name "*.cc" -o -name "*.cpp" \) -print0 \
            | xargs -0 perl -pi -e "$JACOBI"

          # octree.cpp 显式写了 Eigen::JacobiSVD<Eigen::Matrix3f, Options> svd = ...
          # 运行时版本返回的是 JacobiSVD<PlainObject, 默认前置条件>，
          # 两者是不同类型、无隐式转换，所以改用 auto 接收。
          perl -pi -e 's/Eigen::JacobiSVD<\s*Eigen::Matrix3f\s*,\s*Options\s*>\s+svd\s*=/auto svd =/g' \
            intern/dualcon/intern/octree.cpp

          # 5. 审计（这一步必须真的干净，否则一定编译失败）
          echo "--- 关键调用点改写结果 ---"
          grep -n "jacobiSvd" intern/libmv/libmv/multiview/euclidean_resection.cc \
                            intern/libmv/libmv/tracking/track_region.cc \
                            intern/dualcon/intern/octree.cpp || true

          RESID=$(grep -rln "jacobiSvd<" intern source/blender \
                    --include="*.cc" --include="*.cpp" 2>/dev/null || true)
          DOUBLECALL=$(grep -rln -E "jacobiSvd\([^)]*\)[[:space:]]*\(\)" intern source/blender \
                    --include="*.cc" --include="*.cpp" 2>/dev/null || true)
          if [ -n "$RESID" ]; then
            echo "::error::Still using template form jacobiSvd<...> in:"
            echo "$RESID"
            exit 1
          fi
          if [ -n "$DOUBLECALL" ]; then
            echo "::error::Malformed jacobiSvd(...)() (invalid C++) in:"
            echo "$DOUBLECALL"
            exit 1
          fi
          echo "jacobiSvd normalized and verified"

          echo "All patches applied"

      - name: Generate Xcode project
        id: cmake_config
        run: |
          if [ ! -d "blender" ]; then
            echo "ERROR: blender directory missing!"
            exit 1
          fi
          cd blender
          # 注意：这里绝对不能 rm -rf build_ios。
          # 增量构建缓存恢复的就是这个目录（含 CMakeCache 和全部 .o），
          # 删掉等于每次从零编译。CMake 会复用已有配置做增量更新。
          cmake -G Xcode -S . -B build_ios \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO \
            -DWITH_GTESTS=OFF \
            -DWITH_TESTS=OFF \
            -DWITH_DOCS=OFF \
            -DWITH_RUBBERBAND=OFF \
            -DWITH_OPENIMAGEIO=ON \
            -DWITH_OPENMP=OFF \
            -DWITH_TBB=OFF \
            -DZSTD_ROOT_DIR=/opt/homebrew \
            -DOPENEXR_ROOT_DIR="$PWD/lib/ios_arm64/openexr" \
            -DOpenEXR_DIR="$PWD/lib/ios_arm64/openexr" \
            -Dfmt_DIR="$PWD/lib/ios_arm64/fmt/lib/cmake/fmt" \
            -DOPENIMAGEIO_ROOT_DIR="$PWD/lib/ios_arm64/openimageio" \
            -DOPENIMAGEIO_INCLUDE_DIR="${OIIO_INC_DIR}" \
            -DOPENIMAGEIO_LIBRARY="${OIIO_LIB_FILE}" \
            -DOpenImageIO_DIR="$PWD/lib/ios_arm64/openimageio" \
            -DEigen3_DIR="$Eigen3_DIR" \
            -DCeres_DIR="$CERES_DIR" \
            -DBoost_DIR="$Boost_DIR" \
            2>&1 | tee cmake_output.txt
          if [ ${PIPESTATUS[0]} -ne 0 ]; then
            echo "ERROR: CMake configuration failed!"
            exit 1
          fi

      - name: Upload CMake output (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cmake-output
          path: |
            blender/cmake_output.txt
            blender/build_ios/CMakeFiles/CMakeError.log
            blender/build_ios/CMakeFiles/CMakeOutput.log
          retention-days: 7

      - name: Verify Xcode project exists
        run: |
          if [ ! -d "blender/build_ios/Blender.xcodeproj" ]; then
            echo "ERROR: Blender.xcodeproj not found!"
            echo "Contents of build_ios:"
            ls -la blender/build_ios/ || echo "build_ios directory not found!"
            echo "CMake output (last 100 lines):"
            tail -100 blender/cmake_output.txt
            exit 1
          fi
          echo "Blender.xcodeproj found"

      # 头搜索路径要是没进 Xcode 工程，要等到 xcodebuild 跑十几分钟后才报
      # 'half.h' file not found。这里做静态检查，秒级失败，省一轮 13 分钟。
      - name: Verify Imath include path reached the Xcode project
        run: |
          if grep -q "iOS patch: Imath legacy headers" blender/cmake_output.txt 2>/dev/null; then
            echo "OK: CMake patch ran ->"
            grep "iOS patch" blender/cmake_output.txt | head -2
          else
            echo "::warning::CMake patch message not in configure output"
          fi
          PBX=blender/build_ios/Blender.xcodeproj/project.pbxproj
          if [ ! -f "$PBX" ]; then
            echo "::error::project.pbxproj missing"
            exit 1
          fi
          if grep -qi "imath" "$PBX"; then
            echo "OK: imath include path present in project.pbxproj"
            grep -o "[^ \"\\]*imath[^ \"\\]*" "$PBX" | sort -u | head -5
          else
            echo "::error::imath include path NOT in project.pbxproj - xcodebuild would fail on <half.h>"
            echo "--- HEADER_SEARCH_PATHS sample ---"
            grep -o "HEADER_SEARCH_PATHS = [^;]*;" "$PBX" | head -3
            exit 1
          fi
          if grep -qi "openimageio" "$PBX"; then
            echo "OK: openimageio include path present in project.pbxproj"
          else
            echo "::error::openimageio include path NOT in project.pbxproj - build would fail on <OpenImageIO/imageio.h>"
            exit 1
          fi
          # fmt 必须来自我们装的 12.1.0，不能是 /opt/homebrew 的 12.2.0
          if grep -q "lib/ios_arm64/fmt" "$PBX"; then
            echo "OK: fmt resolves to bundled 12.1.0"
          else
            echo "::error::fmt does not point at lib/ios_arm64/fmt - homebrew fmt 12.2 would break the build"
            grep -o "[^ \"\\]*fmt[^ \"\\]*" "$PBX" | sort -u | head -5
            exit 1
          fi
          if grep -q "opt/homebrew/Cellar/fmt" "$PBX"; then
            echo "::error::homebrew Cellar fmt leaked into the Xcode project"
            exit 1
          fi

      - name: Build cross compile tools first
        if: steps.cmake_config.outcome == 'success'
        run: |
          cd blender/build_ios
          export HOME="/Users/runner"
          xcodebuild \
            -project Blender.xcodeproj \
            -target blender_cross_tools_compile \
            -sdk iphoneos \
            -configuration Release \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ARCHS=arm64 \
            HOME="$HOME"

      - name: Build Blender.app for iOS
        if: steps.cmake_config.outcome == 'success'
        run: |
          cd blender
          # 构建前再确认一次宿主 python 可用：xcodebuild 的 script phase 会用它的绝对路径
          HP=lib/macos_arm64/python/bin/python3.13
          ls -l "$HP" || true
          file "$HP" || true
          if ! "$HP" -V; then
            echo "WARN: host python broken at build time, re-wrapping"
            REAL=$(command -v python3.13 || command -v python3)
            rm -f "$HP"
            printf '#!/bin/sh\nexec "%s" "$@"\n' "$REAL" > "$HP"
            chmod +x "$HP"
            "$HP" -V
          fi
          cd build_ios
          export HOME="/Users/runner"
          xcodebuild \
            -project Blender.xcodeproj \
            -target install \
            -sdk iphoneos \
            -configuration Release \
            -parallelizeTargets \
            -jobs 4 \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            HOME="$HOME"

      - name: Package unsigned IPA
        if: steps.cmake_config.outcome == 'success'
        run: |
          cd blender/build_ios
          APP=$(find . -name "Blender.app" -type d | head -1)
          if [ -z "$APP" ]; then
            echo "ERROR: Blender.app not found!"
            find . -name "*.app" -type d
            exit 1
          fi
          echo "Found app at: $APP"
          du -sh "$APP"
          mkdir -p IPA/Payload
          cp -r "$APP" IPA/Payload/
          cd IPA && zip -r ../Blender.ipa Payload/ && cd ..
          ls -lh Blender.ipa

      - name: Upload IPA
        if: steps.cmake_config.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: blender-ipad-unsigned
          path: blender/build_ios/Blender.ipa
          retention-days: 30

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            blender/build_ios/**/*.log
            blender/build_ios/**/*.txt
            blender/build_ios/CMakeCache.txt
            blender/build_ios/CMakeFiles/CMakeError.log
          retention-days: 7

      # 构建失败也保存：这一版能编到 90%，下一版就从 90% 接着编。
      # 只有真正产出了大量 object 时才占用缓存配额，避免"早期失败把大缓存挤掉"的倒退。
      - name: Decide whether to refresh build cache
        id: cachesave
        if: always()
        run: |
          SZ=$(du -sm blender/build_ios 2>/dev/null | cut -f1); SZ=${SZ:-0}
          echo "build_ios size = ${SZ} MB"
          if [ "$SZ" -ge 200 ] && [ -d blender/build_ios/build ]; then
            echo "save=true"  >> "$GITHUB_OUTPUT"
            echo "worth caching (>=200MB of objects)"
          else
            echo "save=false" >> "$GITHUB_OUTPUT"
            echo "too small / no objects - keep the existing cache instead"
          fi

      # 仓库缓存总额度是 10GB。上一版的大缓存必须先删，否则新版存不进去。
      # 放在 save 之前，保证同一时刻只有一份 build_ios 缓存。
      - name: Prune previous build cache
        if: always() && steps.cachesave.outputs.save == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PREFIX="ios-build-v1-${{ steps.src.outputs.sha }}-"
          KEEP="ios-build-v1-${{ steps.src.outputs.sha }}-${{ github.run_id }}"
          echo "prefix=$PREFIX keep=$KEEP"
          IDS=$(curl -s -H "Authorization: Bearer $GH_TOKEN" \
                    -H "Accept: application/vnd.github+json" \
                    "https://api.github.com/repos/${{ github.repository }}/actions/caches?per_page=100" \
                 | jq -r --arg p "$PREFIX" --arg k "$KEEP" \
                     '.actions_caches[]? | select(.key | startswith($p)) | select(.key != $k) | .id')
          if [ -z "$IDS" ]; then echo "no stale cache to prune"; fi
          for id in $IDS; do
            echo "deleting cache id=$id"
            curl -s -o /dev/null -w "  http=%{http_code}\n" -X DELETE \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${{ github.repository }}/actions/caches/$id"
          done

      - name: Save incremental build cache
        id: cache-save
        # 缓存只是加速手段，绝不能因为它失败（超配额/超时）把成功的构建判成红
        continue-on-error: true
        timeout-minutes: 20
        if: always() && steps.cachesave.outputs.save == 'true'
        uses: actions/cache/save@v4
        with:
          path: blender/build_ios
          key: ios-build-v1-${{ steps.src.outputs.sha }}-${{ github.run_id }}