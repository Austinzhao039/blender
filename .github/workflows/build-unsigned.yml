- name: Setup Xcode environment
  run: |
    # 查找第一个以 Xcode_ 开头的 .app 文件夹，这通常是带版本号的稳定版本
    XCODE_APP=$(ls /Applications/ | grep -E '^Xcode_[0-9]+\.[0-9]+\.app$' | head -1)
    
    # 如果没找到带版本号的 Xcode，则回退到 Xcode.app
    if [ -z "$XCODE_APP" ]; then
      echo "No versioned Xcode found, using default Xcode.app"
      XCODE_APP="Xcode.app"
    fi
    
    echo "Using Xcode: $XCODE_APP"
    
    # 不再使用 xcode-select，而是直接设置 DEVELOPER_DIR 环境变量
    echo "DEVELOPER_DIR=/Applications/$XCODE_APP/Contents/Developer" >> $GITHUB_ENV
    
    # 可选：打印 Xcode 版本信息以便调试
    export DEVELOPER_DIR="/Applications/$XCODE_APP/Contents/Developer"
    xcodebuild -version