name: Build Blender iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 210

    steps:
      - name: Install dependencies
        run: |
          brew install git-lfs cmake eigen fmt openimageio zstd
          git lfs install

      # 从官方源克隆
      - name: Clone Blender from official source
        run: |
          git clone https://projects.blender.org/blender/blender.git -b ios --depth 1
          cd blender
          git lfs pull

      # 修正子模块 URL
      - name: Fix submodule URLs
        run: |
          cd blender
          sed -i '' 's/github\.com\/blender/projects.blender.org\/blender/g' .gitmodules
          git submodule sync --recursive

      # 拉取所有子模块
      - name: Initialize submodules
        run: |
          cd blender
          git submodule update --init --recursive --force

      # ========== 关键修复：运行 make_update.py 补全依赖 ==========
      - name: Run make_update.py to fetch all libraries
        run: |
          cd blender
          # 不带任何参数运行，让它自动检测平台并拉取所有需要的库
          python3 ./build_files/utils/make_update.py

      # 再次拉取 LFS（确保所有大文件都被拉取）
      - name: Pull LFS again for safety
        run: |
          cd blender
          git lfs pull
          git submodule foreach git lfs pull

      # 验证关键目录是否存在
      - name: Verify libraries
        run: |
          cd blender
          echo "=== macOS libraries ==="
          ls -la lib/macos_arm64/ || echo "macOS libs missing!"
          echo "=== iOS libraries ==="
          ls -la lib/ios_arm64/ || echo "iOS libs missing!"
          echo "=== Python directory ==="
          if [ -d "lib/ios_arm64/python" ]; then
            echo "✅ Python found!"
            ls -la lib/ios_arm64/python/
          else
            echo "❌ Python still missing!"
            exit 1
          fi

      # 自动选择最高版本 Xcode
      - name: Setup Xcode
        run: |
          XCODE_APP=$(ls /Applications/ | grep -E '^Xcode.*\.app$' | sort -V | tail -1)
          if [ -z "$XCODE_APP" ]; then
            echo "No Xcode found!"
            exit 1
          fi
          echo "Selected Xcode: $XCODE_APP"
          sudo xcode-select -s "/Applications/$XCODE_APP"
          xcodebuild -version

      # 生成 Xcode 项目
      - name: Generate Xcode project
        run: |
          cd blender
          rm -rf build_ios
          cmake -G Xcode -S . -B build_ios \
            -DWITH_GTESTS=OFF \
            -DWITH_TESTS=OFF \
            -DWITH_DOCS=OFF

      # 编译
      - name: Build Blender.app for iOS
        run: |
          cd blender/build_ios
          xcodebuild \
            -project Blender.xcodeproj \
            -target install \
            -sdk iphoneos \
            -configuration Release \
            -parallelizeTargets \
            -jobs 4 \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO

      # 打包
      - name: Package unsigned IPA
        run: |
          cd blender/build_ios
          APP=$(find . -name "Blender.app" -type d | head -1)
          if [ -z "$APP" ]; then
            echo "ERROR: Blender.app not found!"
            find . -name "*.app" -type d
            exit 1
          fi
          echo "Found app at: $APP"
          du -sh "$APP"
          rm -rf "$APP/Assets/5.0/python/lib/python3.13/config-3.13-darwin" 2>/dev/null || true
          mkdir -p IPA/Payload
          cp -r "$APP" IPA/Payload/
          cd IPA
          zip -r ../Blender.ipa Payload/
          cd ..
          ls -lh Blender.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: blender-ipad-unsigned
          path: blender/build_ios/Blender.ipa
          retention-days: 30

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            blender/build_ios/**/*.log
            blender/build_ios/**/*.txt
          retention-days: 7