name: Build Blender iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 210

    steps:
      - name: Install dependencies
        run: |
          brew install git-lfs cmake
          git lfs install

      - name: Clone Blender from official source
        run: |
          git clone https://projects.blender.org/blender/blender.git -b ios --depth 1
          cd blender
          git lfs pull

      # 直接克隆预编译库，绕过 make_update.py 和子模块问题
      - name: Clone precompiled libraries
        run: |
          cd blender
          # iOS 库（解决 python 缺失问题）
          rm -rf lib/ios_arm64
          git clone https://projects.blender.org/blender/lib-ios_arm64.git lib/ios_arm64
          cd lib/ios_arm64 && git lfs pull && cd ../..
          # macOS 库（CMake 配置需要）
          rm -rf lib/macos_arm64
          git clone https://projects.blender.org/blender/lib-macos_arm64.git lib/macos_arm64
          cd lib/macos_arm64 && git lfs pull && cd ../..

      - name: Verify libraries
        run: |
          cd blender
          if [ ! -d "lib/ios_arm64/python" ]; then
            echo "❌ iOS Python still missing!"
            exit 1
          fi
          echo "✅ Libraries ready"

      - name: Generate Xcode project
        run: |
          cd blender
          rm -rf build_ios
          cmake -G Xcode -S . -B build_ios \
            -DWITH_GTESTS=OFF \
            -DWITH_TESTS=OFF \
            -DWITH_DOCS=OFF

      - name: Build Blender.app for iOS
        run: |
          cd blender/build_ios
          xcodebuild \
            -project Blender.xcodeproj \
            -target install \
            -sdk iphoneos \
            -configuration Release \
            -parallelizeTargets \
            -jobs 4 \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO

      - name: Package unsigned IPA
        run: |
          cd blender/build_ios
          APP=$(find . -name "Blender.app" -type d | head -1)
          if [ -z "$APP" ]; then
            echo "ERROR: Blender.app not found!"
            find . -name "*.app" -type d
            exit 1
          fi
          echo "Found app at: $APP"
          du -sh "$APP"
          mkdir -p IPA/Payload
          cp -r "$APP" IPA/Payload/
          cd IPA && zip -r ../Blender.ipa Payload/ && cd ..
          ls -lh Blender.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: blender-ipad-unsigned
          path: blender/build_ios/Blender.ipa
          retention-days: 30

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            blender/build_ios/**/*.log
            blender/build_ios/**/*.txt
          retention-days: 7