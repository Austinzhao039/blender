name: Build Blender iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 210

    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: false

      # ========== 1. 清理安卓缓存，释放空间 ==========
      - name: Free disk space (Android only)
        run: |
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf ~/Library/Android
          df -h

      # ========== 2. 安装依赖 ==========
      - name: Install dependencies
        run: |
          brew install git-lfs cmake eigen fmt openimageio zstd
          git lfs install

      # ========== 3. 核心：手动初始化并拉取所有子模块 ==========
      # 这一步直接处理子模块，不依赖可能出问题的 make_update.py
      - name: Fetch prebuilt libraries (manual submodule)
        run: |
          # 强制初始化所有子模块（包括 macOS 和 iOS 的依赖库）
          git submodule update --init --recursive --force
          
          # 手动进入每个库目录，强制拉取 LFS 文件
          for submodule in lib/macos_arm64 lib/ios_arm64; do
            if [ -d "$submodule" ]; then
              echo "Processing $submodule..."
              cd "$submodule"
              git lfs fetch --all
              git lfs pull
              cd ../..
            else
              echo "WARNING: $submodule not found!"
            fi
          done
          
          # 额外检查 iOS Python 库是否拉取成功
          if [ ! -d lib/ios_arm64/python ]; then
            echo "Python library still missing, attempting manual LFS fetch..."
            cd lib/ios_arm64
            git lfs fetch --all
            git lfs checkout
            cd ../..
          fi

      # ========== 4. 补全缺失的 iOS 库 (fmt, eigen) ==========
      - name: Bootstrap missing iOS prebuilts
        run: |
          if [ ! -f lib/ios_arm64/fmt/include/fmt/core.h ]; then
            if [ -f ./build_files/utils/bootstrap_ios_fmt.sh ]; then
              bash ./build_files/utils/bootstrap_ios_fmt.sh
            else
              echo "WARNING: fmt bootstrap script not found"
            fi
          fi
          if [ ! -f lib/ios_arm64/eigen/share/eigen3/cmake/Eigen3Config.cmake ]; then
            if [ -f ./build_files/utils/bootstrap_ios_eigen.sh ]; then
              bash ./build_files/utils/bootstrap_ios_eigen.sh
            else
              echo "WARNING: eigen bootstrap script not found"
            fi
          fi
          if [ ! -d lib/ios_arm64/python ]; then
            echo "ERROR: Python library still missing after all attempts!" >&2
            exit 1
          fi

      # ========== 5. 验证库文件是否齐全 ==========
      - name: Verify bootstrapped libraries
        run: |
          echo "=== macOS libraries ==="
          ls -la lib/macos_arm64/ || echo "macOS libraries missing!"
          echo "=== iOS libraries ==="
          ls -la lib/ios_arm64/ || echo "iOS libraries missing!"
          echo "=== Python directory ==="
          ls -la lib/ios_arm64/python/ || echo "Python missing!"

      # ========== 6. 缓存庞大的依赖库，加速后续构建 ==========
      - name: Cache prebuilt libraries
        uses: actions/cache/save@v4
        with:
          path: |
            lib/ios_arm64
            lib/macos_arm64
            .git/modules/lib/ios_arm64
            .git/modules/lib/macos_arm64
          key: ${{ runner.os }}-libs-${{ hashFiles('lib/ios_arm64') }}-v1

      # ========== 7. 自动选择并切换到最高版本 Xcode ==========
      - name: Setup Xcode environment
        run: |
          XCODE_APP=$(ls /Applications/ | grep -E '^Xcode.*\.app$' | sort -V | tail -1)
          if [ -z "$XCODE_APP" ]; then
            echo "No Xcode found in /Applications!"
            exit 1
          fi
          echo "Selected Xcode: $XCODE_APP"
          sudo xcode-select -s "/Applications/$XCODE_APP"
          xcodebuild -version

      # ========== 8. 生成 Xcode 项目 ==========
      - name: Generate Xcode project
        run: |
          rm -rf build_ios
          cmake -G Xcode -S . -B build_ios \
            -DWITH_GTESTS=OFF \
            -DWITH_TESTS=OFF \
            -DWITH_DOCS=OFF

      # ========== 9. 编译 Blender.app ==========
      - name: Build Blender.app for iOS
        run: |
          xcodebuild \
            -project build_ios/Blender.xcodeproj \
            -target install \
            -sdk iphoneos \
            -configuration Release \
            -parallelizeTargets \
            -jobs 4 \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO

      # ========== 10. 打包成未签名的 IPA ==========
      - name: Package unsigned IPA
        run: |
          APP=""
          for path in \
            "build_ios/bin/Release/Blender.app" \
            "build_ios/Build/Products/Release-iphoneos/Blender.app" \
            "build_ios/Release-iphoneos/Blender.app"; do
            if [ -d "$path" ]; then
              APP="$path"
              break
            fi
          done
          if [ -z "$APP" ]; then
            echo "ERROR: Blender.app not found!"
            find build_ios -name "*.app" -type d
            exit 1
          fi
          echo "Found app at: $APP"
          du -sh "$APP"
          rm -rf "$APP/Assets/5.0/python/lib/python3.13/config-3.13-darwin" 2>/dev/null || true
          mkdir -p IPA/Payload
          cp -r "$APP" IPA/Payload/
          cd IPA
          zip -r ../Blender.ipa Payload/
          cd ..
          ls -lh Blender.ipa

      # ========== 11. 上传最终产物 ==========
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: blender-ipad-unsigned
          path: Blender.ipa
          retention-days: 30

      # ========== 12. 失败时上传日志 ==========
      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build_ios/**/*.log
            build_ios/**/*.txt
          retention-days: 7