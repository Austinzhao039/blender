name: Build Blender iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 210

    steps:
      - name: Install dependencies
        run: |
          brew install git-lfs cmake
          git lfs install

      # ============================================================
      # 1. 克隆 Blender 源码
      # ============================================================
      - name: Clone Blender from official source
        run: |
          git clone https://projects.blender.org/blender/blender.git -b ios --depth 1
          cd blender
          git lfs pull

      - name: Fix submodule URLs
        run: |
          cd blender
          sed -i '' 's/github\.com\/blender/projects.blender.org\/blender/g' .gitmodules
          git submodule sync --recursive

      # ============================================================
      # 2. 拉取基础库（不包括 Python）
      # ============================================================
      - name: Run make_update.py
        run: |
          cd blender
          python3 ./build_files/utils/make_update.py

      # ============================================================
      # 3. 下载预编译的 Python 3.13 动态库 + 头文件
      # ============================================================
      - name: Download prebuilt Python 3.13 (dynamic library) for iOS
        run: |
          cd blender
          mkdir -p lib/ios_arm64/python/lib
          mkdir -p lib/ios_arm64/python/include

          echo "Downloading Python 3.13 prebuilt package from BeeWare..."
          curl -L -o python-ios.tar.gz \
            https://github.com/beeware/Python-Apple-support/releases/download/3.13-b14/Python-3.13-iOS-support.b14.tar.gz

          mkdir -p python_temp
          tar -xzf python-ios.tar.gz -C python_temp/

          XCFRAMEWORK_BASE="python_temp/Python.xcframework/ios-arm64"
          
          if [ -d "$XCFRAMEWORK_BASE" ]; then
            echo "✅ Found ios-arm64 XCFramework slice"
            
            # 复制动态库
            if [ -f "$XCFRAMEWORK_BASE/lib/libpython3.13.dylib" ]; then
              cp "$XCFRAMEWORK_BASE/lib/libpython3.13.dylib" lib/ios_arm64/python/lib/
              echo "✅ Copied libpython3.13.dylib"
            else
              echo "❌ libpython3.13.dylib not found!"
              find python_temp -name "libpython3.13.dylib" -type f
              exit 1
            fi
            
            # ========== 根据实际目录结构复制头文件 ==========
            # 头文件在 include/python3.13/ 目录下
            if [ -d "$XCFRAMEWORK_BASE/include/python3.13" ]; then
              echo "✅ Found headers in include/python3.13/"
              cp -r "$XCFRAMEWORK_BASE/include/python3.13/"* lib/ios_arm64/python/include/
              echo "✅ Copied headers from include/python3.13/"
            else
              echo "❌ Headers not found in include/python3.13!"
              find python_temp -name "Python.h" -type f
              exit 1
            fi
            
          else
            echo "❌ ios-arm64 XCFramework slice not found!"
            ls -la python_temp/Python.xcframework/
            exit 1
          fi

          rm -rf python_temp python-ios.tar.gz

          # 验证
          echo "Final verification:"
          if [ -f "lib/ios_arm64/python/lib/libpython3.13.dylib" ]; then
            echo "✅ Python 3.13 dynamic library installed!"
            ls -la lib/ios_arm64/python/lib/libpython3.13.dylib
          else
            echo "❌ Python 3.13 dynamic library not found!"
            exit 1
          fi
          
          if [ -f "lib/ios_arm64/python/include/Python.h" ]; then
            echo "✅ Python headers installed!"
            ls -la lib/ios_arm64/python/include/ | head -10
          else
            echo "❌ Python headers not found!"
            echo "Contents of include:"
            ls -la lib/ios_arm64/python/include/ || echo "include directory is empty or does not exist"
            exit 1
          fi

      # ============================================================
      # 4. 验证所有库
      # ============================================================
      - name: Verify libraries
        run: |
          cd blender
          echo "=== Checking iOS libraries ==="
          ls -la lib/ios_arm64/ | head -20
          echo "=== Checking Python dynamic library ==="
          if [ -f "lib/ios_arm64/python/lib/libpython3.13.dylib" ]; then
            echo "✅ Python 3.13 dynamic library found!"
          else
            echo "❌ Python 3.13 dynamic library missing!"
            exit 1
          fi
          echo "=== Checking Python headers ==="
          if [ -d "lib/ios_arm64/python/include" ] && [ -f "lib/ios_arm64/python/include/Python.h" ]; then
            echo "✅ Python headers found!"
            ls -la lib/ios_arm64/python/include/ | head -10
          else
            echo "❌ Python headers missing!"
            echo "Contents of include directory:"
            ls -la lib/ios_arm64/python/include/ || echo "include directory is empty or does not exist"
            exit 1
          fi

      # ============================================================
      # 5. 设置 Xcode 环境
      # ============================================================
      - name: Setup Xcode
        run: |
          XCODE_APP=$(ls /Applications/ | grep -E '^Xcode.*\.app$' | sort -V | tail -1)
          if [ -z "$XCODE_APP" ]; then
            echo "No Xcode found!"
            exit 1
          fi
          echo "Using Xcode: $XCODE_APP"
          sudo xcode-select -s "/Applications/$XCODE_APP"
          xcodebuild -version

      # ============================================================
      # 6. 生成 Xcode 项目（显式指定 Python 库路径）
      # ============================================================
      - name: Generate Xcode project
        run: |
          cd blender
          rm -rf build_ios
          cmake -G Xcode -S . -B build_ios \
            -DWITH_GTESTS=OFF \
            -DWITH_TESTS=OFF \
            -DWITH_DOCS=OFF \
            -DPYTHON_LIBRARY="$PWD/lib/ios_arm64/python/lib/libpython3.13.dylib" \
            -DPYTHON_INCLUDE_DIR="$PWD/lib/ios_arm64/python/include"

      # ============================================================
      # 7. 编译 Blender.app
      # ============================================================
      - name: Build Blender.app for iOS
        run: |
          cd blender/build_ios
          xcodebuild \
            -project Blender.xcodeproj \
            -target install \
            -sdk iphoneos \
            -configuration Release \
            -parallelizeTargets \
            -jobs 4 \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO

      # ============================================================
      # 8. 打包成未签名 IPA
      # ============================================================
      - name: Package unsigned IPA
        run: |
          cd blender/build_ios
          APP=$(find . -name "Blender.app" -type d | head -1)
          if [ -z "$APP" ]; then
            echo "ERROR: Blender.app not found!"
            find . -name "*.app" -type d
            exit 1
          fi
          echo "Found app at: $APP"
          du -sh "$APP"
          mkdir -p IPA/Payload
          cp -r "$APP" IPA/Payload/
          cd IPA && zip -r ../Blender.ipa Payload/ && cd ..
          ls -lh Blender.ipa

      # ============================================================
      # 9. 上传 IPA
      # ============================================================
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: blender-ipad-unsigned
          path: blender/build_ios/Blender.ipa
          retention-days: 30

      # ============================================================
      # 10. 失败时上传日志
      # ============================================================
      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            blender/build_ios/**/*.log
            blender/build_ios/**/*.txt
          retention-days: 7
