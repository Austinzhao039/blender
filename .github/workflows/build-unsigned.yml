name: Build Blender iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 210

    steps:
      # ============================================================
      # 0. 安装依赖
      # ============================================================
      - name: Install dependencies
        run: |
          brew install git-lfs cmake fmt
          git lfs install
          if [ ! -f /opt/homebrew/lib/libfmt.a ]; then
            echo "❌ fmt not installed correctly!"
            exit 1
          fi
          echo "✅ fmt installed at /opt/homebrew/lib/libfmt.a"
          FMT_CMAKE_DIR=$(find /opt/homebrew -name "fmt-config.cmake" 2>/dev/null | head -1 | xargs dirname)
          if [ -z "$FMT_CMAKE_DIR" ]; then
            echo "❌ fmt CMake config not found!"
            exit 1
          fi
          echo "FMT_CMAKE_DIR=$FMT_CMAKE_DIR" >> $GITHUB_ENV
          echo "✅ fmt CMake config at $FMT_CMAKE_DIR"

      # ============================================================
      # 1. 克隆 Blender 源码（跳过 LFS）
      # ============================================================
      - name: Clone Blender from official source (skip LFS)
        run: |
          rm -rf blender
          GIT_LFS_SKIP_SMUDGE=1 git clone https://projects.blender.org/blender/blender.git -b ios --depth 1
          cd blender

      - name: Fix submodule URLs
        run: |
          cd blender
          sed -i '' 's/github\.com\/blender/projects.blender.org\/blender/g' .gitmodules
          git submodule sync --recursive

      - name: Verify blender directory exists
        run: |
          if [ ! -d "blender" ]; then
            echo "❌ blender directory missing!"
            exit 1
          fi
          echo "✅ blender directory exists"

      # ============================================================
      # 2. 下载 startup.blend（main2）
      # ============================================================
      - name: Download startup.blend from Release (main2)
        run: |
          cd blender
          mkdir -p release/datafiles
          curl -L -o startup.zip https://github.com/Austinzhao039/blender/releases/download/main2/startup.zip
          unzip -o startup.zip
          rm startup.zip
          if [ -f "startup.blend" ]; then
            mv startup.blend release/datafiles/
          fi
          if [ -d "datafiles" ] && [ -f "datafiles/startup.blend" ]; then
            mv datafiles/* release/datafiles/ 2>/dev/null || true
            rmdir datafiles 2>/dev/null || true
          fi
          if [ ! -f "release/datafiles/startup.blend" ]; then
            git lfs pull --include="release/datafiles/startup.blend"
          fi
          if [ ! -f "release/datafiles/startup.blend" ]; then
            echo "❌ startup.blend still missing!"
            exit 1
          fi
          echo "✅ startup.blend ready"

      # ============================================================
      # 3. 下载 macOS Python（mainly）
      # ============================================================
      - name: Download macOS Python from Release (mainly)
        run: |
          cd blender
          mkdir -p lib/macos_arm64/python/bin
          curl -L -o macos-python.zip https://github.com/Austinzhao039/blender/releases/download/mainly/macos-python.zip
          unzip -o macos-python.zip
          rm macos-python.zip
          chmod +x lib/macos_arm64/python/bin/python3.13
          if [ ! -f "lib/macos_arm64/python/bin/python3.13" ]; then
            echo "❌ macOS Python still missing!"
            exit 1
          fi
          echo "✅ macOS Python ready"

      # ============================================================
      # 4. 缓存 iOS 库
      # ============================================================
      - name: Cache iOS libraries
        id: cache-ios
        uses: actions/cache@v4
        with:
          path: blender/lib/ios_arm64
          key: ios-libs-${{ hashFiles('blender/.gitmodules') }}
          restore-keys: |
            ios-libs-

      # ============================================================
      # 5. 克隆 iOS 预编译库（仅 OpenEXR）
      # ============================================================
      - name: Clone iOS precompiled libraries (cache miss)
        if: steps.cache-ios.outputs.cache-hit != 'true'
        run: |
          cd blender
          rm -rf lib/ios_arm64
          git clone https://projects.blender.org/blender/lib-ios_arm64.git lib/ios_arm64
          cd lib/ios_arm64
          git lfs pull --include="openexr/**"
          cd ../..
          echo "✅ iOS libraries cloned and OpenEXR LFS pulled"

      # ============================================================
      # 6. 下载 OpenImageIO（main）
      # ============================================================
      - name: Download OpenImageIO from Release (main)
        run: |
          cd blender/lib/ios_arm64/openimageio/lib/
          curl -L -o openimageio-libs.zip https://github.com/Austinzhao039/blender/releases/download/main/openimageio-libs.zip
          unzip -o openimageio-libs.zip
          rm openimageio-libs.zip
          ls -lh libOpenImageIO*.dylib
          if [ ! -f libOpenImageIO.dylib ] || [ $(stat -f%z libOpenImageIO.dylib) -lt 1000000 ]; then
            echo "❌ libOpenImageIO.dylib missing or too small!"
            exit 1
          fi
          echo "✅ OpenImageIO dynamic libraries ready"

      # ============================================================
      # 7. 🚀 下载 Eigen 头文件到 quadriflow 源码目录
      # ============================================================
      - name: Download Eigen headers to quadriflow source
        run: |
          cd blender
          echo "📥 Downloading Eigen 3.4.0 from official repository..."
          curl -L -o eigen.tar.gz https://gitlab.com/libeigen/eigen/-/archive/3.4.0/eigen-3.4.0.tar.gz
          tar -xzf eigen.tar.gz
          mkdir -p extern/quadriflow/src/Eigen
          cp -r eigen-3.4.0/Eigen/* extern/quadriflow/src/Eigen/
          rm -rf eigen-3.4.0 eigen.tar.gz
          if [ -f "extern/quadriflow/src/Eigen/Core" ]; then
            echo "✅ Eigen headers copied to extern/quadriflow/src/Eigen/"
          else
            echo "❌ Eigen headers copy failed!"
            exit 1
          fi
          EIGEN_INCLUDE_PATH="$PWD/extern/quadriflow/src"
          echo "EIGEN_INCLUDE_PATH=$EIGEN_INCLUDE_PATH" >> $GITHUB_ENV
          echo "✅ EIGEN_INCLUDE_PATH set to $EIGEN_INCLUDE_PATH"

      # ============================================================
      # 8. 🚀 修复 list(INSERT) 错误（删除整行）
      # ============================================================
      - name: Fix list(INSERT) error in source/creator/CMakeLists.txt
        run: |
          cd blender
          echo "Before fix:"
          grep -n "list(INSERT" source/creator/CMakeLists.txt || echo "No matches found"
          sed -i '' '/list(INSERT/d' source/creator/CMakeLists.txt
          echo "After fix:"
          grep -n "list(INSERT" source/creator/CMakeLists.txt || echo "All list(INSERT lines removed"

      # ============================================================
      # 9. 🚀 创建假的 CMake 配置文件（展开变量）
      # ============================================================
      - name: Create fake CMake config files
        run: |
          cd blender
          LIB_BASE="$PWD/lib/ios_arm64"
          EIGEN_CMAKE_DIR="$LIB_BASE/eigen3-config"
          mkdir -p "$EIGEN_CMAKE_DIR"

          # ---------- Eigen3 ----------
          cat > "$EIGEN_CMAKE_DIR/Eigen3Config.cmake" <<EOF
          set(Eigen3_FOUND TRUE)
          set(EIGEN3_FOUND TRUE)
          set(EIGEN3_INCLUDE_DIR "${EIGEN_INCLUDE_PATH}")
          set(EIGEN3_INCLUDE_DIRS "${EIGEN_INCLUDE_PATH}")
          set(Eigen3_INCLUDE_DIR "${EIGEN_INCLUDE_PATH}")
          set(Eigen3_INCLUDE_DIRS "${EIGEN_INCLUDE_PATH}")
          set(EIGEN3_VERSION_STRING "3.4.0")
          set(Eigen3_VERSION "3.4.0")
          if(NOT TARGET Eigen3::Eigen)
            add_library(Eigen3::Eigen INTERFACE IMPORTED)
            set_target_properties(Eigen3::Eigen PROPERTIES
              INTERFACE_INCLUDE_DIRECTORIES "${EIGEN_INCLUDE_PATH}"
            )
          endif()
          EOF
          echo "Eigen3_DIR=$EIGEN_CMAKE_DIR" >> $GITHUB_ENV

          # ---------- OpenImageIO ----------
          OIIO_DIR="$LIB_BASE/openimageio"
          mkdir -p "$OIIO_DIR"
          cat > "$OIIO_DIR/OpenImageIOConfig.cmake" <<EOF
          set(OpenImageIO_FOUND TRUE)
          set(OPENIMAGEIO_FOUND TRUE)
          set(OPENIMAGEIO_INCLUDE_DIR "${OIIO_DIR}/include")
          set(OPENIMAGEIO_LIBRARY "${OIIO_DIR}/lib/libOpenImageIO.dylib")
          set(OPENIMAGEIO_LIBRARIES ${OPENIMAGEIO_LIBRARY})
          set(OPENIMAGEIO_VERSION_STRING "2.5.0")
          set(OpenImageIO_VERSION "2.5.0")
          if(NOT TARGET OpenImageIO::OpenImageIO)
            add_library(OpenImageIO::OpenImageIO UNKNOWN IMPORTED)
            set_target_properties(OpenImageIO::OpenImageIO PROPERTIES
              INTERFACE_INCLUDE_DIRECTORIES "${OPENIMAGEIO_INCLUDE_DIR}"
              IMPORTED_LOCATION "${OPENIMAGEIO_LIBRARY}"
            )
          endif()
          if(NOT TARGET OpenImageIO::oiiotool)
            add_executable(OpenImageIO::oiiotool IMPORTED)
            set_target_properties(OpenImageIO::oiiotool PROPERTIES
              IMPORTED_LOCATION "/usr/bin/false"
            )
          endif()
          EOF
          cp "$OIIO_DIR/OpenImageIOConfig.cmake" "$OIIO_DIR/openimageio-config.cmake"

          # ---------- OpenEXR ----------
          OPENEXR_DIR="$LIB_BASE/openexr"
          OPENEXR_INC="$OPENEXR_DIR/include/OpenEXR"
          OPENEXR_LIB_FILE="$OPENEXR_DIR/lib/libOpenEXR.dylib"
          cat > "$OPENEXR_DIR/OpenEXRConfig.cmake" <<EOF
          set(OpenEXR_FOUND TRUE)
          set(OPENEXR_FOUND TRUE)
          set(OPENEXR_INCLUDE_DIR "${OPENEXR_INC}")
          set(OPENEXR_LIBRARY "${OPENEXR_LIB_FILE}")
          set(OPENEXR_LIBRARIES "${OPENEXR_LIB_FILE}")
          set(OPENEXR_VERSION_STRING "3.1.0")
          set(OpenEXR_VERSION "3.1.0")
          if(NOT TARGET OpenEXR::OpenEXR)
            add_library(OpenEXR::OpenEXR UNKNOWN IMPORTED)
            set_target_properties(OpenEXR::OpenEXR PROPERTIES
              INTERFACE_INCLUDE_DIRECTORIES "${OPENEXR_INCLUDE_DIR}"
              IMPORTED_LOCATION "${OPENEXR_LIBRARY}"
            )
          endif()
          EOF
          cp "$OPENEXR_DIR/OpenEXRConfig.cmake" "$OPENEXR_DIR/openexr-config.cmake"

          # ---------- Ceres ----------
          CERES_INC=$(find "$LIB_BASE" -path "*/ceres/ceres.h" -printf "%h\n" 2>/dev/null | head -1)
          [ -z "$CERES_INC" ] && CERES_INC="$LIB_BASE/ceres/include"
          CERES_LIB=$(find "$LIB_BASE" -name "libceres.a" 2>/dev/null | head -1)
          [ -z "$CERES_LIB" ] && CERES_LIB="$LIB_BASE/ceres/lib/libceres.a"
          CERES_CMAKE_DIR="$LIB_BASE/ceres-config"
          mkdir -p "$CERES_CMAKE_DIR"
          cat > "$CERES_CMAKE_DIR/CeresConfig.cmake" <<EOF
          set(Ceres_FOUND TRUE)
          set(CERES_INCLUDE_DIR "${CERES_INC}")
          set(CERES_INCLUDE_DIRS "${CERES_INC}")
          set(Ceres_INCLUDE_DIR "${CERES_INC}")
          set(Ceres_INCLUDE_DIRS "${CERES_INC}")
          set(CERES_LIBRARY "${CERES_LIB}")
          set(CERES_LIBRARIES "${CERES_LIB}")
          set(Ceres_LIBRARY "${CERES_LIB}")
          set(Ceres_LIBRARIES "${CERES_LIB}")
          set(CERES_VERSION_STRING "2.0.0")
          set(Ceres_VERSION "2.0.0")
          EOF

          # ---------- Boost ----------
          BOOST_INC=$(find "$LIB_BASE" -path "*/boost/version.hpp" -printf "%h\n" 2>/dev/null | head -1)
          [ -z "$BOOST_INC" ] && BOOST_INC="$LIB_BASE/boost/include"
          BOOST_CMAKE_DIR="$LIB_BASE/boost-config"
          mkdir -p "$BOOST_CMAKE_DIR"
          cat > "$BOOST_CMAKE_DIR/BoostConfig.cmake" <<EOF
          set(Boost_FOUND TRUE)
          set(Boost_INCLUDE_DIR "${BOOST_INC}")
          set(Boost_INCLUDE_DIRS "${BOOST_INC}")
          set(Boost_VERSION_STRING "1.80.0")
          set(Boost_VERSION "1.80.0")
          set(Boost_LIBRARY_DIRS "")
          set(Boost_LIBRARIES "")
          EOF
          cp "$BOOST_CMAKE_DIR/BoostConfig.cmake" "$BOOST_CMAKE_DIR/boost-config.cmake"

          # ---------- TBB ----------
          TBB_INC=$(find "$LIB_BASE" -path "*/tbb/tbb.h" -printf "%h\n" 2>/dev/null | head -1)
          [ -z "$TBB_INC" ] && TBB_INC="$LIB_BASE/tbb/include"
          TBB_LIB=$(find "$LIB_BASE" -name "libtbb.a" 2>/dev/null | head -1)
          [ -z "$TBB_LIB" ] && TBB_LIB="$LIB_BASE/tbb/lib/libtbb.a"
          TBB_CMAKE_DIR="$LIB_BASE/tbb-config"
          mkdir -p "$TBB_CMAKE_DIR"
          cat > "$TBB_CMAKE_DIR/TBBConfig.cmake" <<EOF
          set(TBB_FOUND TRUE)
          set(TBB_INCLUDE_DIR "${TBB_INC}")
          set(TBB_INCLUDE_DIRS "${TBB_INC}")
          set(TBB_LIBRARY "${TBB_LIB}")
          set(TBB_LIBRARIES "${TBB_LIB}")
          set(TBB_VERSION_STRING "2021.8.0")
          set(TBB_VERSION "2021.8.0")
          if(NOT TARGET TBB::tbb)
            add_library(TBB::tbb UNKNOWN IMPORTED)
            set_target_properties(TBB::tbb PROPERTIES
              INTERFACE_INCLUDE_DIRECTORIES "${TBB_INCLUDE_DIR}"
              IMPORTED_LOCATION "${TBB_LIBRARY}"
            )
          endif()
          EOF

          echo "CERES_DIR=$CERES_CMAKE_DIR" >> $GITHUB_ENV
          echo "Boost_DIR=$BOOST_CMAKE_DIR" >> $GITHUB_ENV
          echo "TBB_DIR=$TBB_CMAKE_DIR" >> $GITHUB_ENV
          echo "✅ All fake config files created."

      # ============================================================
      # 10. 验证 OpenEXR
      # ============================================================
      - name: Verify OpenEXR files
        run: |
          cd blender/lib/ios_arm64
          if [ ! -f "openexr/lib/libOpenEXR.dylib" ] && [ ! -f "openexr/lib/libOpenEXR.a" ]; then
            git lfs pull --include="openexr/**"
          fi
          if [ ! -f "openexr/lib/libOpenEXR.dylib" ] && [ ! -f "openexr/lib/libOpenEXR.a" ]; then
            echo "❌ OpenEXR library still missing!"
            exit 1
          fi
          echo "✅ OpenEXR is ready"

      # ============================================================
      # 11. 下载 iOS Python
      # ============================================================
      - name: Download iOS Python 3.13 dynamic library from BeeWare
        run: |
          cd blender
          mkdir -p lib/ios_arm64/python/lib
          mkdir -p lib/ios_arm64/python/include
          curl -L -o python-ios.tar.gz \
            https://github.com/beeware/Python-Apple-support/releases/download/3.13-b14/Python-3.13-iOS-support.b14.tar.gz
          mkdir -p python_temp
          tar -xzf python-ios.tar.gz -C python_temp/
          XCFRAMEWORK_BASE="python_temp/Python.xcframework/ios-arm64"
          if [ -d "$XCFRAMEWORK_BASE" ]; then
            if [ -f "$XCFRAMEWORK_BASE/lib/libpython3.13.dylib" ]; then
              cp "$XCFRAMEWORK_BASE/lib/libpython3.13.dylib" lib/ios_arm64/python/lib/
            else
              echo "❌ libpython3.13.dylib not found!"
              exit 1
            fi
            if [ -d "$XCFRAMEWORK_BASE/include/python3.13" ]; then
              cp -r "$XCFRAMEWORK_BASE/include/python3.13" lib/ios_arm64/python/include/
            else
              echo "❌ Headers directory not found!"
              exit 1
            fi
          else
            echo "❌ XCFramework not found!"
            exit 1
          fi
          rm -rf python_temp python-ios.tar.gz
          if [ ! -f "lib/ios_arm64/python/lib/libpython3.13.dylib" ]; then
            echo "❌ iOS Python dynamic library not found!"
            exit 1
          fi
          if [ ! -f "lib/ios_arm64/python/include/python3.13/Python.h" ]; then
            echo "❌ iOS Python headers not found!"
            exit 1
          fi
          echo "✅ iOS Python installed"

      # ============================================================
      # 12. 动态查找路径（导出变量）
      # ============================================================
      - name: Locate library paths dynamically
        id: locate_libs
        run: |
          cd blender
          LIB_BASE="$PWD/lib/ios_arm64"
          PYTHON_LIB="$LIB_BASE/python/lib/libpython3.13.dylib"
          if [ -f "$PYTHON_LIB" ]; then
            PYTHON_LIB_DIR=$(dirname "$PYTHON_LIB")
            echo "PYTHON_LIB_DIR=$PYTHON_LIB_DIR" >> $GITHUB_ENV
            echo "✅ Python library: $PYTHON_LIB"
          else
            echo "❌ Python library not found!"
            exit 1
          fi
          PYTHON_INC="$LIB_BASE/python/include/python3.13/Python.h"
          if [ -f "$PYTHON_INC" ]; then
            PYTHON_INC_DIR=$(dirname "$PYTHON_INC")
            echo "PYTHON_INC_DIR=$PYTHON_INC_DIR" >> $GITHUB_ENV
            echo "✅ Python headers: $PYTHON_INC"
          else
            echo "❌ Python headers not found!"
            exit 1
          fi
          OPENEXR_LIB=$(find "$LIB_BASE/openexr/lib" -name "libOpenEXR.dylib" -type f | head -1)
          if [ -n "$OPENEXR_LIB" ]; then
            OPENEXR_LIB_DIR=$(dirname "$OPENEXR_LIB")
            echo "OPENEXR_LIB_DIR=$OPENEXR_LIB_DIR" >> $GITHUB_ENV
            echo "OPENEXR_LIB_FILE=$OPENEXR_LIB" >> $GITHUB_ENV
            echo "✅ OpenEXR library: $OPENEXR_LIB"
          else
            OPENEXR_LIB=$(find "$LIB_BASE/openexr/lib" -name "libOpenEXR.a" -type f | head -1)
            if [ -n "$OPENEXR_LIB" ]; then
              OPENEXR_LIB_DIR=$(dirname "$OPENEXR_LIB")
              echo "OPENEXR_LIB_DIR=$OPENEXR_LIB_DIR" >> $GITHUB_ENV
              echo "OPENEXR_LIB_FILE=$OPENEXR_LIB" >> $GITHUB_ENV
              echo "✅ OpenEXR library (static): $OPENEXR_LIB"
            else
              echo "❌ OpenEXR library not found!"
              exit 1
            fi
          fi
          OPENEXR_INC="$LIB_BASE/openexr/include/OpenEXR/OpenEXRConfig.h"
          if [ -f "$OPENEXR_INC" ]; then
            OPENEXR_INC_DIR=$(dirname "$OPENEXR_INC")
            echo "OPENEXR_INC_DIR=$OPENEXR_INC_DIR" >> $GITHUB_ENV
            echo "✅ OpenEXR headers: $OPENEXR_INC"
          else
            echo "❌ OpenEXR headers not found!"
            exit 1
          fi
          OIIO_LIB="$LIB_BASE/openimageio/lib/libOpenImageIO.dylib"
          if [ -f "$OIIO_LIB" ]; then
            OIIO_LIB_DIR=$(dirname "$OIIO_LIB")
            echo "OIIO_LIB_DIR=$OIIO_LIB_DIR" >> $GITHUB_ENV
            echo "OIIO_LIB_FILE=$OIIO_LIB" >> $GITHUB_ENV
            echo "✅ OpenImageIO library: $OIIO_LIB"
          else
            echo "❌ OpenImageIO library not found!"
            exit 1
          fi
          OIIO_INC="$LIB_BASE/openimageio/include/OpenImageIO"
          if [ -d "$OIIO_INC" ]; then
            OIIO_INC_DIR=$(dirname "$OIIO_INC")
            echo "OIIO_INC_DIR=$OIIO_INC_DIR" >> $GITHUB_ENV
            echo "✅ OpenImageIO headers: $OIIO_INC"
          else
            echo "❌ OpenImageIO headers not found!"
            exit 1
          fi

      # ============================================================
      # 13. 设置 Xcode
      # ============================================================
      - name: Setup Xcode
        run: |
          XCODE_APP=$(ls /Applications/ | grep -E '^Xcode.*\.app$' | sort -V | tail -1)
          if [ -z "$XCODE_APP" ]; then
            echo "No Xcode found!"
            exit 1
          fi
          echo "Using Xcode: $XCODE_APP"
          sudo xcode-select -s "/Applications/$XCODE_APP"
          xcodebuild -version

      # ============================================================
      # 14. 生成 Xcode 项目（⚠️ 不要改动此步骤）
      # ============================================================
      - name: Generate Xcode project
        id: cmake_config
        run: |
          if [ ! -d "blender" ]; then
            echo "❌ blender directory missing!"
            exit 1
          fi
          cd blender
          rm -rf build_ios
          cmake -G Xcode -S . -B build_ios \
            -DCMAKE_OSX_SYSROOT=iphoneos \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_XCODE_ATTRIBUTE_CODE_SIGNING_ALLOWED=NO \
            -DWITH_GTESTS=OFF \
            -DWITH_TESTS=OFF \
            -DWITH_DOCS=OFF \
            -DWITH_RUBBERBAND=OFF \
            -DWITH_OPENIMAGEIO=ON \
            -DWITH_OPENMP=OFF \
            -DPYTHON_LIBRARY="${PYTHON_LIB_DIR}/libpython3.13.dylib" \
            -DPYTHON_INCLUDE_DIR="${PYTHON_INC_DIR}" \
            -DOPENEXR_ROOT_DIR="$PWD/lib/ios_arm64/openexr" \
            -DOpenEXR_DIR="$PWD/lib/ios_arm64/openexr" \
            -Dfmt_DIR="${FMT_CMAKE_DIR}" \
            -DOPENIMAGEIO_ROOT_DIR="$PWD/lib/ios_arm64/openimageio" \
            -DOPENIMAGEIO_INCLUDE_DIR="${OIIO_INC_DIR}" \
            -DOPENIMAGEIO_LIBRARY="${OIIO_LIB_FILE}" \
            -DOpenImageIO_DIR="$PWD/lib/ios_arm64/openimageio" \
            -DEigen3_DIR="$Eigen3_DIR" \
            -DCeres_DIR="$CERES_DIR" \
            -DBoost_DIR="$Boost_DIR" \
            -DTBB_DIR="$TBB_DIR" \
            2>&1 | tee cmake_output.txt
          if [ ${PIPESTATUS[0]} -ne 0 ]; then
            echo "❌ CMake configuration failed!"
            exit 1
          fi

      - name: Upload CMake output (always)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cmake-output
          path: |
            blender/cmake_output.txt
            blender/build_ios/CMakeFiles/CMakeError.log
            blender/build_ios/CMakeFiles/CMakeOutput.log
          retention-days: 7

      # ============================================================
      # 15. 验证 Xcode 项目是否生成
      # ============================================================
      - name: Verify Xcode project exists
        run: |
          if [ ! -d "blender/build_ios/Blender.xcodeproj" ]; then
            echo "❌ Blender.xcodeproj not found!"
            echo "Contents of build_ios:"
            ls -la blender/build_ios/ || echo "build_ios directory not found!"
            echo "CMake output (last 100 lines):"
            tail -100 blender/cmake_output.txt
            exit 1
          fi
          echo "✅ Blender.xcodeproj found"

      # ============================================================
      # 🆕 15.5 直接覆盖 platform_apple.cmake 为修改版
      # ============================================================
      - name: Override platform_apple.cmake with patched version
        run: |
          cd blender
          cat > build_files/cmake/platform/platform_apple.cmake << 'EOF'
          # SPDX-FileCopyrightText: 2016 Blender Authors
          #
          # SPDX-License-Identifier: GPL-2.0-or-later

          # Libraries configuration for Apple.

          # >>> IOS PATCH: Detect iOS build and override paths
          if(CMAKE_OSX_SYSROOT MATCHES "iphoneos")
            set(BLENDER_IOS_BUILD TRUE)
            message(STATUS "iOS build detected, using iOS-specific library paths")
          else()
            set(BLENDER_IOS_BUILD FALSE)
          endif()
          # <<< IOS PATCH

          function(find_package_wrapper)
            # do nothing, just satisfy the function
          endfunction()

          function(print_found_status
            lib_name
            lib_path
            )

            if(FIRST_RUN)
              if(lib_path)
                message(STATUS "Found ${lib_name}: ${lib_path}")
              else()
                message(WARNING "Could NOT find ${lib_name}")
              endif()
            endif()
          endfunction()

          # ------------------------------------------------------------------------
          # Find system provided libraries.

          # Find system ZLIB
          set(ZLIB_ROOT /usr)
          find_package(ZLIB REQUIRED)
          find_package(BZip2 REQUIRED)
          list(APPEND ZLIB_LIBRARIES ${BZIP2_LIBRARIES})

          if(WITH_OPENAL)
            find_package(OpenAL REQUIRED)
          endif()

          if(WITH_JACK)
            find_library(JACK_FRAMEWORK
              NAMES jackmp
            )

            if(JACK_FRAMEWORK)
              set(JACK_INCLUDE_DIRS ${JACK_FRAMEWORK}/headers)
            else()
              set_and_warn_library_found("JACK" JACK_FRAMEWORK WITH_JACK)
            endif()
          endif()

          if(NOT DEFINED LIBDIR)
            # >>> IOS PATCH: Use ios_arm64 for iOS builds
            if(BLENDER_IOS_BUILD)
              set(LIBDIR ${CMAKE_SOURCE_DIR}/lib/ios_${CMAKE_OSX_ARCHITECTURES})
            else()
              if("${CMAKE_OSX_ARCHITECTURES}" STREQUAL "x86_64")
                set(LIBDIR ${CMAKE_SOURCE_DIR}/lib/macos_x64)
              else()
                set(LIBDIR ${CMAKE_SOURCE_DIR}/lib/macos_${CMAKE_OSX_ARCHITECTURES})
              endif()
            endif()
            # <<< IOS PATCH
          endif()
          if(NOT EXISTS "${LIBDIR}/.git")
            message(FATAL_ERROR "Mac OSX requires pre-compiled libs at: '${LIBDIR}'")
          endif()
          if(FIRST_RUN)
            message(STATUS "Using pre-compiled LIBDIR: ${LIBDIR}")
          endif()

          # Avoid searching for headers since this would otherwise override our lib
          # directory as well as PYTHON_ROOT_DIR.
          set(CMAKE_FIND_FRAMEWORK NEVER)

          # >>> IOS PATCH: For iOS, pre-set Python variables to avoid find_package and brew calls
          if(BLENDER_IOS_BUILD)
            if(WITH_PYTHON)
              set(PYTHON_LIBRARY "${LIBDIR}/python/lib/libpython3.13.dylib" CACHE FILEPATH "" FORCE)
              set(PYTHON_INCLUDE_DIR "${LIBDIR}/python/include/python3.13" CACHE PATH "" FORCE)
              set(PYTHON_INCLUDE_CONFIG_DIR "${LIBDIR}/python/include/python3.13" CACHE PATH "" FORCE)
              set(PYTHON_LIBPATH "${LIBDIR}/python/lib" CACHE PATH "" FORCE)
              set(PYTHONLIBS_FOUND TRUE CACHE BOOL "" FORCE)
              set(PythonLibsUnix_FOUND TRUE CACHE BOOL "" FORCE)
              message(STATUS "iOS Python forced: ${PYTHON_LIBRARY}")
            endif()
          else()
            # Original logic for macOS
            if(WITH_PYTHON)
              if(WITH_PYTHON_MODULE AND PYTHON_ROOT_DIR)
                find_package(PythonLibsUnix REQUIRED)
              endif()
            else()
              find_program(PYTHON_EXECUTABLE "python3")
            endif()
          endif()
          # <<< IOS PATCH

          # Prefer lib directory paths
          file(GLOB LIB_SUBDIRS ${LIBDIR}/*)
          set(CMAKE_PREFIX_PATH ${LIB_SUBDIRS})

          # -------------------------------------------------------------------------
          # Find precompiled libraries, and avoid system or user-installed ones.

          if(EXISTS ${LIBDIR})
            include(platform_old_libs_update)
            without_system_libs_begin()
          endif()

          if(WITH_ALEMBIC)
            find_package(Alembic)
          endif()

          if(WITH_USD)
            find_package(USD REQUIRED)
          endif()
          add_bundled_libraries(usd/lib)

          if(WITH_MATERIALX)
            find_package(MaterialX)
            set_and_warn_library_found("MaterialX" MaterialX_FOUND WITH_MATERIALX)
          endif()
          add_bundled_libraries(materialx/lib)

          if(WITH_OPENSUBDIV)
            find_package(OpenSubdiv)
          endif()
          add_bundled_libraries(opensubdiv/lib)

          if(WITH_CODEC_SNDFILE)
            find_package(SndFile)
            find_library(_sndfile_FLAC_LIBRARY NAMES flac HINTS ${LIBDIR}/sndfile/lib)
            find_library(_sndfile_OGG_LIBRARY NAMES ogg HINTS ${LIBDIR}/ffmpeg/lib)
            find_library(_sndfile_VORBIS_LIBRARY NAMES vorbis HINTS ${LIBDIR}/ffmpeg/lib)
            find_library(_sndfile_VORBISENC_LIBRARY NAMES vorbisenc HINTS ${LIBDIR}/ffmpeg/lib)
            list(APPEND LIBSNDFILE_LIBRARIES
              ${_sndfile_FLAC_LIBRARY}
              ${_sndfile_OGG_LIBRARY}
              ${_sndfile_VORBIS_LIBRARY}
              ${_sndfile_VORBISENC_LIBRARY}
            )

            print_found_status("SndFile libraries" "${LIBSNDFILE_LIBRARIES}")
            unset(_sndfile_FLAC_LIBRARY)
            unset(_sndfile_OGG_LIBRARY)
            unset(_sndfile_VORBIS_LIBRARY)
            unset(_sndfile_VORBISENC_LIBRARY)
          endif()

          if(WITH_PYTHON)
            # >>> IOS PATCH: Already set above, so skip find_package for iOS
            if(NOT BLENDER_IOS_BUILD)
              if(NOT (WITH_PYTHON_MODULE AND PYTHON_ROOT_DIR))
                find_package(PythonLibsUnix REQUIRED)
              endif()
            endif()
            # <<< IOS PATCH
          endif()

          if(WITH_FFTW3)
            find_package(Fftw3)
          endif()

          # FreeType compiled with Brotli compression for woff2.
          find_package(Freetype REQUIRED)
          set(BROTLI_LIBRARIES
            ${LIBDIR}/brotli/lib/libbrotlicommon-static.a
            ${LIBDIR}/brotli/lib/libbrotlidec-static.a
          )

          if(WITH_HARFBUZZ)
            find_package(Harfbuzz)
          endif()

          if(WITH_FRIBIDI)
            find_package(Fribidi)
          endif()

          # Header dependency of required OpenImageIO.
          # >>> IOS PATCH: For iOS, manually set OpenEXR paths and skip find_package.
          # For macOS host tools, avoid REQUIRED to prevent failure when config files missing.
          if(BLENDER_IOS_BUILD)
            set(OPENEXR_INCLUDE_DIR "${LIBDIR}/openexr/include/OpenEXR" CACHE PATH "" FORCE)
            set(OPENEXR_LIBRARY "${LIBDIR}/openexr/lib/libOpenEXR.dylib" CACHE FILEPATH "" FORCE)
            set(OPENEXR_FOUND TRUE CACHE BOOL "" FORCE)
            set(OpenEXR_FOUND TRUE CACHE BOOL "" FORCE)
            message(STATUS "iOS OpenEXR forced: ${OPENEXR_LIBRARY}")
          else()
            # For macOS build (including host tools), try to find, but don't fail if not found.
            find_package(OpenEXR QUIET)
            if(NOT OPENEXR_FOUND)
              # Fallback: set manually using LIBDIR (in case precompiled libs exist)
              set(OPENEXR_INCLUDE_DIR "${LIBDIR}/openexr/include/OpenEXR")
              set(OPENEXR_LIBRARY "${LIBDIR}/openexr/lib/libOpenEXR.dylib")
              set(OPENEXR_FOUND TRUE)
              set(OpenEXR_FOUND TRUE)
              message(STATUS "OpenEXR manually set to: ${OPENEXR_LIBRARY}")
            endif()
          endif()
          # <<< IOS PATCH
          add_bundled_libraries(openexr/lib)
          add_bundled_libraries(imath/lib)

          string(APPEND PLATFORM_CFLAGS " -pipe -funsigned-char -fno-strict-aliasing -ffp-contract=off")
          set(PLATFORM_LINKFLAGS "\
          -fexceptions -framework CoreServices -framework Foundation -framework IOKit -framework AppKit -framework Cocoa \
          -framework Carbon -framework AudioUnit -framework AudioToolbox -framework CoreAudio -framework Metal \
          -framework QuartzCore"
          )

          if(WITH_CODEC_FFMPEG)
            set(FFMPEG_ROOT_DIR ${LIBDIR}/ffmpeg)
            set(FFMPEG_FIND_COMPONENTS
              avcodec avdevice avfilter avformat avutil
              mp3lame ogg opus swresample swscale
              theora theoradec theoraenc vorbis vorbisenc
              vorbisfile vpx x264)
            # Frameworks required by libavfilter, using legacy macOS CGL
            string(APPEND PLATFORM_LINKFLAGS " -framework CoreImage -framework OpenGL")
            if(EXISTS ${LIBDIR}/ffmpeg/lib/libaom.a)
              list(APPEND FFMPEG_FIND_COMPONENTS aom)
            endif()
            if(EXISTS ${LIBDIR}/ffmpeg/lib/libx265.a)
              list(APPEND FFMPEG_FIND_COMPONENTS x265)
            endif()
            if(EXISTS ${LIBDIR}/ffmpeg/lib/libxvidcore.a)
              list(APPEND FFMPEG_FIND_COMPONENTS xvidcore)
            endif()
            find_package(FFmpeg)
          endif()

          if(WITH_IMAGE_OPENJPEG OR WITH_CODEC_FFMPEG)
            # use openjpeg from libdir that is linked into ffmpeg
            find_package(OpenJPEG)
          endif()

          find_library(SYSTEMSTUBS_LIBRARY
            NAMES
            SystemStubs
            PATHS
          )
          mark_as_advanced(SYSTEMSTUBS_LIBRARY)
          if(SYSTEMSTUBS_LIBRARY)
            list(APPEND PLATFORM_LINKLIBS SystemStubs)
          endif()

          if(WITH_OPENIMAGEDENOISE)
            if("${CMAKE_OSX_ARCHITECTURES}" STREQUAL "arm64")
              # OpenImageDenoise uses BNNS from the Accelerate framework.
              string(APPEND PLATFORM_LINKFLAGS " -framework Accelerate")
            endif()
          endif()

          if(WITH_JACK)
            string(APPEND PLATFORM_LINKFLAGS " -F/Library/Frameworks -weak_framework jackmp")
          endif()

          if(WITH_VULKAN_BACKEND)
            find_package(ShaderC REQUIRED)
            find_package(Vulkan REQUIRED)
          endif()

          if(WITH_SDL)
            find_package(SDL3 REQUIRED CONFIG)
          endif()
          add_bundled_libraries(sdl/lib)

          set(EPOXY_ROOT_DIR ${LIBDIR}/epoxy)
          find_package(Epoxy REQUIRED)

          set(PNG_ROOT ${LIBDIR}/png)
          find_package(PNG REQUIRED)

          set(JPEG_ROOT ${LIBDIR}/jpeg)
          find_package(JPEG REQUIRED)

          set(fmt_ROOT ${LIBDIR}/fmt)
          find_package(fmt REQUIRED)

          if(WITH_IMAGE_WEBP)
            set(WEBP_ROOT_DIR ${LIBDIR}/webp)
            find_package(WebP REQUIRED)
          endif()

          if(WITH_CODEC_FFMPEG)
            string(APPEND PLATFORM_LINKFLAGS " -liconv") # ffmpeg needs it !
          endif()

          if(WITH_PUGIXML)
            find_package(PugiXML REQUIRED)
          endif()

          find_package(OpenImageIO REQUIRED)
          add_bundled_libraries(openimageio/lib)

          find_package(OpenColorIO 2.0.0 REQUIRED CONFIG)
          add_bundled_libraries(opencolorio/lib)

          if(WITH_OPENVDB)
            find_package(OpenVDB)
            find_library(BLOSC_LIBRARIES NAMES blosc HINTS ${LIBDIR}/openvdb/lib)
            if(BLOSC_LIBRARIES)
              list(APPEND OPENVDB_LIBRARIES ${BLOSC_LIBRARIES})
            else()
              unset(BLOSC_LIBRARIES CACHE)
            endif()
            if(OPENVDB_FOUND)
              set(OPENVDB_DEFINITIONS "")
            endif()
          endif()
          add_bundled_libraries(openvdb/lib)

          if(WITH_NANOVDB)
            find_package(NanoVDB)
          endif()

          test_neon_support()
          if(SUPPORTS_NEON_BUILD)
            find_package(sse2neon REQUIRED)
          endif()

          if(WITH_LLVM)
            find_package(LLVM)
            if(NOT LLVM_FOUND)
              message(FATAL_ERROR "LLVM not found.")
            endif()
            if(WITH_CLANG)
              find_package(Clang)
              if(NOT CLANG_FOUND)
                message(FATAL_ERROR "Clang not found.")
              endif()
            endif()

          endif()

          if(WITH_CYCLES AND WITH_CYCLES_OSL)
            find_package(OSL 1.13.4 REQUIRED)
          endif()
          add_bundled_libraries(osl/lib)
          # OSL dependency
          add_bundled_libraries(openjph/lib)

          if(WITH_CYCLES AND WITH_CYCLES_EMBREE)
            find_package(Embree 4.0.0 REQUIRED)
          endif()
          add_bundled_libraries(embree/lib)

          if(WITH_OPENIMAGEDENOISE)
            find_package(OpenImageDenoise REQUIRED)
            add_bundled_libraries(openimagedenoise/lib)
          endif()

          if(WITH_TBB)
            find_package(TBB 2021.13.0 REQUIRED)
            if(TBB_FOUND)
              get_target_property(TBB_LIBRARIES TBB::tbb LOCATION)
              get_target_property(TBB_INCLUDE_DIRS TBB::tbb INTERFACE_INCLUDE_DIRECTORIES)
            endif()
            set_and_warn_library_found("TBB" TBB_FOUND WITH_TBB)
          endif()
          add_bundled_libraries(tbb/lib)

          if(WITH_POTRACE)
            find_package(Potrace REQUIRED)
          endif()

          if(WITH_XR_OPENXR)
            find_package(XR_OpenXR_SDK REQUIRED)
          endif()
          add_bundled_libraries(xr_openxr_sdk/lib)

          if(WITH_GMP)
            find_package(GMP REQUIRED)
          endif()

          if(WITH_HARU)
            find_package(Haru REQUIRED)
          endif()

          if(WITH_MANIFOLD)
            find_package(manifold REQUIRED)
          endif()

          if(WITH_RUBBERBAND)
            find_package(Rubberband REQUIRED)
          endif()

          if(WITH_CYCLES AND WITH_CYCLES_PATH_GUIDING)
            find_package(openpgl QUIET)
            if(openpgl_FOUND)
              get_target_property(OPENPGL_LIBRARIES openpgl::openpgl LOCATION)
              get_target_property(OPENPGL_INCLUDE_DIR openpgl::openpgl INTERFACE_INCLUDE_DIRECTORIES)
              message(STATUS "Found OpenPGL: ${OPENPGL_LIBRARIES}")
            else()
              set(WITH_CYCLES_PATH_GUIDING OFF)
              message(STATUS "OpenPGL not found, disabling WITH_CYCLES_PATH_GUIDING")
            endif()
          endif()

          find_package(Eigen3 REQUIRED CONFIG)

          if(WITH_LIBMV)
            find_package(Ceres REQUIRED CONFIG)
          endif()
          add_bundled_libraries(ceres/lib)

          set(ZSTD_ROOT_DIR ${LIBDIR}/zstd)
          find_package(Zstd REQUIRED)

          if(WITH_DRACO)
            find_package(draco REQUIRED CONFIG)
          endif()
          add_bundled_libraries(draco/lib)

          if(WITH_MESHOPTIMIZER)
            find_package(meshoptimizer REQUIRED CONFIG)
          endif()
          add_bundled_libraries(meshoptimizer/lib)

          if(WITH_TRACY)
            set(Tracy_ROOT_DIR ${LIBDIR}/tracy)
            find_package(Tracy REQUIRED CONFIG)
          endif()

          if(EXISTS ${LIBDIR})
            without_system_libs_end()
          endif()

          # Restore to default.
          set(CMAKE_FIND_FRAMEWORK FIRST)

          # ---------------------------------------------------------------------
          # Set compiler and linker flags.

          set(EXETYPE MACOSX_BUNDLE)

          set(CMAKE_C_FLAGS_DEBUG "-g")
          set(CMAKE_CXX_FLAGS_DEBUG "-g")
          if(CMAKE_OSX_ARCHITECTURES MATCHES "x86_64" OR CMAKE_OSX_ARCHITECTURES MATCHES "i386")
            set(CMAKE_CXX_FLAGS_RELEASE "-O2 -mdynamic-no-pic -msse -msse2 -msse3 -mssse3")
            set(CMAKE_C_FLAGS_RELEASE "-O2 -mdynamic-no-pic  -msse -msse2 -msse3 -mssse3")
            if(NOT CMAKE_C_COMPILER_ID MATCHES "Clang")
              string(APPEND CMAKE_C_FLAGS_RELEASE " -ftree-vectorize  -fvariable-expansion-in-unroller")
              string(APPEND CMAKE_CXX_FLAGS_RELEASE " -ftree-vectorize  -fvariable-expansion-in-unroller")
            endif()
          else()
            set(CMAKE_C_FLAGS_RELEASE "-O2 -mdynamic-no-pic")
            set(CMAKE_CXX_FLAGS_RELEASE "-O2 -mdynamic-no-pic")
          endif()

          # Clang has too low template depth of 128 for libmv.
          string(APPEND CMAKE_CXX_FLAGS " -ftemplate-depth=1024")

          # Avoid conflicts with Luxrender, and other plug-ins that may use the same
          # libraries as Blender with a different version or build options.
          set(PLATFORM_SYMBOLS_MAP ${CMAKE_SOURCE_DIR}/source/creator/symbols_apple.map)
          set(PLATFORM_LINKFLAGS_SYMBOL_HIDING "-Wl,-unexported_symbols_list,'${PLATFORM_SYMBOLS_MAP}'")

          if("${CMAKE_OSX_ARCHITECTURES}" STREQUAL "x86_64" AND WITH_LEGACY_MACOS_X64_LINKER)
            # Silence "no platform load command found in <static library>, assuming: macOS".
            #
            # NOTE: Using ld_classic costs minutes of extra linking time.
            string(APPEND PLATFORM_LINKFLAGS " -Wl,-ld_classic")
          else()
            # Silence "ld: warning: ignoring duplicate libraries".
            #
            # The warning is introduced with Xcode 15 and is triggered when the same library
            # is passed to the linker multiple times. This situation could happen with either
            # cyclic libraries, or some transitive dependencies where CMake might decide to
            # pass library to the linker multiple times to force it re-scan symbols. It is
            # not necessary for Xcode linker to ensure all symbols from library are used and
            # it is corrected in CMake 3.29:
            #    https://gitlab.kitware.com/cmake/cmake/-/issues/25297
            string(APPEND PLATFORM_LINKFLAGS " -Xlinker -no_warn_duplicate_libraries")

            # Silence: ld: warning: reducing alignment of section __DATA,__common from 0x8000
            #          to 0x4000 because it exceeds segment maximum alignment
            # The flag to silence this warning is only available on Xcode 26.4 and above.
            if(${XCODE_VERSION} VERSION_GREATER_EQUAL 26.4)
              string(APPEND PLATFORM_LINKFLAGS " -Xlinker -no_warn_reduced_section_align")
            endif()
          endif()

          # Make stack size more similar to Embree, required for Embree.
          string(APPEND PLATFORM_LINKFLAGS_EXECUTABLE " -Wl,-stack_size,0x100000")

          # Suppress ranlib "has no symbols" warnings (workaround for #48250).
          set(CMAKE_C_ARCHIVE_CREATE   "<CMAKE_AR> Scr <TARGET> <LINK_FLAGS> <OBJECTS>")
          set(CMAKE_CXX_ARCHIVE_CREATE "<CMAKE_AR> Scr <TARGET> <LINK_FLAGS> <OBJECTS>")
          # llvm-ranlib doesn't support this flag. Xcode's libtool does.
          if(NOT ${CMAKE_RANLIB} MATCHES ".*llvm-ranlib$")
            set(CMAKE_C_ARCHIVE_FINISH   "<CMAKE_RANLIB> -no_warning_for_no_symbols -c <TARGET>")
            set(CMAKE_CXX_ARCHIVE_FINISH "<CMAKE_RANLIB> -no_warning_for_no_symbols -c <TARGET>")
          endif()

          if(WITH_COMPILER_CCACHE)
            if(NOT CMAKE_GENERATOR STREQUAL "Xcode")
              find_program(CCACHE_PROGRAM ccache)
              mark_as_advanced(CCACHE_PROGRAM)
              if(CCACHE_PROGRAM)
                # Makefiles and ninja
                set(CMAKE_C_COMPILER_LAUNCHER   "${CCACHE_PROGRAM}" CACHE STRING "" FORCE)
                set(CMAKE_CXX_COMPILER_LAUNCHER "${CCACHE_PROGRAM}" CACHE STRING "" FORCE)
                mark_as_advanced(
                  CMAKE_C_COMPILER_LAUNCHER
                  CMAKE_CXX_COMPILER_LAUNCHER
                )
              else()
                message(WARNING "Ccache NOT found, disabling WITH_COMPILER_CCACHE")
                set(WITH_COMPILER_CCACHE OFF)
              endif()
            endif()
          endif()

          if(WITH_COMPILER_ASAN)
            list(APPEND PLATFORM_BUNDLED_LIBRARIES ${COMPILER_ASAN_LIBRARY})
          endif()

          if(PLATFORM_BUNDLED_LIBRARIES)
            # For the installed Python module and installed Blender executable, we set the
            # rpath to the location where install step will copy the shared libraries.
            set(CMAKE_SKIP_INSTALL_RPATH FALSE)
            if(WITH_PYTHON_MODULE)
              list(APPEND CMAKE_INSTALL_RPATH "@loader_path/lib")
            else()
              list(APPEND CMAKE_INSTALL_RPATH "@loader_path/../Resources/lib")
            endif()

            # For binaries that are built but not installed (like makesdna or tests), we add
            # the original directory of all shared libraries to the rpath. This is needed because
            # these can be in different folders, and because the build and install folder may be
            # different.
            set(CMAKE_SKIP_BUILD_RPATH FALSE)
            list(APPEND CMAKE_BUILD_RPATH ${PLATFORM_BUNDLED_LIBRARY_DIRS})

            # Environment variables to run precompiled executables that needed libraries.
            list(JOIN PLATFORM_BUNDLED_LIBRARY_DIRS ":" _library_paths)
            # Intentionally double "$$" which expands into "$" when instantiated.
            set(PLATFORM_ENV_BUILD "DYLD_LIBRARY_PATH=\"${_library_paths}:$$DYLD_LIBRARY_PATH\"")
            set(PLATFORM_ENV_INSTALL "DYLD_LIBRARY_PATH=${CMAKE_INSTALL_PREFIX_WITH_CONFIG}/Blender.app/Contents/Resources/lib/:$$DYLD_LIBRARY_PATH")
            unset(_library_paths)
          endif()

          # Same as `CFBundleIdentifier` in Info.plist.
          set(CMAKE_XCODE_ATTRIBUTE_PRODUCT_BUNDLE_IDENTIFIER "org.blenderfoundation.blender")
          EOF
          echo "✅ Overwritten platform_apple.cmake with patched version"
          # 验证文件已写入
          head -30 build_files/cmake/platform/platform_apple.cmake

      # ============================================================
      # 16. 🚀 构建交叉编译工具链（显式传递 HOME）
      # ============================================================
      - name: Build cross compile tools first
        if: steps.cmake_config.outcome == 'success'
        run: |
          cd blender/build_ios
          export HOME="/Users/runner"
          xcodebuild \
            -project Blender.xcodeproj \
            -target blender_cross_tools_compile \
            -sdk iphoneos \
            -configuration Release \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ARCHS=arm64 \
            HOME="$HOME"

      # ============================================================
      # 17. 编译主应用（显式传递 HOME）
      # ============================================================
      - name: Build Blender.app for iOS
        if: steps.cmake_config.outcome == 'success'
        run: |
          cd blender/build_ios
          export HOME="/Users/runner"
          xcodebuild \
            -project Blender.xcodeproj \
            -target install \
            -sdk iphoneos \
            -configuration Release \
            -parallelizeTargets \
            -jobs 4 \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            HOME="$HOME"

      # ============================================================
      # 18. 打包成未签名 IPA
      # ============================================================
      - name: Package unsigned IPA
        if: steps.cmake_config.outcome == 'success'
        run: |
          cd blender/build_ios
          APP=$(find . -name "Blender.app" -type d | head -1)
          if [ -z "$APP" ]; then
            echo "ERROR: Blender.app not found!"
            find . -name "*.app" -type d
            exit 1
          fi
          echo "Found app at: $APP"
          du -sh "$APP"
          mkdir -p IPA/Payload
          cp -r "$APP" IPA/Payload/
          cd IPA && zip -r ../Blender.ipa Payload/ && cd ..
          ls -lh Blender.ipa

      # ============================================================
      # 19. 上传 IPA
      # ============================================================
      - name: Upload IPA
        if: steps.cmake_config.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: blender-ipad-unsigned
          path: blender/build_ios/Blender.ipa
          retention-days: 30

      # ============================================================
      # 20. 失败时上传日志
      # ============================================================
      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            blender/build_ios/**/*.log
            blender/build_ios/**/*.txt
            blender/build_ios/CMakeCache.txt
            blender/build_ios/CMakeFiles/CMakeError.log
          retention-days: 7