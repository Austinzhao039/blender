name: Build Blender iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 210

    steps:
      - name: Install dependencies
        run: |
          brew install git-lfs cmake wget
          git lfs install

      - name: Clone Blender from official source
        run: |
          git clone https://projects.blender.org/blender/blender.git -b ios --depth 1
          cd blender
          git lfs pull

      - name: Clone precompiled libraries (macOS + iOS)
        run: |
          cd blender
          # macOS 库
          rm -rf lib/macos_arm64
          git clone https://projects.blender.org/blender/lib-macos_arm64.git lib/macos_arm64
          cd lib/macos_arm64 && git lfs pull && cd ../..
          # iOS 库（不含 Python）
          rm -rf lib/ios_arm64
          git clone https://projects.blender.org/blender/lib-ios_arm64.git lib/ios_arm64
          cd lib/ios_arm64 && git lfs pull && cd ../..

      # ========== 核心修复：手动下载 Python 3.13 库 ==========
      - name: Download Python 3.13 for iOS
        run: |
          cd blender/lib/ios_arm64
          
          # 从 Blender 官方服务器下载 Python 3.13 预编译包
          PYTHON_URL="https://download.blender.org/ftp/source/lib/ios_arm64/python-3.13.0-ios-arm64.tar.xz"
          
          echo "Downloading Python 3.13 from $PYTHON_URL..."
          wget --no-check-certificate -O python.tar.xz "$PYTHON_URL" || \
            curl -L -o python.tar.xz "$PYTHON_URL"
          
          if [ -f python.tar.xz ]; then
            echo "Extracting Python..."
            tar -xf python.tar.xz
            rm python.tar.xz
            echo "✅ Python 3.13 installed successfully!"
          else
            echo "❌ Failed to download Python!"
            exit 1
          fi
          
          # 验证
          ls -la python/

      - name: Verify Python library
        run: |
          cd blender
          if [ -d "lib/ios_arm64/python" ] && [ -f "lib/ios_arm64/python/lib/libpython3.13.a" ]; then
            echo "✅ Python 3.13 library found!"
            ls -la lib/ios_arm64/python/lib/
          else
            echo "❌ Python 3.13 library still missing!"
            exit 1
          fi

      - name: Generate Xcode project
        run: |
          cd blender
          rm -rf build_ios
          cmake -G Xcode -S . -B build_ios \
            -DWITH_GTESTS=OFF \
            -DWITH_TESTS=OFF \
            -DWITH_DOCS=OFF

      - name: Build Blender.app for iOS
        run: |
          cd blender/build_ios
          xcodebuild \
            -project Blender.xcodeproj \
            -target install \
            -sdk iphoneos \
            -configuration Release \
            -parallelizeTargets \
            -jobs 4 \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO

      - name: Package unsigned IPA
        run: |
          cd blender/build_ios
          APP=$(find . -name "Blender.app" -type d | head -1)
          if [ -z "$APP" ]; then
            echo "ERROR: Blender.app not found!"
            find . -name "*.app" -type d
            exit 1
          fi
          echo "Found app at: $APP"
          du -sh "$APP"
          mkdir -p IPA/Payload
          cp -r "$APP" IPA/Payload/
          cd IPA && zip -r ../Blender.ipa Payload/ && cd ..
          ls -lh Blender.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: blender-ipad-unsigned
          path: blender/build_ios/Blender.ipa
          retention-days: 30

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            blender/build_ios/**/*.log
            blender/build_ios/**/*.txt
          retention-days: 7