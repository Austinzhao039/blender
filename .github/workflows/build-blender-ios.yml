name: Build Blender iOS IPA

on:
  workflow_dispatch:
    inputs:
      ios_libs_repo:
        description: Optional GitHub repo (owner/name) for iOS prebuilt libs
        required: false
        default: ''
      ios_libs_ref:
        description: Branch or tag for the iOS prebuilt libs repo
        required: false
        default: main

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 180

    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          lfs: false

      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf ~/Library/Android
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /Library/Developer/CoreSimulator/Profiles
          sudo xcrun simctl delete all 2>/dev/null || true
          df -h

      - name: Install dependencies
        run: brew install git-lfs cmake autoconf automake bison dos2unix flex libtool meson ninja pkg-config yasm

      - name: Initialize Git LFS
        run: git lfs install

      - name: Compute iOS libs cache key
        id: ios-libs-cache-key
        env:
          IOS_LIBS_REPO: ${{ inputs.ios_libs_repo }}
          IOS_LIBS_REF: ${{ inputs.ios_libs_ref }}
        run: |
          if [ -n "$IOS_LIBS_REPO" ]; then
            repo_url="https://github.com/${IOS_LIBS_REPO}.git"
            repo_key="${IOS_LIBS_REPO//\//-}"
            ref_sha="$(git ls-remote "$repo_url" "refs/heads/${IOS_LIBS_REF}" "refs/tags/${IOS_LIBS_REF}" | python3 -c 'import sys; lines=[line.strip() for line in sys.stdin if line.strip()]; print(lines[0].split()[0] if lines else "")')"
            if [ -z "$ref_sha" ]; then
              echo "Could not resolve iOS libs ref '${IOS_LIBS_REF}' in ${IOS_LIBS_REPO}" >&2
              exit 1
            fi
            printf 'source=fork\n' >> "$GITHUB_OUTPUT"
            printf 'repo=%s\n' "$IOS_LIBS_REPO" >> "$GITHUB_OUTPUT"
            printf 'repo_key=%s\n' "$repo_key" >> "$GITHUB_OUTPUT"
            printf 'ref=%s\n' "$IOS_LIBS_REF" >> "$GITHUB_OUTPUT"
            printf 'sha=%s\n' "$ref_sha" >> "$GITHUB_OUTPUT"
          else
            printf 'source=submodule\n' >> "$GITHUB_OUTPUT"
            printf 'repo=upstream-submodule\n' >> "$GITHUB_OUTPUT"
            printf 'repo_key=upstream-submodule\n' >> "$GITHUB_OUTPUT"
            printf 'ref=main\n' >> "$GITHUB_OUTPUT"
            printf 'sha=%s\n' "$(git rev-parse HEAD:lib/ios_arm64)" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore iOS prebuilt libraries cache
        id: ios-libs-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            lib/ios_arm64
            .git/modules/lib/ios_arm64
          key: ${{ runner.os }}-ios-arm64-libs-${{ steps.ios-libs-cache-key.outputs.repo_key }}-${{ steps.ios-libs-cache-key.outputs.sha }}-bootstrap-v2

      - name: Fetch prebuilt iOS libraries
        if: steps.ios-libs-cache.outputs.cache-hit != 'true' && steps.ios-libs-cache-key.outputs.source == 'submodule'
        run: python3 ./build_files/utils/make_update.py --use-ios-libraries

      - name: Clone iOS prebuilt libs fork
        if: steps.ios-libs-cache.outputs.cache-hit != 'true' && steps.ios-libs-cache-key.outputs.source == 'fork'
        env:
          IOS_LIBS_REPO: ${{ steps.ios-libs-cache-key.outputs.repo }}
          IOS_LIBS_REF: ${{ steps.ios-libs-cache-key.outputs.ref }}
        run: |
          rm -rf lib/ios_arm64
          git clone --depth=1 --branch "$IOS_LIBS_REF" "https://github.com/${IOS_LIBS_REPO}.git" lib/ios_arm64
          git -C lib/ios_arm64 lfs pull

      - name: Verify fmt prebuilt
        run: |
          if [ ! -f lib/ios_arm64/fmt/include/fmt/core.h ]; then
            echo "ERROR: fmt not found in lib/ios_arm64. Build it once on macOS and commit it to your lib-ios_arm64 fork." >&2
            exit 1
          fi

      - name: Save iOS prebuilt libraries cache
        if: steps.ios-libs-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            lib/ios_arm64
            .git/modules/lib/ios_arm64
          key: ${{ runner.os }}-ios-arm64-libs-${{ steps.ios-libs-cache-key.outputs.repo_key }}-${{ steps.ios-libs-cache-key.outputs.sha }}-bootstrap-v2

      - name: Generate Xcode project
        run: cmake -G Xcode -S . -B build_ios

      - name: List Xcode targets
        run: xcodebuild -project build_ios/Blender.xcodeproj -list

      - name: Build cross-compilation tools
        run: |
          xcodebuild \
            -project build_ios/Blender.xcodeproj \
            -target blender_cross_tools_compile \
            -configuration Release \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Build Blender.app for iOS
        run: |
          xcodebuild \
            -project build_ios/Blender.xcodeproj \
            -target install \
            -sdk iphoneos \
            -configuration Release \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ARCHS=arm64

      - name: Package unsigned IPA
        run: |
          APP="build_ios/bin/Release/Blender.app"
          echo "Found app at: $APP"
          ls -la "$APP" || (echo "App not found, searching..." && find build_ios -name "*.app" -type d)
          du -sh "$APP"
          rm -rf "$APP/Assets/5.0/python/lib/python3.11/config-3.11-darwin"
          mkdir -p IPA/Payload
          cp -r "$APP" IPA/Payload/
          cd IPA && zip -r ../Blender.ipa Payload/
          ls -lh ../Blender.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: blender-ipad-unsigned
          path: Blender.ipa
          retention-days: 30

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build_ios/**/*.log
            build_ios/**/*.txt
          retention-days: 7
