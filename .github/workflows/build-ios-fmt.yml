name: Build iOS fmt Prebuilt

on:
  workflow_dispatch:
    inputs:
      fmt_version:
        description: fmt version to build
        required: false
        default: 12.1.0
      ios_deployment_target:
        description: iOS deployment target
        required: false
        default: '16.0'
      libs_repo:
        description: Optional GitHub repo (owner/name) to receive fmt
        required: false
        default: ''
      libs_ref:
        description: Branch to update in the iOS libs repo
        required: false
        default: main

jobs:
  build-fmt:
    runs-on: macos-15
    timeout-minutes: 60

    steps:
      - name: Build fmt for iOS arm64
        env:
          FMT_VERSION: ${{ inputs.fmt_version }}
          IOS_DEPLOYMENT_TARGET: ${{ inputs.ios_deployment_target }}
        run: |
          curl -L "https://github.com/fmtlib/fmt/archive/refs/tags/${FMT_VERSION}.tar.gz" | tar xz
          cmake -S "fmt-${FMT_VERSION}" -B "fmt-${FMT_VERSION}/build_ios" \
            -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET="${IOS_DEPLOYMENT_TARGET}" \
            -DCMAKE_INSTALL_PREFIX="$PWD/fmt-out" \
            -DFMT_TEST=OFF \
            -DFMT_DOC=OFF \
            -DBUILD_SHARED_LIBS=OFF
          cmake --build "fmt-${FMT_VERSION}/build_ios" --config Release
          cmake --install "fmt-${FMT_VERSION}/build_ios" --config Release

      - name: Upload fmt artifact
        uses: actions/upload-artifact@v4
        with:
          name: fmt-ios-arm64-${{ inputs.fmt_version }}
          path: fmt-out
          retention-days: 14

      - name: Initialize Git LFS
        if: ${{ inputs.libs_repo != '' }}
        run: git lfs install

      - name: Checkout iOS libs fork
        if: ${{ inputs.libs_repo != '' }}
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.libs_repo }}
          ref: ${{ inputs.libs_ref }}
          token: ${{ secrets.IOS_LIBS_PUSH_TOKEN }}
          path: lib-ios_arm64
          lfs: true

      - name: Commit fmt into iOS libs fork
        if: ${{ inputs.libs_repo != '' }}
        env:
          FMT_VERSION: ${{ inputs.fmt_version }}
        run: |
          mkdir -p lib-ios_arm64/fmt
          rm -rf lib-ios_arm64/fmt/include lib-ios_arm64/fmt/lib
          cp -R fmt-out/include lib-ios_arm64/fmt/include
          cp -R fmt-out/lib lib-ios_arm64/fmt/lib
          git -C lib-ios_arm64 add fmt/
          if git -C lib-ios_arm64 diff --cached --quiet; then
            exit 0
          fi
          git -C lib-ios_arm64 -c user.name='OpenCode CI' -c user.email='opencode-ci@users.noreply.github.com' commit -m "Add fmt ${FMT_VERSION} for iOS arm64"
          git -C lib-ios_arm64 push origin HEAD:${{ inputs.libs_ref }}
