name: 环境监测 iOS（未签名 IPA）

# 这个 workflow 挂在 blender 仓库里，只是因为它是个「能跑 macOS runner 的公开仓库」，
# 跟 Blender 完全无关。两条保证不互相干扰：
#   ① paths 过滤 —— 只有 iotmonitor-ios/ 下的文件变了才会触发；
#   ② 隔壁两个 Blender workflow 都是纯 workflow_dispatch，不会被 push 误触发。
#
# 产物：Artifact（用 API 直接下，不污染 Release 列表）。

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'iotmonitor-ios/**'
      - '.github/workflows/ios-app.yml'

permissions:
  contents: read

jobs:
  build:
    name: build-unsigned-ipa
    runs-on: macos-14
    timeout-minutes: 30
    defaults:
      run:
        working-directory: iotmonitor-ios

    steps:
      - name: 取代码
        uses: actions/checkout@v4

      - name: 看环境
        run: |
          xcodebuild -version
          sw_vers
          xcrun --sdk iphoneos --show-sdk-version

      - name: 构建（完全不签名）
        run: |
          set -eux
          xcodebuild \
            -project IoMonitor.xcodeproj \
            -scheme IoMonitor \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: 打成未签名 IPA
        run: |
          set -eux
          APP="build/Build/Products/Release-iphoneos/IoMonitor.app"
          test -d "$APP"

          # IPA 必须是 Payload/xxx.app 的结构，目录名不能改
          rm -rf out && mkdir -p out/Payload
          cp -R "$APP" out/Payload/

          # 结构自检：包名/版本/可执行文件都得在，否则装上去会白图标或闪退
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Info.plist"
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP/Info.plist"
          EXE=$(/usr/libexec/PlistBuddy -c "Print :CFBundleExecutable" "$APP/Info.plist")
          ls -l "$APP/$EXE"
          test -f "$APP/Assets.car" || echo "⚠ 没有 Assets.car（图标可能没编进去）"

          cd out && zip -qry ../IoMonitor-unsigned.ipa Payload
          cd .. && ls -l IoMonitor-unsigned.ipa && md5 IoMonitor-unsigned.ipa

      - name: 上传 Artifact
        uses: actions/upload-artifact@v4
        with:
          # 注意：uses 步骤不吃 defaults.run.working-directory，路径要从仓库根写
          name: IoMonitor-unsigned-ipa
          path: iotmonitor-ios/IoMonitor-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
